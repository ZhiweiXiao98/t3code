def releaseVersionName = gradle.startParameter.projectProperties.get("t3codeVersionName")
def releaseVersionCode = gradle.startParameter.projectProperties.get("t3codeVersionCode")

gradle.beforeProject { project ->
  if (project.path != ":app") {
    return
  }
  if (!releaseVersionName || !releaseVersionCode) {
    throw new GradleException("t3codeVersionName and t3codeVersionCode are required.")
  }

  project.pluginManager.withPlugin("com.android.application") {
    project.extensions.getByName("androidComponents").finalizeDsl { extension ->
      extension.defaultConfig.versionName = releaseVersionName
      extension.defaultConfig.versionCode = Integer.parseInt(releaseVersionCode)
    }
  }
}
