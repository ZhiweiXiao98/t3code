name: Focused browser diagnosis at 01120d1

on:
  push:
    branches: [diagnostics/browser-focused-01120d1]

permissions:
  contents: read

concurrency:
  group: browser-focused-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 01120d1dcfa3b7a331cb0fc5e987ce7daf862d72
  EXPECTED_BRANCH: diagnostics/browser-focused-01120d1
  CLIENT_VERSION: 0.1.9-zh.1
  CI: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  T3CODE_DESKTOP_SIGNED: "false"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  focused:
    name: Observe focused case (${{ matrix.test_case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test_case: [palette, linked-pr, persisted-project]
    env:
      TEST_CASE: ${{ matrix.test_case }}
    steps:
      - name: Verify repository and diagnostic push
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          with open(os.environ['GITHUB_EVENT_PATH']) as stream:
              event = json.load(stream)
          assert os.environ['GITHUB_REPOSITORY'] == 'ZhiweiXiao98/t3code'
          assert event['repository']['private'] is False
          assert os.environ['GITHUB_EVENT_NAME'] == 'push'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + os.environ['EXPECTED_BRANCH']
          assert re.fullmatch('[0-9a-f]{40}', os.environ['GITHUB_SHA'])
          assert event['after'] == os.environ['GITHUB_SHA']
          PY
      - name: Load reviewed helper then checkout exact test source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "$SOURCE_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          python3 - <<'PY'
          import os, subprocess
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['SOURCE_SHA'], 'HEAD'], text=True
          ).splitlines()
          assert set(changed) == {
              '.github/workflows/browser-focused-diagnostic.yml',
              '.github/scripts/observe-focused-browser-tests.py',
              '.github/diagnostics/CommandPalette.persistedProject.diagnostic.browser.test.tsx',
          }, changed
          PY
          cp .github/scripts/observe-focused-browser-tests.py "$RUNNER_TEMP/observe-focused-browser-tests.py"
          cp .github/diagnostics/CommandPalette.persistedProject.diagnostic.browser.test.tsx "$RUNNER_TEMP/persisted-project-diagnostic.tsx"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          if [[ "$TEST_CASE" == persisted-project ]]; then
            cp "$RUNNER_TEMP/persisted-project-diagnostic.tsx" \
              apps/web/src/components/CommandPalette.persistedProject.diagnostic.browser.test.tsx
            printf 'Hypothesis-only test overlay: dedicated clean/stale project cases; no production source changes.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'Diagnostic workflow: %s\nUnchanged test source: %s\nFocused case: %s\n' \
            "$GITHUB_SHA" "$SOURCE_SHA" "$TEST_CASE" >> "$GITHUB_STEP_SUMMARY"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Install Linux native build libraries
        run: python3 .github/scripts/ci-ubuntu-packages.py packages libsecret-1-dev pkg-config build-essential imagemagick
      - name: Install exact web Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser_cli=apps/web/node_modules/playwright/cli.js
          python3 .github/scripts/ci-ubuntu-packages.py playwright "$browser_cli"
          node "$browser_cli" install --only-shell chromium
      - name: Run selected full file exactly once
        id: tests
        shell: bash
        run: python3 "$RUNNER_TEMP/observe-focused-browser-tests.py"
      - name: Verify full-file counts and unchanged source
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          case = os.environ['TEST_CASE']
          expected = {'palette': 6, 'linked-pr': 1, 'persisted-project': 2}[case]
          filename = {
              'palette': 'src/components/CommandPalette.browser.test.tsx',
              'linked-pr': 'src/components/ThreadStatusIndicators.linkedPr.browser.test.tsx',
              'persisted-project': 'src/components/CommandPalette.persistedProject.diagnostic.browser.test.tsx',
          }[case]
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'web-browser-diagnostics'
          outcome = json.loads((out / 'outcome.json').read_text())
          metadata = json.loads((out / 'metadata.json').read_text())
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['SOURCE_SHA']
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--exit-code'], check=True)
          assert metadata['command'] == [
              'vp', 'test', 'run', '--passWithNoTests', '--project', 'unit',
              '--project', 'browser', filename,
          ]
          assert metadata['source']['stdout'].strip() == source
          if case == 'persisted-project':
              expected_overlay = subprocess.check_output([
                  'git', 'show', os.environ['GITHUB_SHA'] +
                  ':.github/diagnostics/CommandPalette.persistedProject.diagnostic.browser.test.tsx',
              ])
              assert pathlib.Path('apps/web', filename).read_bytes() == expected_overlay
          assert outcome['test_exit_code'] == 0, outcome['test_exit_code']
          assert not outcome['log']['truncated']
          text = re.sub(r'\x1b\[[0-9;]*m', '', (out / 'web-test.log').read_text())
          file_summary = [line.strip() for line in re.findall(r'^\s*Test Files\s+(.+)$', text, re.M)]
          test_summary = [line.strip() for line in re.findall(r'^\s*Tests\s+(.+)$', text, re.M)]
          assert file_summary == ['1 passed (1)'], file_summary
          assert test_summary == [f'{expected} passed ({expected})'], test_summary
          assert re.search(re.escape(filename) + rf' \({expected} tests?\)', text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f'{case}: {expected} tests passed once. This is focused evidence only; the failed full gate remains failed.\n')
          PY
      - name: Preserve bounded diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-focused-${{ matrix.test_case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-browser-diagnostics/
          if-no-files-found: error
          retention-days: 14
