name: Exact signed ARM64 candidate macOS HVF installation
'on':
  push:
    branches:
    - validation/v0.1.9-signed-android-install-74039745-macos-staged-install
permissions:
  contents: read
  actions: read
concurrency:
  group: android-exact-candidate-install-740
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'ZhiweiXiao98/t3code' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
    - name: Validate original signed candidate, install and capture actual screens
      env:
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nmkdir \"$RUNNER_TEMP/install-tools\"\ncd \"$RUNNER_TEMP/install-tools\"\
        \ncat > staged_install.py <<'LOCAL_REVIEWED_EOF'\n\"\"\"Single exact APK transfer and single PM\
        \ install; no retry, reinstall or privilege flags.\"\"\"\nimport json,re,time\nfrom pathlib import\
        \ Path\nPACKAGE='com.zhiweixiao.t3code.zhcn'\nREMOTE='/data/local/tmp/t3-original-candidate.apk'\n\
        def need(v,m):\n if not v:raise ValueError(m)\ndef snapshot(adb,out,run,label):\n # Full PackageManager\
        \ dump contains active/historical install sessions, unlike\n # list-staged-sessions (which only\
        \ covers reboot-staged installs/APEX).\n records=[]\n for name,args in [('path',['shell','pm','path',PACKAGE]),('package',['shell','dumpsys','package',PACKAGE]),('sessions',['shell','dumpsys','package']),('processes',['shell','ps','-A']),('transfer-file',['shell','ls','-l',REMOTE])]:\n\
        \  try:run([adb,'-s','emulator-5554',*args],out/(label+'-'+name+'.txt'),timeout=15,check=False);records.append({'probe':name,'captured':True})\n\
        \  except Exception as e:records.append({'probe':name,'captured':False,'exception':type(e).__name__})\n\
        \ (out/(label+'-diagnostics.json')).write_text(json.dumps(records,indent=2)+'\\n')\ndef install(adb,apk,pins,out,run):\n\
        \ out=Path(out);stage='pre-install';started=time.monotonic()\n def ad(*args,name,timeout,check=True):return\
        \ run([adb,'-s','emulator-5554',*args],out/name,timeout=timeout,check=check)\n try:\n  existing=ad('shell','pm','path',PACKAGE,name='pre-install-path.txt',timeout=30,check=False)\n\
        \  need(not any(line.startswith('package:') for line in existing.splitlines()),'unexpected already\
        \ installed candidate; do not replace')\n  stage='transfer'\n  ad('push',str(apk),REMOTE,name='apk-push.txt',timeout=180)\n\
        \  stage='device-byte-verification'\n  size=ad('shell','stat','-c','%s',REMOTE,name='device-apk-size.txt',timeout=30).strip()\n\
        \  need(size.isdigit() and int(size)==pins['apk_size'],'transferred APK size mismatch')\n  digest=ad('shell','sha256sum',REMOTE,name='device-apk-sha256.txt',timeout=60).strip()\n\
        \  need(re.fullmatch(re.escape(pins['apk_sha256'])+r'\\s+'+re.escape(REMOTE),digest) is not None,'transferred\
        \ APK SHA256 mismatch')\n  stage='package-manager-install'\n  # Default install/compiler policy,\
        \ no -g, -r, -d, verification disable or ABI override.\n  result=ad('shell','pm','install',REMOTE,name='pm-install.txt',timeout=480)\n\
        \  need(result.strip()=='Success','PM did not report exact installation success')\n  (out/'install-stage.json').write_text(json.dumps({'completed':True,'stage':stage,'elapsed_seconds':time.monotonic()-started,'transfer_sha256':pins['apk_sha256'],'pm_reported_success':True,'attempts':1})+'\\\
        n')\n except Exception as e:\n  (out/'install-stage.json').write_text(json.dumps({'completed':False,'stage':stage,'elapsed_seconds':time.monotonic()-started,'exception':type(e).__name__,'attempts':1,'installation_state':'UNKNOWN\
        \ until recorded PM diagnostics; no automatic retry'})+'\\n')\n  snapshot(adb,out,run,'install-failure')\n\
        \  raise\n # No timeout recovery or second install. Original caller still pulls installed\n #\
        \ base.apk and verifies exact hash/package/version/ABI before any launch.\n snapshot(adb,out,run,'post-install')\n\
        LOCAL_REVIEWED_EOF\ncat > runtime_host.py <<'LOCAL_REVIEWED_EOF'\n\"\"\"Existing macOS Intel HVF\
        \ only; no permissions or system settings changed.\"\"\"\nimport os,re,json,time,subprocess\n\
        from pathlib import Path\ndef need(v,m):\n if not v:raise ValueError(m)\ndef clean_env():\n return\
        \ {k:v for k,v in os.environ.items() if k not in ('GITHUB_TOKEN','GH_TOKEN','LD_LIBRARY_PATH','LD_PRELOAD','DYLD_LIBRARY_PATH','DYLD_INSERT_LIBRARIES','ANDROID_I_WANT_MY_TCG')}\n\
        def check_host(em,out,run):\n need(run(['/usr/bin/uname','-s']).strip()=='Darwin','macOS only')\n\
        \ need(run(['/usr/bin/uname','-m']).strip()=='x86_64','Intel only')\n run(['/usr/bin/sw_vers'],out/'macos-version.txt')\n\
        \ accel=run([em,'-accel-check'],out/'acceleration.txt',timeout=60)\n need(re.search(r'(?m)^0\\\
        s*$',accel) and 'Hypervisor.Framework' in accel,'existing HVF acceleration unavailable; no settings\
        \ changes')\n run([em,'-version'],out/'emulator-version.txt',timeout=60)\ndef wait_services(adb,out,proc,*,budget=180,clock=time.monotonic,sleep=time.sleep,execute=subprocess.run):\n\
        \ deadline=clock()+budget;attempt=0\n commands=[('activity-service',['service','check','activity']),('package-service',['service','check','package']),('input-service',['service','check','input']),('android-package',['cmd','package','list','packages','android']),('activity-user',['cmd','activity','get-current-user']),('input-state',['dumpsys','input'])]\n\
        \ while clock()<deadline:\n  need(proc.poll() is None,'emulator exited before system services\
        \ became ready')\n  attempt+=1;ok=True;observations=[]\n  for label,args in commands:\n   remaining=deadline-clock()\n\
        \   if remaining<=0:ok=False;break\n   try:\n    p=execute([str(adb),'-s','emulator-5554','shell',*args],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=min(10,remaining),env=clean_env())\n\
        \    raw=p.stdout;text=raw.decode(errors='replace');passed=p.returncode==0\n    if label.endswith('-service'):passed=passed\
        \ and re.search(r'(?m)^Service '+args[-1]+r': found\\s*$',text) is not None\n    elif label=='android-package':passed=passed\
        \ and 'package:android' in text.splitlines()\n    elif label=='activity-user':passed=passed and\
        \ re.fullmatch(r'\\d+',text.strip()) is not None\n    else:passed=passed and bool(text.strip())\
        \ and ('Input Manager State' in text or 'INPUT MANAGER' in text)\n    observations.append({'command':args,'returncode':p.returncode,'ready':bool(passed)})\n\
        \   except subprocess.TimeoutExpired as e:\n    raw=e.output or b'';passed=False;observations.append({'command':args,'timeout':True,'ready':False})\n\
        \   (out/f'service-ready-{attempt:03d}-{label}.txt').write_bytes(raw)\n   ok=ok and bool(passed)\n\
        \  (out/'service-readiness.json').write_text(json.dumps({'attempt':attempt,'ready':ok,'budget_seconds':budget,'commands':observations},indent=2)+'\\\
        n')\n  if ok:return\n  remaining=deadline-clock()\n  if remaining>0:sleep(min(5,remaining))\n\
        \ raise ValueError('Android activity/package/input services not ready within bounded wait; APK\
        \ not installed')\n\ndef existing_build_tools(sdk,out):\n candidates=[]\n for p in (Path(sdk)/'build-tools').iterdir():\n\
        \  if re.fullmatch(r'\\d+\\.\\d+\\.\\d+',p.name) and all((p/n).is_file() for n in ('aapt2','apksigner')):candidates.append(p)\n\
        \ need(candidates,'no existing complete Android build-tools; do not install software')\n selected=max(candidates,key=lambda\
        \ p:tuple(map(int,p.name.split('.'))))\n (out/'build-tools-selection.json').write_text(json.dumps({'path':str(selected),'installed':False})+'\\\
        n')\n return selected\nLOCAL_REVIEWED_EOF\ncat > runtime_image.py <<'LOCAL_REVIEWED_EOF'\n\"\"\
        \"One official SDK package, existing licenses only; no host permission changes.\"\"\"\nimport\
        \ hashlib,json,subprocess,re\nfrom pathlib import Path\nPACKAGE='system-images;android-30;google_apis;x86_64'\n\
        def need(v,m):\n if not v:raise ValueError(m)\ndef sha(b):return hashlib.sha256(b).hexdigest()\n\
        def licenses(sdk):\n p=Path(sdk)/'licenses'\n if not p.is_dir():return {}\n files=list(p.iterdir());need(all(f.is_file()\
        \ and not f.is_symlink() for f in files),'unexpected license entry')\n return {f.name:sha(f.read_bytes())\
        \ for f in sorted(files)}\ndef properties(raw):\n values={}\n for line in raw.decode().splitlines():\n\
        \  if '=' in line and not line.lstrip().startswith('#'):\n   k,v=line.split('=',1);need(k.strip()\
        \ not in values,'duplicate SDK property');values[k.strip()]=v.strip()\n need(values.get('AndroidVersion.ApiLevel')=='30'\
        \ and values.get('SystemImage.Abi')=='x86_64' and values.get('SystemImage.TagId')=='google_apis','wrong\
        \ official image kind')\n need(re.fullmatch(r'\\d+(?:\\.\\d+)*',values.get('Pkg.Revision','')),'missing\
        \ image revision')\n return values\n\ndef ensure(sdk,pins,out,run):\n sdk=Path(sdk);out=Path(out);image=sdk/'system-images/android-30/google_apis/x86_64';before=licenses(sdk)\n\
        \ (out/'sdk-licenses-before.json').write_text(json.dumps(before,sort_keys=True)+'\\n')\n installed=False\n\
        \ if not image.is_dir():\n  need(pins.get('allow_official_image_install') is True,'reviewed image\
        \ missing; install disabled')\n  need(before,'no existing accepted SDK license records; do not\
        \ accept new licenses')\n  manager=sdk/'cmdline-tools/latest/bin/sdkmanager';need(manager.is_file(),'existing\
        \ SDK manager missing')\n  # Never --licenses, never yes; every unforeseen license prompt gets\
        \ a refusal.\n  try:run([manager,'--install',PACKAGE,'--channel=0'],out/'image-install.txt',timeout=360,input=b'n\\\
        n'*100)\n  finally:\n   after=licenses(sdk);(out/'sdk-licenses-after.json').write_text(json.dumps(after,sort_keys=True)+'\\\
        n')\n   need(after==before,'license records changed unexpectedly; halt without restoration')\n\
        \  installed=True\n need(image.is_dir(),'official image unavailable or license was not previously\
        \ accepted')\n raw=(image/'source.properties').read_bytes();meta=properties(raw)\n # Optional\
        \ exact previously-observed pin. Null means record actual official fixed-package revision, not\
        \ fabricate one.\n if pins.get('image_source_properties_sha256') is not None:need(sha(raw)==pins['image_source_properties_sha256'],'reviewed\
        \ image revision changed')\n (out/'image-source.properties').write_bytes(raw)\n result={'package':PACKAGE,'installed_this_run':installed,'source_properties_sha256':sha(raw),'properties':meta,'license_records_unchanged':licenses(sdk)==before,'new_license_accepted':False}\n\
        \ need(result['license_records_unchanged'],'license records changed')\n (out/'image-runtime.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\\\
        n');return result\n\ndef ensure_emulator(sdk,pins,out,run):\n sdk=Path(sdk);out=Path(out);em=sdk/'emulator/emulator';before=licenses(sdk)\n\
        \ if not em.is_file():\n  need(pins.get('allow_official_emulator_install') is True and before,'official\
        \ emulator missing or existing licenses unavailable')\n  manager=sdk/'cmdline-tools/latest/bin/sdkmanager';need(manager.is_file(),'SDK\
        \ manager missing')\n  try:run([manager,'--install','emulator','--channel=0'],out/'emulator-install.txt',timeout=360,input=b'n\\\
        n'*100)\n  finally:need(licenses(sdk)==before,'license records changed unexpectedly')\n need(em.is_file(),'official\
        \ emulator unavailable or license refused')\n props=(sdk/'emulator/source.properties').read_bytes();(out/'emulator-source.properties').write_bytes(props)\n\
        \ h=sha(em.read_bytes())\n if pins.get('emulator_binary_sha256') is not None:need(h==pins['emulator_binary_sha256'],'reviewed\
        \ emulator changed')\n (out/'emulator-binary.json').write_text(json.dumps({'sha256':h,'source_properties_sha256':sha(props),'new_license_accepted':False,'license_records':licenses(sdk)},indent=2)+'\\\
        n');return em\nLOCAL_REVIEWED_EOF\ncat > install_candidate.py <<'LOCAL_REVIEWED_EOF'\n\"\"\"Candidate-only\
        \ exact ARM64 APK install/launch evidence. Not release approval.\"\"\"\nimport os,json,re,hashlib,subprocess,time,urllib.request,urllib.error,urllib.parse,zipfile,stat\n\
        import runtime_image,runtime_host,staged_install\nfrom pathlib import Path\nSOURCE='74039745b1b44834c30dd9cb275f1c224072dd96'\n\
        CERT='82f2437cbceb94fe6fe4a60a1c0de99f643124c64a648a27de9ce92bd39ecd88'\nPACKAGE='com.zhiweixiao.t3code.zhcn';VERSION='0.1.9-zh.2';CODE=1000417\n\
        APK='T3-Code-zh-CN-Android-0.1.9-zh.2-arm64-v8a.apk'\nREPO='ZhiweiXiao98/t3code';BRANCH='validation/v0.1.9-signed-android-install-74039745-macos-staged-install'\n\
        WORKFLOW='.github/workflows/android-install-candidate.yml'\ndef need(v,m):\n if not v:raise ValueError(m)\n\
        def sha(b):return hashlib.sha256(b).hexdigest()\ndef run(args,out=None,timeout=90,input=None,check=True):\n\
        \ started=time.monotonic();started_utc=time.strftime(\"%Y-%m-%dT%H:%M:%SZ\",time.gmtime())\n try:\n\
        \  p=subprocess.run([str(a) for a in args],input=input,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=timeout,env=runtime_host.clean_env())\n\
        \ except subprocess.TimeoutExpired as error:\n  if out:\n   raw=error.output or b'';Path(out).write_bytes(raw\
        \ if isinstance(raw,bytes) else raw.encode())\n   Path(str(out)+'.timing.json').write_text(json.dumps({'started_utc':started_utc,'status':'timeout','timeout_seconds':timeout,'elapsed_seconds':time.monotonic()-started,'partial_output_preserved':True})+'\\\
        n')\n  raise\n if out:\n  Path(out).write_bytes(p.stdout)\n  Path(str(out)+'.timing.json').write_text(json.dumps({'started_utc':started_utc,'status':'completed','returncode':p.returncode,'elapsed_seconds':time.monotonic()-started})+'\\\
        n')\n if check:need(p.returncode==0,'command failed: '+str(args[0])+'; see captured evidence')\n\
        \ return p.stdout.decode(errors='replace')\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n\
        \ def redirect_request(self,*a,**kw):return None\nclass API:\n def get(self,path):\n  need(path.startswith('/'),'API\
        \ suffix');req=urllib.request.Request('https://api.github.com/repos/'+REPO+path,headers={'Authorization':'Bearer\
        \ '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})\n  return urllib.request.build_opener(NoRedirect()).open(req,timeout=60)\n\
        \ def json(self,path):\n  with self.get(path) as r:return json.load(r)\n def download(self,p,dest):\n\
