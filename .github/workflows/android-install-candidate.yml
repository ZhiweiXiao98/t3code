        \ or u.hostname.endswith('.githubusercontent.com') or u.hostname.endswith('.actions.githubusercontent.com')),'storage\
        \ origin')\n  size=p['artifact_api']['size_in_bytes'];h=hashlib.sha256();total=0\n  with urllib.request.build_opener(NoRedirect()).open(url,timeout=120)\
        \ as r,Path(dest).open('xb') as f:\n   while True:\n    b=r.read(min(1048576,size-total+1))\n\
