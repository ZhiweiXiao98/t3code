        \ reviewed image only')\n need(p['artifact_api']['workflow_run']['id']==p['producer_api']['run_id']==p['run_api']['id'],'signed\
        \ producer binding')\n need(p['artifact_api']['workflow_run']['head_sha']==p['producer_api']['head_sha']==p['run_api']['head_sha'],'signed\
        \ operation binding')\n need(p['run_api']['conclusion']==p['producer_api']['conclusion']=='success','sign\
        \ success')\n need(p['run_api']['id']==44006894711 and p['producer_api']['id']==133784319512 and\
