name: Read-only signed Android byte preflight 740
on:
  push:
    branches: [validation/v0.1.9-signed-preflight-74039745]
permissions:
  contents: read
  actions: read
concurrency:
  group: signed-preflight-74039745
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Materialize reviewed read-only preflight (no checkout)
        run: |
          python - <<'PYCODE'
          import base64,zlib,json,hashlib,pathlib
          raw=zlib.decompress(base64.b64decode(""))
          assert hashlib.sha256(raw).hexdigest()=="8cea3dfa7dd2dc1f1ac9b6bbfd12ce48e3cf570d0c5ccae81beee02bb98d87d3"
          files=json.loads(raw)
          assert set(files)=={'signed_preflight.py','pins.json'}
          for name,content in files.items(): pathlib.Path(name).write_text(content)
          PYCODE
      - name: Verify exact signed bytes and inspect existing Android tools only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python signed_preflight.py
      - name: Preserve small public receipts only
        uses: actions/upload-artifact@v7
        with:
          name: signed-apk-preflight-${{ github.run_id }}
          path: receipt/
          if-no-files-found: error
          retention-days: 14
