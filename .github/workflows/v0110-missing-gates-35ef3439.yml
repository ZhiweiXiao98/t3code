# Supplemental evidence only; never replaces the formal ARM15 or complete release gates.
name: v0.1.10 exact-source supplemental gates
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: community-supplemental-35ef3439
  cancel-in-progress: false
env:
  CLIENT_VERSION: 0.1.10-zh.1
  CI: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  T3CODE_DESKTOP_SIGNED: "false"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
"on":
  push:
    branches:
      - validation/v0110-missing-gates-35ef3439
jobs:
  source:
    name: Validate reviewed supplemental source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/github-script@v8
        id: source
        with:
          script: |
            const source = '35ef3439dccdd9dec290f4b11ee1652a4057b9a7';
            const sourceTree = '6dfe58be951e07abea4fcfc446c8a6d3c54c0e29';
            const branch = 'validation/v0110-missing-gates-35ef3439';
            const workflowPath = '.github/workflows/v0110-missing-gates-35ef3439.yml';
            const {owner, repo} = context.repo;
            function require(condition, message) { if (!condition) throw new Error(message); }
            require(owner === 'ZhiweiXiao98' && repo === 't3code', 'Unexpected repository');
            require(context.payload.repository.private === false, 'Public repository required');
            require(context.eventName === 'push' && context.ref === 'refs/heads/' + branch, 'Unexpected trigger');
            require(process.env.GITHUB_RUN_ATTEMPT === '1', 'Single activation only');
            const getCommit = async commit_sha => (await github.rest.git.getCommit({owner, repo, commit_sha})).data;
            const op = await getCommit(context.sha);
            require(op.parents.length === 1 && op.message.split('\n')[0] === 'ci: activate reviewed 35ef3439 supplemental gates once', 'Unexpected operation commit');
            const reviewed = await getCommit(op.parents[0].sha);
            require(reviewed.parents.length === 1 && reviewed.parents[0].sha === source, 'Reviewed commit must directly follow source');
            require(reviewed.message.split('\n')[0] === 'ci: prepare 35ef3439 supplemental gates [skip ci]', 'Unexpected reviewed commit');
            require(op.tree.sha === reviewed.tree.sha, 'Activation must not change reviewed tree');
            const baseline = await getCommit(source);
            require(baseline.tree.sha === sourceTree, 'Unexpected source tree');
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead: source + '...' + reviewed.sha})).data;
            require(comparison.status === 'ahead' && comparison.ahead_by === 1 && comparison.behind_by === 0 && comparison.total_commits === 1, 'Unexpected reviewed history');
            require(comparison.files?.length === 1 && comparison.files[0].filename === workflowPath && comparison.files[0].status === 'added', 'Only the supplemental workflow may differ');
            const changed = comparison.files[0];
            require(changed.sha && changed.changes > 0 && changed.deletions === 0, 'Invalid added workflow');
            const prs = (await github.rest.pulls.list({owner, repo, state: 'open', head: owner + ':' + branch, base: 'review/v0.1.10-zh', per_page: 100})).data;
            require(prs.length === 1 && prs[0].draft === true && prs[0].head.sha === context.sha && prs[0].base.sha === source, 'Exact reviewed draft PR required');
            core.info(JSON.stringify({source, sourceTree, operation: op.sha, operationTree: op.tree.sha, reviewed: reviewed.sha, workflowBlob: changed.sha, pr: prs[0].number, run: context.runId, attempt: process.env.GITHUB_RUN_ATTEMPT, supplementalOnly: true}));
            core.setOutput('sha', source);
  native-rust-quality:
    name: Rust native formatting and tests
    needs:
      - source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - name: Check all native Rust crates
        run:
          "for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do\n  cargo fmt --manifest-path \"native/$crate/Cargo.toml\"\
          \ -- --check\n  cargo test --locked --manifest-path \"native/$crate/Cargo.toml\"\ndone\n"
  mobile-native-quality:
    name: Mobile native static analysis
    needs:
      - source
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile --filter @t3tools/scripts...
      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile
      - name: Lint Swift and Kotlin sources
        run: vp run lint:mobile
      - name: Run native review diff Swift regressions
        run: bash apps/mobile/modules/t3-review-diff/tests/run-ios.sh
  tests:
    name: Tests (${{ matrix.suite }})
    needs:
      - source
    runs-on: ${{ startsWith(matrix.suite, 'server-') && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - clients
          - server-1
          - server-2
          - server-3
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile
      - name: Install Linux native build libraries
        run: python3 .github/scripts/ci-ubuntu-packages.py packages libsecret-1-dev pkg-config build-essential imagemagick
      - run: vp run --filter @t3tools/desktop ensure:electron
        if: matrix.suite == 'clients'
      - name: Install Chromium for web and server browser tests
        if: matrix.suite != 'clients'
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run:
          "set -euo pipefail\nbrowser_cli=apps/server/node_modules/playwright-core/cli.js\nif [[ \"$SUITE\" == web ]]; then\n\
          \  browser_cli=apps/web/node_modules/playwright/cli.js\nfi\npython3 .github/scripts/ci-ubuntu-packages.py playwright \"$browser_cli\"\nnode \"$browser_cli\" install --only-shell\
          \ chromium\nif [[ \"$SUITE\" == server-* ]]; then\n  test \"$(node -p \"require('./apps/server/node_modules/playwright-core/package.json').version\"\
          )\" = \"$(node -p \"require('./apps/server/package.json').dependencies['playwright-core']\")\"\n  browser_revision=$(node\
          \ -p \"require('./apps/server/node_modules/playwright-core/browsers.json').browsers.find(browser => browser.name ===\
          \ 'chromium-headless-shell').revision\")\n  browser_root=\"$HOME/.cache/ms-playwright/chromium_headless_shell-$browser_revision\"\
          \n  mapfile -t browsers < <(find \"$browser_root\" -type f -name chrome-headless-shell)\n  test \"${#browsers[@]}\"\
          \ -eq 1\n  browser=\"${browsers[0]}\"\n  test -x \"$browser\"\n  test \"${T3CODE_SERVER_BROWSER_SANDBOX:-1}\" != 0\n\
          \  echo \"T3CODE_TEST_HEADLESS_SHELL=$browser\" >> \"$GITHUB_ENV\"\n  node -p \"JSON.stringify({node: process.version,\
          \ undici: process.versions.undici, playwright: require('./apps/server/node_modules/playwright-core/package.json').version})\"\
          \n  \"$browser\" --version\n  sha256sum \"$browser\"\nfi\n"
      - name: Check release and preview orchestration helpers
        if: matrix.suite == 'clients'
        run: "python3 -B .github/scripts/ci-ubuntu-packages.test.py

          python3 -B .github/scripts/stage-preview-bundle.test.py

          node --test .github/scripts/check-nightly-release.test.cjs .github/scripts/vercel-deployment-output.test.cjs

          "
      - name: Run tests
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run:
          "set -euo pipefail\nif [[ \"$SUITE\" == clients ]]; then\n  vp run --parallel --concurrency-limit 2 --filter '!t3'\
          \ --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test\nelif [[ \"$SUITE\" == web ]]; then\n  python3 .github/scripts/observe-web-tests.py\nelse\n  vp run --filter t3 test --shard \"${SUITE#server-}/3\"\nfi\n"
      - name: Detect transfer budget report
        id: transfer_budget
        if: always() && startsWith(matrix.suite, 'server-')
        run:
          "if test -s \"$RUNNER_TEMP/thread-transfer-result.json\"; then\n  echo \"present=true\" >> \"$GITHUB_OUTPUT\"\n\
          \  cat \"$RUNNER_TEMP/t3code-transfer-budget.md\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
      - uses: actions/upload-artifact@v7
        if: always() && steps.transfer_budget.outputs.present == 'true'
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Boot the built web client
        if: matrix.suite == 'web'
        run: "vp run --filter @t3tools/web build

          node apps/web/scripts/verify-built-boot.ts

          "
      - name: Preserve Web browser diagnostics
        if: ${{ always() && matrix.suite == 'web' }}
        uses: actions/upload-artifact@v7
        with:
          name: web-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-browser-diagnostics/
          if-no-files-found: error
          retention-days: 14
  web-shards:
    name: Web full coverage shard ${{ matrix.shard }}/4
    needs:
      - source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile
      - name: Install Linux native build libraries
        run: python3 .github/scripts/ci-ubuntu-packages.py packages libsecret-1-dev pkg-config build-essential imagemagick
      - name: Install Chromium for web and server browser tests
        shell: bash
        env:
          SUITE: web
        run:
          "set -euo pipefail\nbrowser_cli=apps/server/node_modules/playwright-core/cli.js\nif [[ \"$SUITE\" == web\
          \ ]]; then\n  browser_cli=apps/web/node_modules/playwright/cli.js\nfi\npython3 .github/scripts/ci-ubuntu-packages.py\
          \ playwright \"$browser_cli\"\nnode \"$browser_cli\" install --only-shell chromium\nif [[ \"$SUITE\" == server-*\
          \ ]]; then\n  test \"$(node -p \"require('./apps/server/node_modules/playwright-core/package.json').version\"\
          )\" = \"$(node -p \"require('./apps/server/package.json').dependencies['playwright-core']\")\"\n  browser_revision=$(node\
          \ -p \"require('./apps/server/node_modules/playwright-core/browsers.json').browsers.find(browser => browser.name\
          \ === 'chromium-headless-shell').revision\")\n  browser_root=\"$HOME/.cache/ms-playwright/chromium_headless_shell-$browser_revision\"\
          \n  mapfile -t browsers < <(find \"$browser_root\" -type f -name chrome-headless-shell)\n  test \"${#browsers[@]}\"\
          \ -eq 1\n  browser=\"${browsers[0]}\"\n  test -x \"$browser\"\n  test \"${T3CODE_SERVER_BROWSER_SANDBOX:-1}\"\
          \ != 0\n  echo \"T3CODE_TEST_HEADLESS_SHELL=$browser\" >> \"$GITHUB_ENV\"\n  node -p \"JSON.stringify({node:\
          \ process.version, undici: process.versions.undici, playwright: require('./apps/server/node_modules/playwright-core/package.json').version})\"\
          \n  \"$browser\" --version\n  sha256sum \"$browser\"\nfi\n"
      - name: Run complete Web partition
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          WEB_SHARD: ${{ matrix.shard }}
        run: python3 .github/scripts/run-web-shard.py
      - name: Preserve partition evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-validation-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-browser-diagnostics/
          if-no-files-found: error
          retention-days: 14
  web-coverage:
    name: Require complete Web assertion coverage
    needs:
      - source
      - web-shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful producers
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          SHARDS_RESULT: ${{ needs.web-shards.result }}
        run: test "$SOURCE_RESULT" = success && test "$SHARDS_RESULT" = success
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - name: Verify own-run artifact producers and digests
        uses: actions/github-script@v8
        with:
          script:
            "const {owner, repo} = context.repo;\nconst run_id = context.runId;\nconst attempt = process.env.GITHUB_RUN_ATTEMPT;\n\
            const expected = new Set([1,2,3,4].map(i => `web-validation-shard-${i}-${run_id}-${attempt}`));\nconst all\
            \ = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id, per_page:100});\n\
            const artifacts = all.filter(a => expected.has(a.name));\nif (artifacts.length !== 4 || new Set(artifacts.map(a\
            \ => a.name)).size !== 4) throw new Error('Require exactly four own-run partition artifacts');\nfor (const\
            \ a of artifacts) {\n  if (a.expired || a.workflow_run?.id !== run_id || a.workflow_run?.head_sha !== context.sha\
            \ || !/^sha256:[a-f0-9]{64}$/.test(a.digest || '')) throw new Error('Artifact producer identity or digest\
            \ invalid');\n}\ncore.info(JSON.stringify(artifacts.map(a => ({id:a.id,name:a.name,digest:a.digest,run:a.workflow_run.id,head:a.workflow_run.head_sha}))));\n"
      - uses: actions/download-artifact@v8
        with:
          pattern: web-validation-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-partitions
      - name: Verify every original file and named assertion
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: 'set -euo pipefail

          python3 .github/scripts/verify-web-shards.test.py

          python3 .github/scripts/verify-web-shards.py --root "$RUNNER_TEMP/web-partitions" --manifest .github/scripts/web-test-inventory.json
          --source "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --workflow-sha "$GITHUB_SHA"
          --lock-hash "$(sha256sum pnpm-lock.yaml | cut -d" " -f1)" | tee "$RUNNER_TEMP/web-coverage.json"

          '
      - uses: actions/upload-artifact@v7
        with:
          name: web-complete-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-coverage.json
          if-no-files-found: error
          retention-days: 14
  web-built-boot:
    name: Build and boot validated Web client
    needs:
      - source
      - web-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile
      - name: Install Linux native build libraries
        run: python3 .github/scripts/ci-ubuntu-packages.py packages libsecret-1-dev pkg-config build-essential imagemagick
      - name: Install Chromium for web and server browser tests
        shell: bash
        env:
          SUITE: web
        run:
          "set -euo pipefail\nbrowser_cli=apps/server/node_modules/playwright-core/cli.js\nif [[ \"$SUITE\" == web\
          \ ]]; then\n  browser_cli=apps/web/node_modules/playwright/cli.js\nfi\npython3 .github/scripts/ci-ubuntu-packages.py\
          \ playwright \"$browser_cli\"\nnode \"$browser_cli\" install --only-shell chromium\nif [[ \"$SUITE\" == server-*\
          \ ]]; then\n  test \"$(node -p \"require('./apps/server/node_modules/playwright-core/package.json').version\"\
          )\" = \"$(node -p \"require('./apps/server/package.json').dependencies['playwright-core']\")\"\n  browser_revision=$(node\
          \ -p \"require('./apps/server/node_modules/playwright-core/browsers.json').browsers.find(browser => browser.name\
          \ === 'chromium-headless-shell').revision\")\n  browser_root=\"$HOME/.cache/ms-playwright/chromium_headless_shell-$browser_revision\"\
          \n  mapfile -t browsers < <(find \"$browser_root\" -type f -name chrome-headless-shell)\n  test \"${#browsers[@]}\"\
          \ -eq 1\n  browser=\"${browsers[0]}\"\n  test -x \"$browser\"\n  test \"${T3CODE_SERVER_BROWSER_SANDBOX:-1}\"\
          \ != 0\n  echo \"T3CODE_TEST_HEADLESS_SHELL=$browser\" >> \"$GITHUB_ENV\"\n  node -p \"JSON.stringify({node:\
          \ process.version, undici: process.versions.undici, playwright: require('./apps/server/node_modules/playwright-core/package.json').version})\"\
          \n  \"$browser\" --version\n  sha256sum \"$browser\"\nfi\n"
      - name: Boot the built web client
        run: "vp run --filter @t3tools/web build

          node apps/web/scripts/verify-built-boot.ts

          "
  quality:
    name: Lint and typecheck
    needs:
      - source
      - tests
      - web-coverage
      - web-built-boot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require transfer measurements from this run
        uses: actions/download-artifact@v8
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer
      - name: Validate transfer measurements
        run: test -s "$RUNNER_TEMP/thread-transfer/thread-transfer-result.json"
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile
      - name: Reject repository-owned PR assets
        run:
          "files=\"$(git ls-files .github/pr-assets)\"\nif test -n \"$files\"; then\n  printf 'PR evidence must be uploaded\
          \ to GitHub, not committed:\\n%s\\n' \"$files\" >&2\n  exit 1\nfi\n"
      - run: vp run --filter @t3tools/desktop ensure:electron
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vp run knip:check
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vp run --filter @t3tools/source-control-github generate --check
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vp run --filter t3 generate --check
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/release-smoke.ts
      - name: Validate Linux QA helper regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: "set -euo pipefail

          python3 .github/scripts/test_appimage_publication.py

          python3 -m unittest discover -s .github/scripts/debian-guest/tests -p 'test_*.py' -v

          node .github/scripts/debian-guest/tests/test-privacy-driver.mjs

          node .github/scripts/debian-guest/tests/test-welcome-driver.mjs

          node .github/scripts/debian-guest/tests/test-typed-driver.mjs

          node .github/scripts/debian-guest/tests/test-supplemental-driver.mjs

          "
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vp check
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vp run -r --concurrency-limit 2 typecheck

