# Exact-SHA candidate only. Publication requires separate reviewed-artifact gates.
name: 简体中文客户端验证与构建
permissions:
  contents: read
  actions: read
concurrency:
  group: community-clients-${{ github.ref }}
  cancel-in-progress: true
env:
  CLIENT_VERSION: 0.1.9-zh.1
  CI: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  T3CODE_DESKTOP_SIGNED: "false"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
jobs:
  source:
    name: Validate exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/github-script@v8
        id: source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script:
            "if (context.repo.owner !== 'ZhiweiXiao98' || context.repo.repo !== 't3code') {\n  throw new Error('This workflow\
            \ is scoped to ZhiweiXiao98/t3code.');\n}\nif (context.payload.repository.private !== false) {\n  throw new Error('Standard\
            \ hosted runners are free for public repositories only.');\n}\nif (context.ref !== 'refs/heads/maintenance/v0.1.9-zh-cloud')\
            \ {\n  throw new Error('Dispatch must select maintenance/v0.1.9-zh-cloud.');\n}\nif (context.eventName === 'workflow_dispatch'\
            \ &&\n    (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_SHA || '') ||\n     process.env.EXPECTED_SHA !== context.sha))\
            \ {\n  throw new Error('Expected SHA must equal the selected branch commit exactly.');\n}\ncore.setOutput('sha',\
            \ context.sha);\ncore.summary.addRaw(`Source: ${context.sha}\\nVersion: 0.1.9-zh.1\\n`);\nawait core.summary.write();\n"
  quality:
    name: Lint and typecheck
    needs:
      - source
      - bundle
      - linux
      - desktop
      - android
      - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require transfer measurements from this run
        uses: actions/download-artifact@v8
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer
      - name: Validate transfer measurements
        run: test -s "$RUNNER_TEMP/thread-transfer/thread-transfer-result.json"
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile
      - name: Reject repository-owned PR assets
        run:
          "files=\"$(git ls-files .github/pr-assets)\"\nif test -n \"$files\"; then\n  printf 'PR evidence must be uploaded\
          \ to GitHub, not committed:\\n%s\\n' \"$files\" >&2\n  exit 1\nfi\n"
      - run: vp run --filter @t3tools/desktop ensure:electron
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vp run knip:check
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vp run --filter @t3tools/source-control-github generate --check
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vp run --filter t3 generate --check
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/release-smoke.ts
      - name: Validate Linux QA helper regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: "set -euo pipefail

          python3 -m unittest discover -s .github/scripts/debian-guest/tests -p 'test_*.py' -v

          node .github/scripts/debian-guest/tests/test-privacy-driver.mjs

          node .github/scripts/debian-guest/tests/test-welcome-driver.mjs

          node .github/scripts/debian-guest/tests/test-typed-driver.mjs

          "
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vp check
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vp run -r --concurrency-limit 2 typecheck
  native-rust-quality:
    name: Rust native formatting and tests
    needs:
      - source
      - bundle
      - linux
      - desktop
      - android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - name: Check all native Rust crates
        run:
          "for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do\n  cargo fmt --manifest-path \"native/$crate/Cargo.toml\"\
          \ -- --check\n  cargo test --locked --manifest-path \"native/$crate/Cargo.toml\"\ndone\n"
  mobile-native-quality:
    name: Mobile native static analysis
    needs:
      - source
      - bundle
      - linux
      - desktop
      - android
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile --filter @t3tools/scripts...
      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile
      - name: Lint Swift and Kotlin sources
        run: vp run lint:mobile
      - name: Run native review diff Swift regressions
        run: bash apps/mobile/modules/t3-review-diff/tests/run-ios.sh
  tests:
    name: Tests (${{ matrix.suite }})
    needs:
      - source
      - bundle
      - linux
      - desktop
      - android
    runs-on: ${{ startsWith(matrix.suite, 'server-') && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - clients
          - web
          - server-1
          - server-2
          - server-3
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile
      - name: Install Linux native build libraries
        run: "sudo apt-get update

          sudo apt-get install -y libsecret-1-dev pkg-config build-essential imagemagick

          "
      - run: vp run --filter @t3tools/desktop ensure:electron
        if: matrix.suite == 'clients'
      - name: Install Chromium for web and server browser tests
        if: matrix.suite != 'clients'
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run:
          "set -euo pipefail\nbrowser_cli=apps/server/node_modules/playwright-core/cli.js\nif [[ \"$SUITE\" == web ]]; then\n\
          \  browser_cli=apps/web/node_modules/playwright/cli.js\nfi\nnode \"$browser_cli\" install --with-deps --only-shell\
          \ chromium\nif [[ \"$SUITE\" == server-* ]]; then\n  test \"$(node -p \"require('./apps/server/node_modules/playwright-core/package.json').version\"\
          )\" = \"$(node -p \"require('./apps/server/package.json').dependencies['playwright-core']\")\"\n  browser_revision=$(node\
          \ -p \"require('./apps/server/node_modules/playwright-core/browsers.json').browsers.find(browser => browser.name ===\
          \ 'chromium-headless-shell').revision\")\n  browser_root=\"$HOME/.cache/ms-playwright/chromium_headless_shell-$browser_revision\"\
          \n  mapfile -t browsers < <(find \"$browser_root\" -type f -name chrome-headless-shell)\n  test \"${#browsers[@]}\"\
          \ -eq 1\n  browser=\"${browsers[0]}\"\n  test -x \"$browser\"\n  test \"${T3CODE_SERVER_BROWSER_SANDBOX:-1}\" != 0\n\
          \  echo \"T3CODE_TEST_HEADLESS_SHELL=$browser\" >> \"$GITHUB_ENV\"\n  node -p \"JSON.stringify({node: process.version,\
          \ undici: process.versions.undici, playwright: require('./apps/server/node_modules/playwright-core/package.json').version})\"\
          \n  \"$browser\" --version\n  sha256sum \"$browser\"\nfi\n"
      - name: Check release and preview orchestration helpers
        if: matrix.suite == 'clients'
        run: "python3 -B .github/scripts/stage-preview-bundle.test.py

          node --test .github/scripts/check-nightly-release.test.cjs .github/scripts/vercel-deployment-output.test.cjs

          "
      - name: Run tests
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run:
          "set -euo pipefail\nif [[ \"$SUITE\" == clients ]]; then\n  vp run --parallel --concurrency-limit 2 --filter '!t3'\
          \ --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test\nelif [[ \"$SUITE\" == web ]]; then\n  vp run --filter\
          \ @t3tools/web test\nelse\n  vp run --filter t3 test --shard \"${SUITE#server-}/3\"\nfi\n"
      - name: Detect transfer budget report
        id: transfer_budget
        if: always() && startsWith(matrix.suite, 'server-')
        run:
          "if test -s \"$RUNNER_TEMP/thread-transfer-result.json\"; then\n  echo \"present=true\" >> \"$GITHUB_OUTPUT\"\n\
          \  cat \"$RUNNER_TEMP/t3code-transfer-budget.md\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
      - uses: actions/upload-artifact@v7
        if: always() && steps.transfer_budget.outputs.present == 'true'
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Boot the built web client
        if: matrix.suite == 'web'
        run: "vp run --filter @t3tools/web build

          node apps/web/scripts/verify-built-boot.ts

          "
  bundle:
    name: Build validated desktop bundle
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile
      - name: Install Linux native build libraries
        run: "sudo apt-get update

          sudo apt-get install -y libsecret-1-dev pkg-config build-essential imagemagick

          "
      - run: node scripts/update-release-package-versions.ts "$CLIENT_VERSION"
      - run: vp run build:desktop
      - run: node apps/desktop/scripts/verify-preload-bundle.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: community-js-bundle
          path: "apps/server/dist

            apps/desktop/dist-electron

            "
          if-no-files-found: error
          retention-days: 7
  linux:
    name: Linux x64 and embedded Windows WSL runtime
    needs:
      - source
      - bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile
      - name: Install Linux native build libraries
        run: "sudo apt-get update

          sudo apt-get install -y libsecret-1-dev pkg-config build-essential imagemagick

          "
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - run: node scripts/update-release-package-versions.ts "$CLIENT_VERSION"
      - uses: actions/download-artifact@v8
        with:
          name: community-js-bundle
          path: apps
      - name: Package Linux client
        run:
          vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 --build-version "$CLIENT_VERSION" --skip-build
          --verbose
      - name: Launch packaged Linux client
        run: 'set -euo pipefail

          sudo apt-get install -y xvfb

          appimage=$(ls "$GITHUB_WORKSPACE"/release/*.AppImage)

          chmod +x "$appimage"

          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)

          xvfb-run -a node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" --executable "$RUNNER_TEMP/squashfs-root/t3code"

          '
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-launch-check-linux-x64
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore
          retention-days: 7
      - name: Build embedded WSL executable
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - name: Package and smoke-test embedded WSL runtime
        run: 'mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"

          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"

          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$CLIENT_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor"
          --output-dir wsl-runtime

          node scripts/smoke-cli-archive.ts --archive wsl-runtime/* --expect-version "$CLIENT_VERSION"

          '
      - uses: actions/upload-artifact@v7
        with:
          name: community-wsl-runtime
          path: wsl-runtime/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: client-linux-x64
          path: "release/*.AppImage

            release/*.deb

            "
          if-no-files-found: error
          retention-days: 14
        name: Upload Linux installers (upload-artifact)
      - name: Record exact Linux build proof
        shell: bash
        run: 'set -euo pipefail

          mkdir -p "$RUNNER_TEMP/linux-build-proof"

          git rev-parse HEAD > "$RUNNER_TEMP/linux-build-proof/source-sha.txt"

          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/linux-build-proof/source-tree.txt"

          sha256sum release/*.AppImage release/*.deb > "$RUNNER_TEMP/linux-build-proof/installers.sha256"

          sha256sum .github/scripts/check-clean-desktop-first-start.mjs > "$RUNNER_TEMP/linux-build-proof/driver.sha256"

          '
      - name: Upload Linux build proof (upload-artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-build-proof
          path: ${{ runner.temp }}/linux-build-proof
          if-no-files-found: error
          retention-days: 14
  desktop:
    name: Desktop ${{ matrix.platform }} ${{ matrix.arch }} (integrity checked)
    needs:
      - source
      - bundle
      - linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win
            arch: x64
            target: nsis
            rust_target: x86_64-pc-windows-msvc
          - runner: macos-15
            platform: mac
            arch: arm64
            target: dmg
            rust_target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        id: dependencies
        run: vp install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
      - name: Install Windows Spectre-mitigated runtime
        if: matrix.platform == 'win'
        shell: pwsh
        run: '$vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $installPath = & $vswhere -products * -latest -property installationPath

          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          $proc = Start-Process $setup -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
          "--quiet", "--norestart" -Wait -PassThru

          if ($proc.ExitCode -notin @(0, 3010)) { throw "VS installer failed: $($proc.ExitCode)" }

          '
      - run: node scripts/update-release-package-versions.ts "$CLIENT_VERSION"
      - uses: actions/download-artifact@v8
        with:
          name: community-js-bundle
          path: apps
      - uses: actions/download-artifact@v8
        if: matrix.platform == 'win'
        with:
          name: community-wsl-runtime
          path: wsl-runtime
      - name: Package community client
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run:
          "set -euo pipefail\nargs=(--platform \"$PLATFORM\" --target \"$TARGET\" --arch \"$ARCH\" --build-version \"$CLIENT_VERSION\"\
          \ --skip-build --verbose)\nif [[ \"$PLATFORM\" == win ]]; then\n  args+=(--wsl-runtime \"$GITHUB_WORKSPACE/wsl-runtime/t3-$CLIENT_VERSION-linux-x64.tar.gz\"\
          )\nfi\nvp run dist:desktop:artifact \"${args[@]}\"\necho \"Community build: macOS uses ad-hoc integrity signing without\
          \ Developer ID or notarization. Strict bundle integrity is required; Gatekeeper trust is reported separately. Windows\
          \ is not Authenticode signed.\" >> \"$GITHUB_STEP_SUMMARY\"\n"
      - name: Verify macOS integrity and report quarantined Gatekeeper trust
        if: matrix.platform == 'mac'
        run: 'set -euo pipefail

          mount="$RUNNER_TEMP/desktop-launch-dmg"

          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$(ls "$GITHUB_WORKSPACE"/release/*.dmg)"

          trap ''hdiutil detach "$mount" -force >/dev/null || true'' EXIT

          app=$(ls -d "$mount"/*.app)

          mkdir -p "$RUNNER_TEMP/desktop-launch-check"

          bash .github/scripts/verify-macos-distribution.sh "$app" --signature-only 2>&1 | tee "$RUNNER_TEMP/desktop-launch-check/signature.log"

          copy_root=$(mktemp -d "$RUNNER_TEMP/desktop-gatekeeper.XXXXXX")

          copy="$copy_root/$(basename "$app")"

          ditto "$app" "$copy"

          # Simulate a browser download on a disposable CI copy; never clear quarantine or change Gatekeeper.

          quarantine=$(printf ''0081;%x;T3CodeCI;'' "$(date +%s)")

          xattr -w com.apple.quarantine "$quarantine" "$copy"

          bash .github/scripts/verify-macos-distribution.sh "$copy" 2>&1 | tee "$RUNNER_TEMP/desktop-launch-check/gatekeeper.log"

          cp "$RUNNER_TEMP/desktop-launch-check/gatekeeper.log" "release/MACOS-TRUST-${{ matrix.arch }}.txt"

          cat "$RUNNER_TEMP/desktop-launch-check/gatekeeper.log" >> "$GITHUB_STEP_SUMMARY"

          executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")

          node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" --executable "$app/Contents/MacOS/$executable"

          '
      - name: Launch installed Windows client
        if: matrix.platform == 'win'
        shell: pwsh
        timeout-minutes: 10
        run:
          "$ErrorActionPreference = 'Stop'\n$installer = Join-Path $env:GITHUB_WORKSPACE \"release/T3-Code-$env:CLIENT_VERSION-x64.exe\"\
          \n$installDir = Join-Path $env:RUNNER_TEMP (\"t3-installed-\" + [guid]::NewGuid().ToString('N'))\nif (-not (Test-Path\
          \ -LiteralPath $installer -PathType Leaf)) {\n  throw \"Expected installer missing: $installer\"\n}\n# NSIS requires\
          \ /D last and its value without literal quote characters.\n$process = Start-Process -FilePath $installer -ArgumentList\
          \ \"/S /D=$installDir\" -Wait -PassThru\nif ($process.ExitCode -ne 0) {\n  throw \"Installer failed with exit code\
          \ $($process.ExitCode)\"\n}\n$executable = Join-Path $installDir 'T3 Code (Beta).exe'\nif (-not (Test-Path -LiteralPath\
          \ $executable -PathType Leaf)) {\n  throw \"Installed application missing: $executable\"\n}\nnode scripts/smoke-desktop-app.ts\
          \ --artifacts-dir \"$env:RUNNER_TEMP/desktop-launch-check\" --executable \"$executable\"\nif ($LASTEXITCODE -ne 0)\
