  mac-clean-install:
    name: Clean macOS ${{ matrix.arch }} ${{ matrix.format }} first start
    needs:
      - source
      - desktop
      - quality
      - native-rust-quality
      - mobile-native-quality
      - tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            format: dmg
          - runner: macos-15
            arch: arm64
            format: zip
          - runner: macos-15-intel
            arch: x64
            format: dmg
          - runner: macos-15-intel
            arch: x64
            format: zip
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - uses: actions/download-artifact@v8
        with:
          name: client-mac-${{ matrix.arch }}
          path: candidate
      - name: Install pinned acceptance driver
        run: npm install --prefix "$RUNNER_TEMP/acceptance-tools" --no-save --ignore-scripts playwright-core@1.60.0
      - name: Copy candidate and verify complete bundle
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          FORMAT: ${{ matrix.format }}
        run:
          "set -euo pipefail\ninstall_root=$(mktemp -d \"$RUNNER_TEMP/t3-clean-install.XXXXXX\")\nasset=\"$GITHUB_WORKSPACE/candidate/T3-Code-$CLIENT_VERSION-$ARCH.$FORMAT\"\
          \nmkdir -p \"$RUNNER_TEMP/acceptance-artifacts\"\nshasum -a 256 \"$asset\" | tee \"$RUNNER_TEMP/acceptance-artifacts/asset-sha256.txt\"\
          \nif [[ \"$FORMAT\" == dmg ]]; then\n  mount=\"$RUNNER_TEMP/t3-candidate-mount\"\n  hdiutil attach -nobrowse -readonly\
          \ -mountpoint \"$mount\" \"$asset\"\n  trap 'hdiutil detach \"$mount\" >/dev/null || true' EXIT\n  ditto \"$mount/T3\
          \ Code (Beta).app\" \"$install_root/T3 Code (Beta).app\"\nelse\n  ditto -x -k \"$asset\" \"$install_root\"\nfi\napp=\"\
          $install_root/T3 Code (Beta).app\"\nbash .github/scripts/verify-macos-distribution.sh \"$app\" --signature-only 2>&1\
          \ | tee \"$RUNNER_TEMP/acceptance-artifacts/signature.txt\"\nexecutable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable'\
          \ \"$app/Contents/Info.plist\")\necho \"T3_CANDIDATE_EXECUTABLE=$app/Contents/MacOS/$executable\" >> \"$GITHUB_ENV\"\
          \n"
      - name: Launch with empty data and normal sandbox
        run:
          node .github/scripts/check-clean-desktop-first-start.mjs --executable "$T3_CANDIDATE_EXECUTABLE" --platform macOS
          --playwright-module "$RUNNER_TEMP/acceptance-tools/node_modules/playwright-core/index.mjs" --artifacts-dir "$RUNNER_TEMP/acceptance-artifacts"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clean-install-mac-${{ matrix.arch }}-${{ matrix.format }}
          path: ${{ runner.temp }}/acceptance-artifacts
          if-no-files-found: warn
          retention-days: 14
  # Linux acceptance needs only its own producer; publication still requires every gate.
  linux-clean-install:
    name: Clean desktop ${{ matrix.display }} first start
    needs:
      - source
      - linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            kind: deb
            artifact: client-linux-x64
            suffix: amd64.deb
            display: deb
          - runner: ubuntu-24.04
            kind: appimage
            artifact: client-linux-x64
            suffix: x86_64.AppImage
            display: appimage Debian 13 guest (Ubuntu 24.04 host)
    steps:
      - name: Reserve bounded validation and upload budget
        if: runner.os == 'Linux'
        shell: bash
        run: python3 -c 'import os,time; open(os.environ["GITHUB_ENV"],"a").write("T3_VALIDATION_DEADLINE="+str(time.monotonic()+39*60)+"\n")'
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - timeout-minutes: 5
        name: Install official Linux validation dependencies
        if: runner.os == 'Linux'
        shell: bash
        run:
          "set -euo pipefail\nsudo apt-get update\nsudo apt-get install --no-install-recommends -y xvfb xauth dbus-x11 fonts-noto-cjk\
          \ fontconfig\nif [ '${{ matrix.kind }}' = appimage ]; then\n  sudo apt-get install --no-install-recommends -y qemu-system-x86\
          \ qemu-utils genisoimage\nfi\n"
      - timeout-minutes: 5
        name: Verify own-run Linux producer and original ZIPs
        if: runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: 'set -euo pipefail

          python3 .github/scripts/debian-guest/prepare_live.py --kind ''${{ matrix.kind }}'' --source "$GITHUB_WORKSPACE" --work
          "$RUNNER_TEMP/live-inputs" --execute-authorized

          '
      - timeout-minutes: 32
        name: Validate Debian 13 guest AppImage clean start and Chinese persistence
        if: matrix.kind == 'appimage'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          T3_STANDARD_RUNNER_LABEL: ubuntu-24.04
        run: 'set -euo pipefail

          python3 .github/scripts/debian-guest/host.py --manifest "$RUNNER_TEMP/live-inputs/manifest.json" --source-checkout
          "$GITHUB_WORKSPACE" --artifact-zip "$RUNNER_TEMP/live-inputs/installers.zip" --proof-zip "$RUNNER_TEMP/live-inputs/proof.zip"
          --playwright-tar "$RUNNER_TEMP/live-inputs/playwright.tgz" --workdir "$RUNNER_TEMP/linux-live-proof" --execute-authorized

          '
      - name: Validate native Ubuntu 24.04 DEB clean start and Chinese persistence
        if: matrix.kind == 'deb'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: 'set -euo pipefail

          python3 .github/scripts/debian-guest/native_deb.py --inputs "$RUNNER_TEMP/live-inputs" --source "$GITHUB_WORKSPACE"
          --work "$RUNNER_TEMP/linux-live-proof" --execute-authorized

          '
      - name: Collect bounded Linux proof
        if: always() && runner.os == 'Linux'
        shell: bash
        run: 'set -euo pipefail

          python3 .github/scripts/debian-guest/collect_evidence.py --workdir "$RUNNER_TEMP/linux-live-proof" --out "$RUNNER_TEMP/acceptance-artifacts"

          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: clean-install-${{ matrix.kind }}
          path: ${{ runner.temp }}/acceptance-artifacts
          if-no-files-found: error
          retention-days: 14
  desktop-clean-install:
    name: Clean desktop ${{ matrix.display }} first start
    needs:
      - source
      - linux
      - desktop
      - quality
      - native-rust-quality
      - mobile-native-quality
      - tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            kind: nsis
            artifact: client-win-x64
            suffix: x64.exe
            display: nsis
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: candidate
        if: matrix.kind == 'nsis'
      - name: Install pinned acceptance driver
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/acceptance-tools" --no-save --ignore-scripts playwright-core@1.60.0
        if: matrix.kind == 'nsis'
      - name: Install NSIS and launch clean installed entry
        if: matrix.kind == 'nsis'
        shell: pwsh
        run: '$ErrorActionPreference = ''Stop''

          $asset = Join-Path $env:GITHUB_WORKSPACE "candidate/T3-Code-$env:CLIENT_VERSION-x64.exe"

          $artifacts = Join-Path $env:RUNNER_TEMP ''acceptance-artifacts''

          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null

          Get-FileHash -Algorithm SHA256 $asset | Format-List | Out-File (Join-Path $artifacts ''asset-sha256.txt'')

          $installDir = Join-Path $env:RUNNER_TEMP (''t3-clean-install-'' + [guid]::NewGuid().ToString(''N''))

          $installer = Start-Process -FilePath $asset -ArgumentList "/S /D=$installDir" -Wait -PassThru

          if ($installer.ExitCode -ne 0) { throw "NSIS failed: $($installer.ExitCode)" }

          $executable = Join-Path $installDir ''T3 Code (Beta).exe''

          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw ''Installed executable missing'' }

          node .github/scripts/check-clean-desktop-first-start.mjs --executable $executable --platform Windows --playwright-module
          "$env:RUNNER_TEMP/acceptance-tools/node_modules/playwright-core/index.mjs" --artifacts-dir $artifacts

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: clean-install-${{ matrix.kind }}
          path: ${{ runner.temp }}/acceptance-artifacts
          if-no-files-found: error
          retention-days: 14
  android:
    name: Android arm64 unsigned candidate (NOT installable)
    needs:
      - source
      - bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_VARIANT: community
      T3CODE_MOBILE_VERSION: 0.1.9-zh.1
      T3CODE_MOBILE_VERSION_CODE: "1000416"
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      EXPO_NO_GIT_STATUS: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: 'set -euo pipefail

          git init .

          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

          git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          '
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install hoisted native dependencies
        run: vp install --frozen-lockfile -- --config.node-linker=hoisted
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21

            17

            "
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Generate community Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --platform android --no-install
      - name: Run Android native unit regressions
        working-directory: apps/mobile/android
        run:
          "printf '\\norg.gradle.java.installations.paths=%s,%s\\n' \"$JAVA_HOME_17_X64\" \"$JAVA_HOME_21_X64\" >> gradle.properties\n\
          ./gradlew -q javaToolchains --no-daemon\n./gradlew projects --no-daemon\n./gradlew :t3-widget-expiry:testDebugUnitTest\
          \ :t3-agent-notifications:testDebugUnitTest \\\n  :t3-composer-editor:testDebugUnitTest :t3tools-mobile-review-diff-native:testDebugUnitTest\
          \ \\\n  :t3tools-mobile-terminal-native:testDebugUnitTest \\\n  --no-daemon --max-workers=2\n"
      - name: Run standalone Android review geometry and viewport regressions
        working-directory: apps/mobile
        run: GRADLE="$PWD/android/gradlew" modules/t3-review-diff/tests/run-android.sh --no-daemon --max-workers=2
      - name: Explicitly disable ALL release signing
        run:
          "cat > \"$RUNNER_TEMP/unsigned-release.init.gradle\" <<'GRADLE'\ngradle.beforeProject { project ->\n  if (project.path\
          \ == \":app\") {\n    project.pluginManager.withPlugin(\"com.android.application\") {\n      project.extensions.getByName(\"\
          androidComponents\").finalizeDsl { android ->\n        android.buildTypes.getByName(\"release\").signingConfig = null\n\
          \      }\n    }\n  }\n}\nGRADLE\n"
      - name: Assemble unsigned release candidate
        working-directory: apps/mobile/android
        run:
          "./gradlew :app:assembleRelease --no-daemon --max-workers=2 \\\n  -PreactNativeArchitectures=arm64-v8a \\\n  -Pt3codeVersionName=\"\
          $T3CODE_MOBILE_VERSION\" \\\n  -Pt3codeVersionCode=\"$T3CODE_MOBILE_VERSION_CODE\" \\\n  -I \"$GITHUB_WORKSPACE/scripts/android-release-version.init.gradle\"\
          \ \\\n  -I \"$RUNNER_TEMP/unsigned-release.init.gradle\"\n"
      - name: Verify unsigned APK and record blocker
        run:
          "set -euo pipefail\napk=apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk\ntest -s \"\
          $apk\"\nbuild_tools=\"$(find \"$ANDROID_HOME/build-tools\" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)\"\n\
          test -x \"$build_tools/apksigner\"\nif \"$build_tools/apksigner\" verify \"$apk\"; then\n  echo 'Unexpected signed\
          \ APK: refusing candidate upload.' >&2\n  exit 1\nfi\nunzip -t \"$apk\"\n\"$build_tools/aapt\" dump badging \"$apk\"\
          \ | tee \"$RUNNER_TEMP/android-badging.txt\"\ngrep -F \"package: name='com.zhiweixiao.t3code.zhcn' versionCode='$T3CODE_MOBILE_VERSION_CODE'\
          \ versionName='$CLIENT_VERSION'\" \"$RUNNER_TEMP/android-badging.txt\"\nmkdir -p android-candidate\ncp \"$apk\" \"\
          android-candidate/T3-Code-zh-CN-Android-$CLIENT_VERSION-arm64-UNSIGNED-NOT-INSTALLABLE.apk\"\nprintf '%s\\n' 'UNSIGNED:\
          \ This build artifact is not installable. Publication requires the separate fixed-identity signing and APK verification\
          \ gates. No private signing material is included in this artifact.' > android-candidate/SIGNING-BLOCKER.txt\ncat android-candidate/SIGNING-BLOCKER.txt\
          \ >> \"$GITHUB_STEP_SUMMARY\"\n"
      - uses: actions/upload-artifact@v7
        with:
          name: android-UNSIGNED-NOT-INSTALLABLE
          path: android-candidate/*
          if-no-files-found: error
          retention-days: 14
"on":
  push:
    branches:
      - maintenance/v0.1.9-zh-cloud
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact full commit SHA to validate and build
        required: true
        type: string
