# Compatibility evidence only; this does not approve release.
name: Focused exact94049a7 Debian13 guest compatibility proof
on:
  push:
    branches:
      - validation/v0.1.7-debian13-sandbox
permissions:
  contents: read
  actions: read
jobs:
  debian-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      T3_STANDARD_RUNNER_LABEL: ubuntu-24.04
      OPERATION_BASE_SHA: 94049a79366352504974c4b0c83aab08b1093bd5
      BOOTSTRAP_DIR: ${{ github.workspace }}/.github/scripts/debian-guest
      MANIFEST: ${{ github.workspace }}/.github/scripts/debian-guest/focused-94049a7-manifest.REVIEW-ONLY.json
    steps:
      - name: Checkout exact reviewed operation without stored credentials
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_CHECKOUT=$RUNNER_TEMP/t3-guest-exact-source" >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=$RUNNER_TEMP/t3-guest-original-installers.zip" >> "$GITHUB_ENV"
          echo "PROOF_ZIP=$RUNNER_TEMP/t3-guest-original-build-proof.zip" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_TAR=$RUNNER_TEMP/t3-guest-playwright-core-1.60.0.tgz" >> "$GITHUB_ENV"
          test "$GITHUB_REPOSITORY" = ZhiweiXiao98/t3code
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/validation/v0.1.7-debian13-sandbox
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=3 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -p HEAD | grep -c '^parent ')" = 1
          test "$(git rev-parse HEAD^1)" = 5c5d4e48fd3fb219e91097d43077233c6c614254
          test "$(git cat-file -p HEAD^1 | grep -c '^parent ')" = 1
          test "$(git rev-parse HEAD^1^1)" = "$OPERATION_BASE_SHA"
          python3 - <<'VERIFY_OPERATION'
          import hashlib,pathlib,subprocess
          pins={'.github/scripts/debian-guest/common.py': '78ee963de278730877892b106822bf37956f8b53bc8a0aeb370f91c3ff0db046', '.github/scripts/debian-guest/host.py': 'a24cbec4ea0e74f9c8c6ccf58383dfe8466cb6392d8c9c6e65442e96ee2b2c60', '.github/scripts/debian-guest/guest.py': 'c1bcf7881e3a2006ef885f911dbf69d09888002446ab0593d01b90573151e038', '.github/scripts/debian-guest/decode_serial.py': '407f262a07d3b21b072c2f11c522c1a90f19557b40f5ca7fa8bd9e549f267dd2', '.github/scripts/debian-guest/png_validation.py': '7a8854ab7ac5922639e370e0de9c90b5ec0b9227d53decaf42ddccff5a90a087', '.github/scripts/debian-guest/collect_evidence.py': 'ba4fc5f8d855181deb1c7c415a112df985c427320c754e9daa575b9b216f2594', '.github/scripts/debian-guest/check-debian-cjk-ui.mjs': 'ad5ee86d2e4fa8fa5dbc98a75fcf35eb324b38eb17d9acbfac609cf11f0e37f1', '.github/scripts/debian-guest/focused-94049a7-manifest.REVIEW-ONLY.json': 'e4b27d650c0456bb7901226d9489a916c7cfd630b5300239266f57ef5800a123'}
          immediate=subprocess.check_output(['git','diff','--name-only','HEAD^1','HEAD'],text=True).splitlines()
          assert immediate==['.github/workflows/focused-debian13-guest.yml'],immediate
          expected=set(pins)|{'.github/workflows/focused-debian13-guest.yml'}
          actual=set(subprocess.check_output(['git','diff','--name-only','94049a79366352504974c4b0c83aab08b1093bd5','HEAD'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          for name,digest in pins.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          VERIFY_OPERATION
          PYTHONPATH="$BOOTSTRAP_DIR" python3 - <<'PY'
          import json,os
          from common import validate_manifest
          m=validate_manifest(json.load(open(os.environ['MANIFEST'])))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for key,name in [('sourceSha','SOURCE_SHA'),('artifactId','INSTALLER_ID'),('proofArtifactId','PROOF_ID')]:
                  f.write(f'{name}={m[key]}\n')
          PY
      - name: Retrieve exact public source and both unchanged original ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init "$SOURCE_CHECKOUT"
          git -C "$SOURCE_CHECKOUT" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$SOURCE_CHECKOUT" fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C "$SOURCE_CHECKOUT" checkout --detach FETCH_HEAD
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$INSTALLER_ID/zip" > "$ARTIFACT_ZIP"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ID/zip" > "$PROOF_ZIP"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            'https://registry.npmjs.org/playwright-core/-/playwright-core-1.60.0.tgz' \
            --output "$PLAYWRIGHT_TAR"
          PYTHONPATH="$BOOTSTRAP_DIR" python3 - <<'PY'
          import json,os
          from common import sha,require
          m=json.load(open(os.environ['MANIFEST']))
          for env,key in [('ARTIFACT_ZIP','artifactZipSha256'),('PROOF_ZIP','proofZipSha256'),('PLAYWRIGHT_TAR','playwrightTreeSha256')]:
              require(sha(os.environ[env])==m[key],f'{env} checksum mismatch')
          PY
      - name: Install only official host VM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils genisoimage
      - name: Validate ordinary AppImage in stock Debian13 full guest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$BOOTSTRAP_DIR/host.py" --manifest "$MANIFEST" \
            --source-checkout "$SOURCE_CHECKOUT" --artifact-zip "$ARTIFACT_ZIP" --proof-zip "$PROOF_ZIP" \
            --playwright-tar "$PLAYWRIGHT_TAR" --workdir "$RUNNER_TEMP/t3-debian-proof" \
            --execute-authorized
      - name: Collect bounded safe diagnostic evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$BOOTSTRAP_DIR/collect_evidence.py" && \
             printf '%s  %s\n' 'ba4fc5f8d855181deb1c7c415a112df985c427320c754e9daa575b9b216f2594' "$BOOTSTRAP_DIR/collect_evidence.py" | sha256sum --check --status; then
            python3 "$BOOTSTRAP_DIR/collect_evidence.py" \
              --workdir "$RUNNER_TEMP/t3-debian-proof" \
              --out "$RUNNER_TEMP/t3-debian-safe-evidence"
          else
            mkdir -p "$RUNNER_TEMP/t3-debian-safe-evidence"
            printf '%s\n' '{"result":"failed","phase":"operation-checkout","guestStarted":false}' \
              > "$RUNNER_TEMP/t3-debian-safe-evidence/collection.json"
          fi
      - name: Retain separate Debian13 guest evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: focused-debian13-guest-compatibility-evidence
          path: ${{ runner.temp }}/t3-debian-safe-evidence
          if-no-files-found: error
          retention-days: 14
