name: Supplemental client coverage
'on':
  push:
    branches:
    - validation/v0.1.7-coverage-98ac4dc26fa0
permissions:
  contents: read
concurrency:
  group: supplemental-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  SOURCE_SHA: 98ac4dc26fa013c008c3c5afd8012a60cb1d9135
  SOURCE_TREE: acdf2b80d00fb3404432f314be0a4a9e4904330f
  EXPECTED_BRANCH: validation/v0.1.7-coverage-98ac4dc26fa0
  VP_REMOTE_CACHE: 'off'
  VP_REMOTE_CACHE_URL: ''
jobs:
  coverage:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: linux-node26
          name: Supplemental Linux Node 26
          runner: ubuntu-22.04
          node: 26.12.1
        - lane: linux-node24
          name: Supplemental Linux Node 24
          runner: ubuntu-22.04
          node: 24.22.2
        - lane: windows-uninstall
          name: Supplemental Windows uninstall
          runner: windows-2025
          node: 26.12.1
    env:
      LANE: ${{ matrix.lane }}
      JOB_NAME: ${{ matrix.name }}
      RUNNER_LABEL: ${{ matrix.runner }}
      TEST_NODE: ${{ matrix.node }}
    steps:
    - name: Verify public repository and exact event
      shell: bash
      run: |-
        python3 - <<'PYTHON'
        import json,os
        x=json.load(open(os.environ['GITHUB_EVENT_PATH']))
        assert os.environ['GITHUB_REPOSITORY']=='ZhiweiXiao98/t3code'
        assert x['repository']['private'] is False
        assert os.environ['GITHUB_EVENT_NAME']=='push'
        assert os.environ['GITHUB_REF']=='refs/heads/'+os.environ['EXPECTED_BRANCH']
        assert x['after']==os.environ['GITHUB_SHA']
        PYTHON
    - name: Checkout unchanged candidate separately from operation
      shell: bash
      run: |
        set -euo pipefail
        git init .
        git config core.autocrlf false
        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
        test "$(git rev-parse FETCH_HEAD^1)" = "$SOURCE_SHA"
        test "$(git rev-list --parents -n 1 FETCH_HEAD | wc -w)" -eq 2
        test "$(git diff-tree --no-commit-id --name-only -r FETCH_HEAD)" = .github/workflows/client-coverage.yml
        git sparse-checkout set --no-cone '/*' '!/.repos/'
        git checkout --detach "$SOURCE_SHA"
        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
        git diff --exit-code
        git diff --cached --exit-code
    - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      with:
        node-version: 26.12.1
        run-install: false
        cache: true
    - name: Install locked dependencies with candidate runtime
      shell: bash
      run: vp install --frozen-lockfile
    - name: Install sandboxed test browser
      if: matrix.lane == 'linux-node26'
      shell: bash
      run: |
        set -euo pipefail
        node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
        revision=$(node -p "require('./apps/server/node_modules/playwright-core/browsers.json').browsers.find(b=>b.name==='chromium-headless-shell').revision")
        test "$revision" = 1223
        mapfile -t browsers < <(find "$HOME/.cache/ms-playwright/chromium_headless_shell-$revision" -type f -name chrome-headless-shell)
        test "${#browsers[@]}" -eq 1
        test -x "${browsers[0]}"
        echo "T3CODE_TEST_HEADLESS_SHELL=${browsers[0]}" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node }}
    - name: Run complete files under exact runtime and verify named results
      shell: bash
      run: |-
        node --input-type=commonjs - <<'JS'
        const fs = require('node:fs');
        const path = require('node:path');
        const cp = require('node:child_process');
        const crypto = require('node:crypto');
        const assert = require('node:assert/strict');
        const net = require('node:net');
        const pins = {"apps/server/src/outboundHttp.test.ts": {"blob": "ed3b09abaa5e649e07cfe97b540f347a8e174837", "sha256": "8f600beae2c4a80091876f3f5164042e9a9c91eccea93f3e3f0c9b000c45a11a"}, "apps/server/src/cli/uninstall.test.ts": {"blob": "d2ad673408d40ff8fa5be3ccba2bf99fb139918c", "sha256": "06f4afac0719d82c9a3a7cfbd9ecbaeac476176c8d45374a52f4290d8dd851f0"}, "apps/server/src/htmlRender/HtmlRender.test.ts": {"blob": "645f863a16b470776aeb2e086854dedd680302c3", "sha256": "7e1b97162b88145183515980aecc802c07baea0a3061f1ebfe0738ff92d8b6d7"}};
        const titles = {"apps/server/src/outboundHttp.test.ts": ["makes the global dispatcher negotiate HTTP/1.1 and keeps the env proxy agent", "moves the built-in fetch off HTTP/2", "swallows only an Error with code EINVAL on macOS", "keeps built-in fetch working when setTypeOfService throws EINVAL"], "apps/server/src/cli/uninstall.test.ts": ["claims only a launcher that points into this home's runtime tree", "t3 uninstall has cmd.exe remove the runtime directory, preserving spaces and literal environment-variable syntax"], "apps/server/src/htmlRender/HtmlRender.test.ts": ["inlines local images by absolute path and leaves URLs and relative paths alone", "rejects viewport height units, which make the fitted frame grow without end", "inlines an SVG behind processing instructions and a doctype subset", "lists every local image it cannot read", "publishes the prepared page as an html thread attachment", "removes the page when publishing is interrupted", "reports a typed preview error", "asks the browser to close when the preview finishes instead of signalling it", "names this server's home in the browser setup command", "matches preview media queries and text colors to the requested appearance", "keeps every local file but the page itself out of the browser", "keeps the page off this machine's local network"]};
        const root = process.cwd();
        const temp = process.env.RUNNER_TEMP;
        const lane = process.env.LANE;
        const git = (...args) => cp.execFileSync('git', args, {encoding:'utf8'}).trim();
        const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
        const clean = () => {
          assert.equal(git('rev-parse','HEAD'),process.env.SOURCE_SHA);
          assert.equal(git('rev-parse','HEAD^{tree}'),process.env.SOURCE_TREE);
          assert.equal(git('diff','--name-only'),'');
          assert.equal(git('diff','--cached','--name-only'),'');
        };
        clean();
        assert.equal(process.versions.node,process.env.TEST_NODE);
        assert.equal(process.arch,'x64');
        assert.equal(process.platform,lane==='windows-uninstall'?'win32':'linux');
        const undici = Number(process.versions.undici.split('.')[0]);
        const hasToS = typeof net.Socket.prototype.setTypeOfService === 'function';
        if(lane==='linux-node24') { assert.equal(undici,7); assert.ok(hasToS); }
        else assert.ok(undici>=8);
        let browser=null;
        if(lane==='linux-node26') {
          const pw = require(path.join(root,'apps/server/node_modules/playwright-core/package.json'));
          const revision = require(path.join(root,'apps/server/node_modules/playwright-core/browsers.json')).browsers.find(b=>b.name==='chromium-headless-shell').revision;
          const exe=process.env.T3CODE_TEST_HEADLESS_SHELL;
          assert.equal(pw.version,'1.60.0');assert.equal(revision,'1223');assert.ok(exe);
          assert.notEqual(process.env.T3CODE_SERVER_BROWSER_SANDBOX,'0');
          browser={playwright_version:pw.version,revision,version:cp.execFileSync(exe,['--version'],{encoding:'utf8'}).trim(),executable_sha256:hash(fs.readFileSync(exe)),test_headless_shell:exe,sandbox_disabled:false};
        }
        const runtime={node_version:process.version,bundled_undici:process.versions.undici,platform:process.platform,arch:process.arch,has_socket_set_type_of_service:hasToS,browser};
        console.log(JSON.stringify(runtime));
        const selected=lane==='linux-node26'?['apps/server/src/htmlRender/HtmlRender.test.ts','apps/server/src/outboundHttp.test.ts']:lane==='linux-node24'?['apps/server/src/outboundHttp.test.ts']:['apps/server/src/cli/uninstall.test.ts'];
        for(const file of selected) { assert.equal(git('rev-parse','HEAD:'+file),pins[file].blob);assert.equal(hash(fs.readFileSync(file)),pins[file].sha256); }
        // Assert actual Node in every test worker/child without modifying test sources.
        const probe=path.join(temp,'coverage-runtime-probe.cjs');
        fs.writeFileSync(probe,`if(process.versions.node !== ${JSON.stringify(process.env.TEST_NODE)}) throw new Error('Unexpected test-worker Node '+process.version);\n`);
        const reportPath=path.join(temp,'coverage-result.json');
        const args=[path.join(root,'node_modules/vite-plus/bin/vp'),'test','run',...selected.map(f=>f.replace('apps/server/','')),'--reporter=default','--reporter=json','--outputFile.json='+reportPath];
        const result=cp.spawnSync(process.execPath,args,{cwd:path.join(root,'apps/server'),stdio:'inherit',env:{...process.env,NODE_OPTIONS:`--require=${JSON.stringify(probe)}`}});
        assert.equal(result.status,0,`Test command failed: ${result.error || result.signal || result.status}`);
        clean();
        const report=JSON.parse(fs.readFileSync(reportPath,'utf8'));
        assert.equal(report.success,true);
        const expectedTotal=selected.reduce((s,f)=>s+titles[f].length,0);
        const skipped=lane==='windows-uninstall'?0:1;
        assert.equal(report.numTotalTests,expectedTotal);assert.equal(report.numPassedTests,expectedTotal-skipped);assert.equal(report.numFailedTests,0);assert.equal(report.numPendingTests,skipped);assert.equal(report.numTodoTests||0,0);
        assert.equal(report.testResults.length,selected.length);
        const seen=new Set();
        const files=report.testResults.map(r=>{
          const file=path.relative(root,r.name).split(path.sep).join('/');
          assert.ok(selected.includes(file));assert.ok(!seen.has(file));seen.add(file);
          assert.equal(r.assertionResults.length,titles[file].length);
          assert.deepEqual(r.assertionResults.map(a=>a.title).sort(),[...titles[file]].sort());
          const skipTitle=lane==='linux-node26'?'keeps built-in fetch working when setTypeOfService throws EINVAL':'moves the built-in fetch off HTTP/2';
          const assertions=r.assertionResults.map(a=>{
            const shouldSkip=file.endsWith('outboundHttp.test.ts') && a.title===skipTitle;
            if(shouldSkip) assert.ok(['pending','skipped'].includes(a.status));else assert.equal(a.status,'passed');
            return {title:a.title,status:shouldSkip?'skipped':'passed',skip_reason:shouldSkip?(lane==='linux-node26'?'requires built-in undici 7 and Socket.setTypeOfService':'requires built-in undici >= 8'):null};
          });
          const n=assertions.filter(a=>a.status==='skipped').length;
          assert.equal(hash(fs.readFileSync(file)),pins[file].sha256);
          return {path:file,git_blob_sha:pins[file].blob,sha256:pins[file].sha256,counts:{total:assertions.length,passed:assertions.length-n,failed:0,skipped:n,todo:0},assertions};
        });
        const evidence={lane,job_name:process.env.JOB_NAME,runner_label:process.env.RUNNER_LABEL,runtime,source_unchanged:true,test_exit_code:0,files};
        const envelope={source_sha:process.env.SOURCE_SHA,source_tree:process.env.SOURCE_TREE,workflow_sha:process.env.GITHUB_SHA,branch:process.env.EXPECTED_BRANCH,run_id:Number(process.env.GITHUB_RUN_ID),run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),evidence};
        fs.mkdirSync(path.join(temp,'proof'),{recursive:true});
        fs.writeFileSync(path.join(temp,'proof','lane.json'),JSON.stringify(envelope,null,2));

        JS
    - name: Upload immutable lane evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: supplemental-lane-${{ matrix.lane }}
        path: ${{ runner.temp }}/proof/lane.json
        if-no-files-found: error
        retention-days: 14
    - name: Preserve raw test report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: supplemental-report-${{ matrix.lane }}
        path: ${{ runner.temp }}/coverage-result.json
        if-no-files-found: warn
        retention-days: 14
  collect:
    name: Collect supplemental coverage proof
    needs:
    - coverage
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: supplemental-lane-*
        path: ${{ runner.temp }}/lanes
    - name: Collect exact source and operation evidence
      shell: bash
      run: |-
        python3 - <<'PYTHON'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'])
        expected={'linux-node26':('Supplemental Linux Node 26','ubuntu-22.04'),'linux-node24':('Supplemental Linux Node 24','ubuntu-22.04'),'windows-uninstall':('Supplemental Windows uninstall','windows-2025')}
        lanes=[]
        files=list((p/'lanes').glob('*/lane.json'))
        assert len(files)==3
        for f in files:
         x=json.loads(f.read_text()); e=x['evidence']; name=e['lane']; assert name in expected
         assert x['source_sha']==os.environ['SOURCE_SHA'] and x['source_tree']==os.environ['SOURCE_TREE']
         assert x['workflow_sha']==os.environ['GITHUB_SHA'] and x['branch']==os.environ['EXPECTED_BRANCH']
         assert x['run_id']==int(os.environ['GITHUB_RUN_ID']) and x['run_attempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])
         assert (e['job_name'],e['runner_label'])==expected.pop(name)
         assert e['source_unchanged'] is True and e['test_exit_code']==0
         lanes.append(e)
        assert not expected
        manifest={'schema_version':1,'evidence_type':'supplemental-test-coverage','repository':'ZhiweiXiao98/t3code','passed':True,'source':{'sha':os.environ['SOURCE_SHA'],'tree':os.environ['SOURCE_TREE'],'branch':'maintenance/v0.1.7-zh-cloud','baseline_run_id':42740589754,'baseline_run_attempt':1},'workflow':{'path':'.github/workflows/client-coverage.yml','branch':os.environ['EXPECTED_BRANCH'],'sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT'])},'lanes':sorted(lanes,key=lambda x:x['lane'])}
        out=p/'final-proof';out.mkdir();data=json.dumps(manifest,indent=2);assert len(data.encode())<=128*1024;(out/'coverage-manifest.json').write_text(data)

        PYTHON
    - name: Upload supplemental coverage proof
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: supplemental-coverage-proof
        path: ${{ runner.temp }}/final-proof/coverage-manifest.json
        if-no-files-found: error
        retention-days: 14
