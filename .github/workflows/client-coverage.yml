name: Supplemental client coverage
'on':
  push:
    branches:
    - validation/v0.1.9-coverage-042eacb54f19
permissions:
  contents: read
concurrency:
  group: supplemental-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  SOURCE_SHA: 042eacb54f19c3bbc452e4ae271794f4c5fc524e
  SOURCE_TREE: 7879a15522881c2c953a650ca2062848111a742d
  EXPECTED_BRANCH: validation/v0.1.9-coverage-042eacb54f19
  VP_REMOTE_CACHE: 'off'
  VP_REMOTE_CACHE_URL: ''
jobs:
  coverage:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: linux-node26
          name: Supplemental Linux Node 26
          runner: ubuntu-22.04
          node: 26.12.1
        - lane: linux-node24
          name: Supplemental Linux Node 24
          runner: ubuntu-22.04
          node: 24.22.2
        - lane: windows-uninstall
          name: Supplemental Windows uninstall
          runner: windows-2025
          node: 26.12.1
        - lane: linux-nushell
          name: Supplemental Linux Nushell
          runner: ubuntu-22.04
          node: 26.12.1
        - lane: windows-shared
          name: Supplemental Windows shared
          runner: windows-2025
          node: 26.12.1
    env:
      LANE: ${{ matrix.lane }}
      JOB_NAME: ${{ matrix.name }}
      RUNNER_LABEL: ${{ matrix.runner }}
      TEST_NODE: ${{ matrix.node }}
    steps:
    - name: Verify public repository and exact event
      shell: bash
      run: 'python3 - <<''PYTHON''

        import json,os,re

        x=json.load(open(os.environ[''GITHUB_EVENT_PATH''], encoding=''utf-8''))

        assert re.fullmatch(''[a-f0-9]{40}'', os.environ[''SOURCE_SHA'']), ''Unreviewed v019 source SHA''

        assert re.fullmatch(''[a-f0-9]{40}'', os.environ[''SOURCE_TREE'']), ''Unreviewed v019 source tree''

        assert os.environ[''GITHUB_REPOSITORY'']==''ZhiweiXiao98/t3code''

        assert x[''repository''][''private''] is False

        assert os.environ[''GITHUB_EVENT_NAME'']==''push''

        assert os.environ[''GITHUB_REF'']==''refs/heads/''+os.environ[''EXPECTED_BRANCH'']

        assert x[''after'']==os.environ[''GITHUB_SHA'']

        PYTHON'
    - name: Checkout unchanged candidate separately from operation
      shell: bash
      run: 'set -euo pipefail

        git init .

        git config core.autocrlf false

        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

        git fetch --no-tags --depth=5 origin "$GITHUB_SHA"

        test "$(git rev-parse FETCH_HEAD^)" = "$SOURCE_SHA"

        test "$(git rev-list --parents -n 1 FETCH_HEAD | wc -w)" -eq 2

        test "$(git diff --name-only "$SOURCE_SHA" FETCH_HEAD)" = .github/workflows/client-coverage.yml

        git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

        git checkout --detach "$SOURCE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        git diff --exit-code

        git diff --cached --exit-code

        '
    - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      with:
        node-version: 26.12.1
        run-install: false
        cache: true
    - name: Install locked dependencies with candidate runtime
      shell: bash
      run: vp install --frozen-lockfile
    - name: Install sandboxed test browser
      if: matrix.lane == 'linux-node26'
      shell: bash
      run: 'set -euo pipefail

        python3 .github/scripts/ci-ubuntu-packages.py playwright apps/server/node_modules/playwright-core/cli.js

        node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium

        revision=$(node -p "require(''./apps/server/node_modules/playwright-core/browsers.json'').browsers.find(b=>b.name===''chromium-headless-shell'').revision")

        test "$revision" = 1248

        mapfile -t browsers < <(find "$HOME/.cache/ms-playwright/chromium_headless_shell-$revision" -type f -name chrome-headless-shell)

        test "${#browsers[@]}" -eq 1

        test -x "${browsers[0]}"

        echo "T3CODE_TEST_HEADLESS_SHELL=${browsers[0]}" >> "$GITHUB_ENV"

        '
    - name: Install checksum-pinned official Nushell
      if: matrix.lane == 'linux-nushell'
      shell: bash
      run: 'set -euo pipefail

        archive="$RUNNER_TEMP/nushell.tar.gz"

        curl --fail --location --silent --show-error https://github.com/nushell/nushell/releases/download/0.116.0/nu-0.116.0-x86_64-unknown-linux-gnu.tar.gz
        -o "$archive"

        echo "9f73a6913f9515a621bd916dc91d7f3e0494e488161c2d686f6b98ffa0555945  $archive" | sha256sum --check --strict

        mkdir "$RUNNER_TEMP/nushell"

        tar -xzf "$archive" -C "$RUNNER_TEMP/nushell"

        mapfile -t binaries < <(find "$RUNNER_TEMP/nushell" -type f -name nu)

        test "${#binaries[@]}" -eq 1

        test -x "${binaries[0]}"

        test "$("${binaries[0]}" --version)" = 0.116.0

        echo "T3_TEST_NU_PATH=${binaries[0]}" >> "$GITHUB_ENV"

        '
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node }}
    - name: Run complete files under exact runtime and verify named results
      shell: bash
      run: "node --input-type=commonjs - <<'JS'\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst\
        \ cp = require('node:child_process');\nconst crypto = require('node:crypto');\nconst assert = require('node:assert/strict');\n\
        const net = require('node:net');\nconst pins = {\"apps/server/src/outboundHttp.test.ts\": {\"blob\": \"ed3b09abaa5e649e07cfe97b540f347a8e174837\"\
        , \"sha256\": \"8f600beae2c4a80091876f3f5164042e9a9c91eccea93f3e3f0c9b000c45a11a\"}, \"apps/server/src/cli/uninstall.test.ts\"\
        : {\"blob\": \"4dcdc59e30a7873e60bc150cf1ee6d7536e42187\", \"sha256\": \"e86e10be49afc6d395943efbc7e258e392aa3352232c37058fa95adf279323ca\"\
        }, \"apps/server/src/htmlRender/HtmlRender.test.ts\": {\"blob\": \"859491e800029247dc1fff5f4847fd433325a704\", \"\
        sha256\": \"db4d36d123ca82415ae79fb20e9b6a2b43d6321900c5c7d6ad47e5c4a5150230\"}, \"packages/shared/src/managedPolicyFile.test.ts\"\
        : {\"blob\": \"2ab3ea710e3ecdd0a580638b37f057cf00d6ff6a\", \"sha256\": \"bc98e7f88db35af4cd44031f7b2aeb08f970c3462e77ba96e6f0d464dd3e03bc\"\
        }, \"packages/shared/src/shell.test.ts\": {\"blob\": \"83561c8daced452fce523af0f411e98cd15d6b7a\", \"sha256\": \"\
        54356bf4b7cfbccbe542641634a2397ca6760386f5e2109f03573d9e6c1e55bb\"}};\nconst titles = {\"apps/server/src/outboundHttp.test.ts\"\
        : [\"makes the global dispatcher negotiate HTTP/1.1 and keeps the env proxy agent\", \"moves the built-in fetch off\
        \ HTTP/2\", \"swallows only an Error with code EINVAL on macOS\", \"keeps built-in fetch working when setTypeOfService\
        \ throws EINVAL\"], \"apps/server/src/cli/uninstall.test.ts\": [\"claims only a launcher that points into this home's\
        \ runtime tree\", \"t3 uninstall has cmd.exe remove the runtime directory, preserving spaces and literal environment-variable\
        \ syntax\"], \"apps/server/src/htmlRender/HtmlRender.test.ts\": [\"inlines local images by absolute path and leaves\
        \ URLs and relative paths alone\", \"rejects viewport height units, which make the fitted frame grow without end\"\
        , \"inlines an SVG behind processing instructions and a doctype subset\", \"lists every local image it cannot read\"\
        , \"publishes the prepared page as an html thread attachment\", \"publishes a page from an .html file as a snapshot\
        \ that path calls recover\", \"refuses anything but a regular, singly linked .html file of at most 25 MiB\", \"refuses\
        \ an .html symlink to another file\", \"removes the page when publishing is interrupted\", \"reports a typed preview\
        \ error\", \"asks the browser to close when the preview finishes instead of signalling it\", \"names this server's\
