    - name: Validate diagnostic artifact allowlist and privacy
      id: artifact_safety
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        node --input-type=module <<'V019_NODE'
        import fs from 'node:fs';
        import path from 'node:path';
        import assert from 'node:assert/strict';
        import crypto from 'node:crypto';
        const out=path.join(process.env.RUNNER_TEMP,'v019-evidence');
        const allowed=new Set(['provenance.json','runtime.json','final-status.json','diagnostic-summary.json',...['sidebar'].flatMap(id=>[`${id}-command.json`,`${id}-exit.json`,`${id}-progress.json`,`${id}.log`])]);
        const files=[];
        for(const file of fs.readdirSync(out)){
         assert(allowed.has(file));const p=path.join(out,file);assert(!fs.lstatSync(p).isSymbolicLink()&&fs.statSync(p).isFile());
         const b=fs.readFileSync(p);assert(b.length<64*1024*1024);const s=b.toString('utf8');
         assert(!/\b(?:gh[pousr]_|github_pat_|sk-)[A-Za-z0-9_-]+\b/.test(s));
         assert(!/[?&#](?:token|access_token|auth_code|secret)=[^\s"<>]+/i.test(s));
         files.push({file,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')});
        }
        assert(files.some(f=>f.file==='final-status.json'));
        fs.writeFileSync(path.join(out,'artifact-manifest.json'),JSON.stringify({sourceSha:process.env.SOURCE_SHA,sourceTree:process.env.SOURCE_TREE,diagnosticOnly:true,releaseAccepted:false,files},null,2));
