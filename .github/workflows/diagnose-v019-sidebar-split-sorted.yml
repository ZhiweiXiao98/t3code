jobs:
  supplemental:
    name: One bounded corrected Sidebar diagnostic, not release acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Prepare isolated validation directories
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/v019-browsers"
        printf '%s\n' "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
        mkdir "$RUNNER_TEMP/v019-tools" "$RUNNER_TEMP/v019-private" "$RUNNER_TEMP/v019-evidence" "$PLAYWRIGHT_BROWSERS_PATH"
    - name: Prepare reviewed helper contracts.mjs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        cat > "$RUNNER_TEMP/v019-tools/contracts.mjs" <<'V019_NODE'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        import path from 'node:path';
        import crypto from 'node:crypto';

        export const REPOSITORY = 'ZhiweiXiao98/t3code';
        export const SOURCE_BRANCH = 'validation/v0.1.9-sidebar-split-candidate';
        export const OPERATION_BRANCH = 'validation/v0.1.9-sidebar-split-sorted-diagnostic';
        export const WORKFLOW_PATH = '.github/workflows/diagnose-v019-sidebar-split-sorted.yml';
        export const SCENARIO = 'scripts/scenarios/chinese-thread-menu.e2e.ts';
        export const MAX_TEST_FILES = 256;
        export const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');
        export const json = file => JSON.parse(fs.readFileSync(file, 'utf8'));
        export const writeJson = (file, value) => fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`, {mode: 0o600});
        export function relativeFile(value) {
          assert.equal(typeof value, 'string');
          assert(value.length <= 300 && /^[A-Za-z0-9_./-]+$/.test(value));
          assert(!value.startsWith('/') && !value.split('/').some(part => ['', '.', '..'].includes(part)));
          return value;
        }
        export function testFiles(value) {
          const files = typeof value === 'string' ? JSON.parse(value) : value;
          assert(Array.isArray(files) && files.length > 0 && files.length <= MAX_TEST_FILES);
          assert.equal(new Set(files).size, files.length);
          assert.deepEqual([...files].sort(), files, 'Test list must be sorted');
          for (const file of files) {
            relativeFile(file);
            assert(file === 'apps/mobile/app.config.test.ts' || /^(apps\/(web|mobile|desktop)\/src|packages\/(shared|client-runtime)\/src)\/.+\.test\.tsx?$/.test(file), `Out-of-scope test: ${file}`);
          }
          assert(files.some(file => file.startsWith('apps/web/src/') && /\.browser\.test\.tsx?$/.test(file)), 'Actual Chromium browser tests are mandatory');
          return files;
        }
        export function frozen(env) {
          assert.equal(env.SOURCE_BRANCH, SOURCE_BRANCH);
          for (const key of ['SOURCE_SHA', 'SOURCE_TREE']) assert.match(env[key] ?? '', /^[0-9a-f]{40}$/);
          for (const key of ['TEST_FILES_SHA256', 'SCENARIO_SHA256']) assert.match(env[key] ?? '', /^[0-9a-f]{64}$/);
          const files = testFiles(env.TEST_FILES_JSON);
          assert.equal(sha256(JSON.stringify(files)), env.TEST_FILES_SHA256);
          const captures = JSON.parse(env.SCENARIO_CAPTURES_JSON);
          assert(Array.isArray(captures) && captures.length >= 3 && captures.length <= 20);
          assert.equal(new Set(captures).size, captures.length);
          for (const capture of captures) assert.match(capture, /^[a-z][a-z0-9-]{2,70}$/);
          return {files, captures};
        }
        export function operationGuard({env, context, repository, sourceRef, sourceCommit, operationRef, operationCommit, comparison}) {
          frozen(env);
          assert.equal(`${context.repo.owner}/${context.repo.repo}`, REPOSITORY);
          assert.equal(repository.full_name, REPOSITORY);
          assert.equal(repository.private, false, 'Only free public repository runners');
          assert.equal(context.eventName, 'push');
          assert.equal(context.ref, `refs/heads/${OPERATION_BRANCH}`);
          assert.match(context.sha, /^[0-9a-f]{40}$/);
          assert.equal(sourceRef.object.sha, env.SOURCE_SHA, 'Source branch moved');
          assert.equal(sourceCommit.sha, env.SOURCE_SHA);
          assert.equal(sourceCommit.tree.sha, env.SOURCE_TREE);
          assert.equal(operationRef.object.sha, context.sha, 'Operation branch moved');
          assert.equal(operationCommit.sha, context.sha);
          assert.deepEqual(operationCommit.parents.map(parent => parent.sha), [env.SOURCE_SHA], 'Operation must be one direct child of final source');
          assert.equal(comparison.status, 'ahead');
          assert.equal(comparison.ahead_by, 1);
          assert.equal(comparison.behind_by, 0);
          assert.equal(comparison.total_commits, 1);
          assert.deepEqual(comparison.commits.map(commit => commit.sha), [context.sha]);
          assert.equal(comparison.files.length, 1);
          assert.equal(comparison.files[0].filename, WORKFLOW_PATH);
          assert.equal(comparison.files[0].status, 'added');
          assert.match(comparison.files[0].sha, /^[0-9a-f]{40}$/);
          return {operationSha: context.sha, operationTree: operationCommit.tree.sha, workflowBlob: comparison.files[0].sha};
        }
        export function checkedFile(root, relative) {
          relativeFile(relative);
          const file = path.join(root, relative);
          let current = root;
          for (const segment of relative.split('/')) {
            current = path.join(current, segment);
            assert(!fs.lstatSync(current).isSymbolicLink(), 'No symlink paths in evidence or source files');
          }
          assert(fs.statSync(file).isFile());
          assert(fs.realpathSync(file).startsWith(`${fs.realpathSync(root)}${path.sep}`));
          return file;
        }
        export function safeEnv(host, {home, browserPath, temp}) {
          for (const value of [home, browserPath, temp]) assert(path.isAbsolute(value));
          // Deliberate positive allowlist. Never spread host into a child process.
          const env = {};
          for (const key of ['PATH', 'LANG', 'LC_ALL', 'LC_CTYPE', 'TZ', 'DISPLAY', 'WAYLAND_DISPLAY']) {
            if (typeof host[key] === 'string') env[key] = host[key];
          }
          assert(env.PATH && path.isAbsolute(env.PATH.split(path.delimiter)[0]));
          Object.assign(env, {
            HOME: home, XDG_CONFIG_HOME: path.join(home, '.config'), XDG_CACHE_HOME: path.join(home, '.cache'),
            XDG_DATA_HOME: path.join(home, '.local/share'), XDG_STATE_HOME: path.join(home, '.local/state'),
            TMPDIR: temp, TMP: temp, TEMP: temp, CI: '1', NO_COLOR: '1', FORCE_COLOR: '0',
            E2E_TELEMETRY_DISABLED: '1', DO_NOT_TRACK: '1', PLAYWRIGHT_BROWSERS_PATH: browserPath,
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1', PLAYWRIGHT_SKIP_BROWSER_GC: '1',
            T3CODE_AUTO_BOOTSTRAP_PROJECT_FROM_CWD: '0', T3CODE_DEV_SEED: '0',
            GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null', GIT_TERMINAL_PROMPT: '0',
          });
          return env;
        }
        export function credentialValues(repo) {
          const credentialFile = path.join(repo, '.t3/scenarios/pairing-path');
          if (!fs.existsSync(credentialFile)) return [];
          const value = fs.readFileSync(credentialFile, 'utf8').trim();
          const url = new URL(value, 'http://127.0.0.1');
          const secrets = [value, url.href];
          for (const [key, item] of url.searchParams) if (/token|code|secret|key|credential/i.test(key)) secrets.push(item);
          const hashParams = new URLSearchParams(url.hash.replace(/^#/, ''));
          for (const [key, item] of hashParams) if (/token|code|secret|key|credential/i.test(key)) secrets.push(item);
          return secrets.filter(value => value.length >= 8).sort((a, b) => b.length - a.length);
        }
        export function sanitize(value, credentials = []) {
          let clean = String(value).replace(/\u001b\[[0-9;]*m/g, '');
          for (const secret of credentials) {
            for (const version of [secret, encodeURIComponent(secret)]) clean = clean.split(version).join('[REDACTED]');
          }
          // Redact the whole pairing/navigation label, not just its query argument.
          clean = clean.replace(/[^\s"'<>]*(?:token|pairing|auth[_-]?code|credential|secret)[^\s"'<>]*[=:][^\s"'<>]+/gi, '[REDACTED-CREDENTIAL]');
          clean = clean.replace(/\b[A-Fa-f0-9]{64}\b/g, '[REDACTED-OPAQUE]');
          clean = clean.replace(/\b(?:gh[pousr]_|github_pat_|sk-)[A-Za-z0-9_-]+\b/g, '[REDACTED-SECRET]');
          for (const secret of credentials) assert(!clean.includes(secret));
          return clean;
        }
        export function scenarioArgs() {
          return ['run', SCENARIO.slice('scripts/'.length), '--target', 'web', '--workers', '1', '--retries', '0', '--repeat-each', '1', '--no-cache', '--trace', 'off', '--video', 'off', '--reporter', 'list', '--output', '.e2e'];
        }
        export function inspectReport(report, {startedAt, sourceSha, captures, credentials = []}) {
          assert.equal(report.schemaVersion, 'report-1');
          const run = report.run;
          assert.equal(run.runner.version, '0.23.0');
          assert(Date.parse(run.startedAt) >= startedAt - 1000, 'Stale scenario result');
          assert(run.finishedAt && Date.parse(run.finishedAt) >= Date.parse(run.startedAt));
          // e2e reports every declared target, including unselected iOS; only web may execute.
          assert.deepEqual(run.targets.map(t => [t.id, t.platform]), [['web', 'web'], ['ios', 'ios']]);
          assert.equal(run.targets[0].engine.name, 'web');
          assert.equal(run.targets[0].engine.version, '0.15.5');
          assert.equal(run.summary.selected, 1);
          assert(run.results.every(result => result.targetId === 'web' || (result.attempts.length === 0 && result.selected === false)), 'No selected or executed mobile target');
          if (run.vcs) {
            assert.equal(run.vcs.commit, sourceSha);
            assert.notEqual(run.vcs.dirty, true);
          }
          assert(!run.carried, 'No reused previous results');
          assert.equal(run.serialGroups.length, 0);
          assert.equal(run.usage.modelTokens, 0);
          assert.equal(run.usage.maxModelCallsInStep, 0);
          assert.equal(run.usage.estimatedCostUsd ?? 0, 0);
          const executed = run.results.filter(result => result.attempts.length > 0);
          assert.equal(executed.length, 1, 'Exactly one executed scenario required');
          const result = executed[0];
          assert.equal(result.file, SCENARIO.slice('scripts/'.length));
          assert.equal(result.kind, 'test');
          assert.equal(result.platform, 'web');
          assert.equal(result.targetId, 'web');
          assert(!result.expectedFailure);
          assert([undefined, 'default'].includes(result.agent), 'No configured model agent');
          assert.equal(result.attempts.length, 1, 'Retries are prohibited');
          assert.equal(result.repeat ?? 0, 0);
          const attempt = result.attempts[0];
          assert.equal(attempt.index, 0);
          assert(!attempt.expectedFailure);
          const captureSteps = [];
          for (const step of attempt.steps) {
            assert(step.kind !== 'agent' && !step.api.startsWith('agent.') && !step.model, 'No paid model or agent assertions');
            assert.equal(step.metrics?.modelCalls ?? 0, 0);
            if (step.api === 'app.screenshot' && captures.includes(step.label) && step.status === 'passed') captureSteps.push(step);
          }
          const screenshots = [];
          for (const step of captureSteps) {
            const artifacts = attempt.artifacts.filter(a => a.kind === 'screenshot' && a.producer?.kind === 'step' && a.producer.stepId === step.id);
            assert.equal(artifacts.length, 1);
            const artifact = artifacts[0];
            assert.equal(artifact.redaction, 'complete');
            assert.equal(artifact.mediaType, 'image/png');
            relativeFile(artifact.path);
            assert(artifact.path.endsWith('.png') && artifact.size > 0);
            assert.match(artifact.sha256, /^[a-f0-9]{64}$/);
            screenshots.push({label: step.label, artifact});
          }
          assert.equal(new Set(screenshots.map(item => item.label)).size, screenshots.length);
          const passed = run.status === 'passed' && run.exitCode === 0 && result.status === 'passed' && attempt.status === 'passed' && attempt.cleanup === 'complete' && run.errors.length === 0 && attempt.secondaryErrors.length === 0 && !attempt.error;
          if (passed) {
            assert.deepEqual(screenshots.map(s => s.label).sort(), [...captures].sort(), 'All reviewed screenshots are mandatory for success');
            assert.equal(run.summary.executed, 1);
            assert.equal(run.summary.passed, 1);
            assert.equal(run.summary.failed + run.summary.flaky + run.summary.interrupted, 0);
          }
          return {passed, screenshots, report: {
            schema: 'sanitized-v019-scenario-1', sourceSha, runId: run.id,
            startedAt: run.startedAt, finishedAt: run.finishedAt,
            target: 'web', runner: 'e2e@0.23.0', engine: '@e2e-dev/web@0.15.5',
            runStatus: run.status, exitCode: run.exitCode, resultStatus: result.status, attemptStatus: attempt.status,
            cleanup: attempt.cleanup, noModelCalls: true, noRetries: true,
            title: sanitize(result.titlePath.join(' > '), credentials),
            error: attempt.error ? sanitize(`${attempt.error.code}: ${attempt.error.message}`, credentials) : undefined,
            steps: attempt.steps.map(s => ({api: s.api, label: sanitize(s.label, credentials), status: s.status})),
            exportedCaptures: screenshots.map(s => s.label),
            excluded: 'Raw report, app log, traces, automatic failure screenshots, sessions, credentials and all .t3/HOME. Video disabled because upstream marks it unredacted.',
            scope: 'One real web scenario plus separately listed localization unit/browser tests. Not native/device UI or the mandatory separate 22 release gates.',
          }};
        }

        V019_NODE
    - name: Prepare reviewed helper incremental-reporter.mjs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        cat > "$RUNNER_TEMP/v019-tools/incremental-reporter.mjs" <<'V019_NODE'
        import fs from 'node:fs';
        import path from 'node:path';
        import crypto from 'node:crypto';

        const states = ['passed', 'failed', 'skipped', 'pending', 'todo'];
        const counts = () => Object.fromEntries(states.map(s => [s, 0]));
        function requireThat(condition, code) { if (!condition) throw new Error(`diagnostic:${code}`); }
        function fileList(value) {
