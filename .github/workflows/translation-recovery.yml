name: Localization recovery exact-source checks
on:
  push:
    branches: [validation/i18n-recovery-round22]
permissions:
  contents: read
concurrency:
  group: i18n-recovery-round22
  cancel-in-progress: false
env:
  CI: "true"
  SOURCE_SHA: d40d88ecca265627d9a63ce7c7298f99b2ef3f0d
  PARENT_SHA: 186113ef93dc66daeef996599fa65a9fb40e2e1b
  BASE_SHA: 186113ef93dc66daeef996599fa65a9fb40e2e1b
  VP_REMOTE_CACHE: "off"
  VP_REMOTE_CACHE_URL: ""
jobs:
  regression:
    name: Exact-source changed-file and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify public repository and check out exact source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          assert os.environ["GITHUB_REPOSITORY"] == "ZhiweiXiao98/t3code"
          assert event["repository"]["private"] is False
          assert os.environ["GITHUB_REF"] == "refs/heads/validation/i18n-recovery-round22"
          PY
          git init .
          git remote add origin "https://github.com/ZhiweiXiao98/t3code.git"
          git fetch --no-tags --depth=64 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = 943b12c24303caa4f67b6aa1fbbcbf4334c85e21
          git diff --exit-code
          printf 'Source: %s\nBase: %s\n' "$SOURCE_SHA" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Install official Chromium and system dependencies
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prove modifier tooltip regression fails on the prior production source
        shell: bash
        run: |
          set -euo pipefail
          saved=$(mktemp -d "$RUNNER_TEMP/title-baseline.XXXXXX")
          panel=apps/web/src/components/chat/ThreadServersPanel.tsx
          catalog=apps/web/src/i18n/messages.ts
          cp "$panel" "$saved/panel.tsx"
          cp "$catalog" "$saved/messages.ts"
          restore_source() { cp "$saved/panel.tsx" "$panel"; cp "$saved/messages.ts" "$catalog"; }
          trap restore_source EXIT
          git show "$BASE_SHA:$panel" > "$panel"
          git show "$BASE_SHA:$catalog" > "$catalog"
          set +e
          (cd apps/web && vp test run src/components/chat/ThreadServersPanel.browser.test.tsx --project browser -t "localizes the server browser modifier tooltip") 2>&1 | tee "$RUNNER_TEMP/title-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          restore_source
          trap - EXIT
          test "$baseline_status" -ne 0
          grep -F "AssertionError" "$RUNNER_TEMP/title-baseline.log"
          grep -F "按住" "$RUNNER_TEMP/title-baseline.log"
          grep -F "click" "$RUNNER_TEMP/title-baseline.log"
          ! grep -F "Unhandled Errors" "$RUNNER_TEMP/title-baseline.log"
          git diff --exit-code
      - name: Run changed-file regression checks
        shell: bash
        run: |
          set -euo pipefail
          vp run check:changed "$BASE_SHA" --concurrency 2 2>&1 | tee "$RUNNER_TEMP/recovery-checks.log"
      - name: Verify tested source unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload exact-source check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-recovery-checks
          path: |
            ${{ runner.temp }}/recovery-checks.log
            ${{ runner.temp }}/title-baseline.log
          if-no-files-found: warn
