name: Localization recovery exact-source checks
on:
  push:
    branches: [validation/i18n-recovery-round22]
permissions:
  contents: read
concurrency:
  group: i18n-recovery-round22
  cancel-in-progress: false
env:
  CI: "true"
  SOURCE_SHA: f1ddad9679625ebd81b4cc648c45aa6e34b1230c
  PARENT_SHA: 607f738be348543eadfe7fc60e319bccf1859f6b
  BASE_SHA: c87de3409e95958631e6ca1c755fa1e4c23d49cc
  VP_REMOTE_CACHE: "off"
  VP_REMOTE_CACHE_URL: ""
jobs:
  regression:
    name: Exact-source changed-file and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify public repository and check out exact source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          assert os.environ["GITHUB_REPOSITORY"] == "ZhiweiXiao98/t3code"
          assert event["repository"]["private"] is False
          assert os.environ["GITHUB_REF"] == "refs/heads/validation/i18n-recovery-round22"
          PY
          git init .
          git remote add origin "https://github.com/ZhiweiXiao98/t3code.git"
          git fetch --no-tags --depth=64 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = c7d3d3cad11c194bef9b80191b546531c1445c57
          git diff --exit-code
          printf 'Source: %s\nBase: %s\n' "$SOURCE_SHA" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Install official Chromium and system dependencies
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Observe original Snooze fixture once
        shell: bash
        run: |
          set -euo pipefail
          file=apps/web/src/components/Sidebar.snooze.browser.test.tsx
          saved=$(mktemp "$RUNNER_TEMP/snooze-corrected.XXXXXX")
          cp "$file" "$saved"
          restore_snooze() { cp "$saved" "$file"; }
          trap restore_snooze EXIT
          git show "$BASE_SHA:$file" > "$file"
          echo '16f39985eb0bc8a8c1be4abbc95e65b19a37b072b74267d71a7fee6cdb7c815b  apps/web/src/components/Sidebar.snooze.browser.test.tsx' | sha256sum -c -
          set +e
          vp test run "$file" 2>&1 | tee "$RUNNER_TEMP/snooze-original-observation.log"
          original_status=${PIPESTATUS[0]}
          set -e
          printf 'Original fixture exit: %s\n' "$original_status" | tee "$RUNNER_TEMP/snooze-original-status.txt"
          printf 'Original Snooze observational exit: %s (not a required red baseline)\n' "$original_status" >> "$GITHUB_STEP_SUMMARY"
          restore_snooze
          trap - EXIT
          git diff --exit-code
      - name: Prove cached owned errors fail on prior production
        shell: bash
        run: |
          set -euo pipefail
          saved=$(mktemp -d "$RUNNER_TEMP/cached-errors-baseline.XXXXXX")
          files=(apps/web/src/i18n/messages.ts)
          for file in "${files[@]}"; do mkdir -p "$saved/$(dirname "$file")"; cp "$file" "$saved/$file"; done
          restore_source() { for file in "${files[@]}"; do cp "$saved/$file" "$file"; done; }
          trap restore_source EXIT
          for file in "${files[@]}"; do git show "$BASE_SHA:$file" > "$file"; done
          set +e
          vp test run apps/web/src/components/pullRequest/PullRequestDetailPanel.permissions.browser.test.tsx -t 'translates GitLab reference copy labels: number success' 2>&1 | tee "$RUNNER_TEMP/title-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          restore_source
          trap - EXIT
          test "$baseline_status" -ne 0
          python3 -c 'import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); p.write_text(re.sub(r"\x1b\[[0-9;]*m", "", p.read_text()))' "$RUNNER_TEMP/title-baseline.log"
          grep -E "Tests[[:space:]]+1 failed" "$RUNNER_TEMP/title-baseline.log"
          grep -E "AssertionError:.*to be called once with arguments" "$RUNNER_TEMP/title-baseline.log"
          grep -F '已复制合并请求编号' "$RUNNER_TEMP/title-baseline.log"
          grep -F '已复制MR number' "$RUNNER_TEMP/title-baseline.log"
          if grep -E "Unhandled Errors|Unhandled Rejection|Test timed out|locator[.][[:alpha:]]+: Timeout|Failed to import test file|is not a function|does not provide an export|change in the order of Hooks|Rendered (fewer|more) hooks|Should have a queue|invalid-hook-call|Cannot find element with locator" "$RUNNER_TEMP/title-baseline.log"; then
            echo "Baseline failed for a fixture or runtime reason, not verified localization behavior." >&2
            exit 1
          fi
          git diff --exit-code
      - name: Run changed-file regression checks
        shell: bash
        run: |
          set -euo pipefail
          vp run check:changed "$BASE_SHA" --concurrency 2 2>&1 | tee "$RUNNER_TEMP/recovery-checks.log"
      - name: Verify tested source unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload exact-source check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-recovery-checks
          path: |
            ${{ runner.temp }}/recovery-checks.log
            ${{ runner.temp }}/title-baseline.log
            ${{ runner.temp }}/snooze-original-observation.log
            ${{ runner.temp }}/snooze-original-status.txt
          if-no-files-found: warn










