name: Localization recovery exact-source checks
on:
  push:
    branches: [validation/i18n-recovery-round22]
permissions:
  contents: read
concurrency:
  group: i18n-recovery-round22
  cancel-in-progress: false
env:
  CI: "true"
  SOURCE_SHA: 14a2a662750e566bf84177dcd4ba4b59cf77396a
  PARENT_SHA: 17f3f88459ddf847a86c6f69a6031b52874291e7
  BASE_SHA: 17f3f88459ddf847a86c6f69a6031b52874291e7
  VP_REMOTE_CACHE: "off"
  VP_REMOTE_CACHE_URL: ""
jobs:
  regression:
    name: Exact-source changed-file and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify public repository and check out exact source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          assert os.environ["GITHUB_REPOSITORY"] == "ZhiweiXiao98/t3code"
          assert event["repository"]["private"] is False
          assert os.environ["GITHUB_REF"] == "refs/heads/validation/i18n-recovery-round22"
          PY
          git init .
          git remote add origin "https://github.com/ZhiweiXiao98/t3code.git"
          git fetch --no-tags --depth=64 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = 9a96f2b96cad1b40d3e42ad41cc8e2f0eb80eeb8
          git diff --exit-code
          printf 'Source: %s\nBase: %s\n' "$SOURCE_SHA" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Prove eight owned provider notices fail on prior production
        shell: bash
        run: |
          set -euo pipefail
          saved=$(mktemp -d "$RUNNER_TEMP/provider-notice-baseline.XXXXXX")
          files=(packages/contracts/src/providerUsageLimits.ts packages/shared/src/usageLimits.ts packages/provider-cursor/src/server/usageLimits.ts packages/provider-grok/src/server/usageLimits.ts packages/provider-opencode/src/server/usageLimits.ts apps/server/src/provider/antigravityUsageLimits.ts)
          for file in "${files[@]}"; do mkdir -p "$saved/$(dirname "$file")"; cp "$file" "$saved/$file"; done
          restore_source() { for file in "${files[@]}"; do cp "$saved/$file" "$file"; done; }
          trap restore_source EXIT
          for file in "${files[@]}"; do git show "$BASE_SHA:$file" > "$file"; done
          set +e
          vp test run packages/contracts/src/providerUsageLimits.test.ts packages/shared/src/usageLimits.test.ts packages/provider-cursor/src/server/usageLimits.test.ts apps/server/src/provider/GrokProvider.test.ts packages/provider-opencode/src/server/status.test.ts apps/server/src/provider/antigravityUsageLimits.test.ts 2>&1 | tee "$RUNNER_TEMP/consumer-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          restore_source
          trap - EXIT
          test "$baseline_status" -ne 0
          grep -F "AssertionError" "$RUNNER_TEMP/consumer-baseline.log"
          grep -F "messageDescriptor" "$RUNNER_TEMP/consumer-baseline.log"
          ! grep -F "Unhandled Errors" "$RUNNER_TEMP/consumer-baseline.log"
          git diff --exit-code
      - name: Run changed-file regression checks
        shell: bash
        run: |
          set -euo pipefail
          vp run check:changed "$BASE_SHA" --concurrency 2 2>&1 | tee "$RUNNER_TEMP/recovery-checks.log"
      - name: Verify tested source unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload exact-source check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-recovery-checks
          path: |
            ${{ runner.temp }}/recovery-checks.log
            ${{ runner.temp }}/consumer-baseline.log
          if-no-files-found: warn
