name: Localization recovery exact-source checks
on:
  push:
    branches: [validation/i18n-recovery-round22]
permissions:
  contents: read
concurrency:
  group: i18n-recovery-round22
  cancel-in-progress: false
env:
  CI: "true"
  SOURCE_SHA: 05235dd4dfbfcbf5c8449d97544b04a125b7d785
  PARENT_SHA: c7912f74a595ad8a84cd5acecc93916b461bb703
  BASE_SHA: f8377edfdb4584b1fcd8c09c442f78cce44587b7
  VP_REMOTE_CACHE: "off"
  VP_REMOTE_CACHE_URL: ""
jobs:
  regression:
    name: Exact-source changed-file and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify public repository and check out exact source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          assert os.environ["GITHUB_REPOSITORY"] == "ZhiweiXiao98/t3code"
          assert event["repository"]["private"] is False
          assert os.environ["GITHUB_REF"] == "refs/heads/validation/i18n-recovery-round22"
          PY
          git init .
          git remote add origin "https://github.com/ZhiweiXiao98/t3code.git"
          git fetch --no-tags --depth=64 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = ddc51d24f63c5c8862ce3e4777ef2082d7799f33
          git diff --exit-code
          printf 'Source: %s\nBase: %s\n' "$SOURCE_SHA" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Install official Chromium and system dependencies
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prove cached owned errors fail on prior production
        shell: bash
        run: |
          set -euo pipefail
          saved=$(mktemp -d "$RUNNER_TEMP/cached-errors-baseline.XXXXXX")
          files=(apps/web/src/components/settings/KeybindingsSettings.tsx)
          for file in "${files[@]}"; do mkdir -p "$saved/$(dirname "$file")"; cp "$file" "$saved/$file"; done
          restore_source() { for file in "${files[@]}"; do cp "$saved/$file" "$file"; done; }
          trap restore_source EXIT
          for file in "${files[@]}"; do git show "$BASE_SHA:$file" > "$file"; done
          set +e
          vp test run apps/web/src/components/settings/KeybindingsSettings.browser.test.tsx -t 'uses settlement locale for keybinding save failure: owned' 2>&1 | tee "$RUNNER_TEMP/title-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          restore_source
          trap - EXIT
          test "$baseline_status" -ne 0
          python3 -c 'import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); p.write_text(re.sub(r"\x1b\[[0-9;]*m", "", p.read_text()))' "$RUNNER_TEMP/title-baseline.log"
          grep -E "Tests[[:space:]]+1 failed" "$RUNNER_TEMP/title-baseline.log"
          grep -E "AssertionError:.*to be called once with arguments" "$RUNNER_TEMP/title-baseline.log"
          grep -F '无法保存快捷键' "$RUNNER_TEMP/title-baseline.log"
          grep -F 'Unable to save keybinding' "$RUNNER_TEMP/title-baseline.log"
          if grep -E "Unhandled Errors|Unhandled Rejection|Test timed out|locator[.][[:alpha:]]+: Timeout|Failed to import test file|is not a function|does not provide an export|change in the order of Hooks|Rendered (fewer|more) hooks|Should have a queue|invalid-hook-call|Cannot find element with locator" "$RUNNER_TEMP/title-baseline.log"; then
            echo "Baseline failed for a fixture or runtime reason, not verified localization behavior." >&2
            exit 1
          fi
          git diff --exit-code
      - name: Run changed-file regression checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frame-observation"
          export T3CODE_BROWSER_LIFECYCLE_DIR="$RUNNER_TEMP/frame-observation"
          vp run check:changed "$BASE_SHA" --concurrency 2 2>&1 | tee "$RUNNER_TEMP/recovery-checks.log"
      - name: Verify live public socket state observation
        shell: bash
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Additional coverage gate only; existing CI source/integrity checks remain required."""
          import json
          import sys
          import zipfile
          
          
          def qualify(rows):
              counts = {name: 0 for name in (
                  "snapshots", "tester_101", "missing_state", "null_state", "malformed_state",
                  "different_state", "missing_data", "malformed_data", "zero_data", "qualified",
              )}
              for row in rows:
                  if not isinstance(row, dict) or row.get("event") != "socket-activity-snapshot":
                      continue
                  counts["snapshots"] += 1
                  if row.get("socket_kind") != "tester" or type(row.get("handshake_status")) is not int or row["handshake_status"] != 101:
                      continue
                  counts["tester_101"] += 1
                  fields = ("page_closed", "context_closed", "browser_connected")
                  if any(key not in row for key in fields):
                      counts["missing_state"] += 1
                      continue
                  if any(row[key] is None for key in fields):
                      counts["null_state"] += 1
                      continue
                  if any(type(row[key]) is not bool for key in fields):
                      counts["malformed_state"] += 1
                      continue
                  if not (row["page_closed"] is False and row["context_closed"] is False and row["browser_connected"] is True):
                      counts["different_state"] += 1
                      continue
                  data = ("sent_data_count", "received_data_count")
                  if any(key not in row for key in data):
                      counts["missing_data"] += 1
                      continue
                  if any(type(row[key]) is not int or not 0 <= row[key] <= 65535 for key in data):
                      counts["malformed_data"] += 1
                      continue
                  if any(row[key] == 0 for key in data):
                      counts["zero_data"] += 1
                      continue
                  counts["qualified"] += 1
              return counts
          
          
          import os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "frame-observation/browser-lifecycle.jsonl"
          assert p.stat().st_size <= 2 * 1024 * 1024, "Oversized lifecycle file"
          rows = [json.loads(line) for line in p.read_text().splitlines() if line.strip()]
          counts = qualify(rows)
          print(json.dumps(counts, sort_keys=True))
          assert counts["qualified"] > 0, "No same-row healthy tester state with positive bidirectional data"
          print("Local public state and data coverage verified; control frames and remote health not inferred.")
          
          PY
      - name: Verify tested source unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload exact-source check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-recovery-checks
          path: |
            ${{ runner.temp }}/recovery-checks.log
            ${{ runner.temp }}/title-baseline.log
            ${{ runner.temp }}/frame-observation/
          if-no-files-found: warn










