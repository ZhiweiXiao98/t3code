name: Localization recovery exact-source checks
on:
  push:
    branches: [validation/i18n-recovery-round22]
permissions:
  contents: read
concurrency:
  group: i18n-recovery-round22
  cancel-in-progress: false
env:
  CI: "true"
  SOURCE_SHA: 216dcded47a8ab021a41c327527e3dc8136cbf80
  PARENT_SHA: 532d4bba8a681857c1768a9e9d65fa7a1b9294b9
  BASE_SHA: 532d4bba8a681857c1768a9e9d65fa7a1b9294b9
  VP_REMOTE_CACHE: "off"
  VP_REMOTE_CACHE_URL: ""
jobs:
  regression:
    name: Exact-source changed-file and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify public repository and check out exact source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          assert os.environ["GITHUB_REPOSITORY"] == "ZhiweiXiao98/t3code"
          assert event["repository"]["private"] is False
          assert os.environ["GITHUB_REF"] == "refs/heads/validation/i18n-recovery-round22"
          PY
          git init .
          git remote add origin "https://github.com/ZhiweiXiao98/t3code.git"
          git fetch --no-tags --depth=64 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = 210720ce63fe1d5ef3f9dba1143cce59df727fba
          git diff --exit-code
          printf 'Source: %s\nBase: %s\n' "$SOURCE_SHA" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Install official Chromium and system dependencies
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prove exact prior fixture missing-export failure
        shell: bash
        run: |
          set -euo pipefail
          file=apps/web/src/lib/resourceTelemetryState.browser.test.tsx
          saved=$(mktemp -d "$RUNNER_TEMP/resource-fixture-baseline.XXXXXX")
          cp "$file" "$saved/original.tsx"
          restore_fixture() { cp "$saved/original.tsx" "$file"; }
          trap restore_fixture EXIT
          # BASE_SHA must be the pinned parent containing the exact old fixture.
          # Production files are never restored or altered for this baseline.
          test "$(git rev-parse "$BASE_SHA:$file")" = 981beeafdfd388629931c1dd533c6f4aab340254
          git show "$BASE_SHA:$file" > "$file"
          set +e
          vp test run "$file" 2>&1 | tee "$RUNNER_TEMP/resource-fixture-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          restore_fixture
          trap - EXIT
          test "$baseline_status" -ne 0
          python3 - "$RUNNER_TEMP/resource-fixture-baseline.log" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = re.sub(r"\x1b\[[0-9;]*m", "", path.read_text())
          path.write_text(text)
          expected = "The requested module '/src/state/server.ts' does not provide an export named 'themeServerEnvironmentThemesAtom'"
          assert expected in text, "Missing exact known fixture export failure"
          assert "Failed to import test file" in text and "resourceTelemetryState.browser.test.tsx" in text
          assert re.search(r"Test Files\s+1 failed\s+\(1\)", text), "Expected exactly one failed suite"
          assert re.search(r"Tests\s+no tests", text), "Expected import failure before test collection"
          for forbidden in (
              r"AssertionError", r"Unhandled Errors?", r"Unhandled Rejection", r"Test timed out",
              r"locator\.[A-Za-z]+: Timeout", r"TimeoutError", r"BrowserConnectionError",
              r"VITEST_BROWSER_CONNECTION_CLOSED", r"Browser connection was closed", r"createTesters.*timed out",
              r"is not a function", r"change in the order of Hooks", r"Rendered (fewer|more) hooks",
              r"Should have a queue", r"invalid-hook-call", r"Cannot find element with locator",
          ):
              assert not re.search(forbidden, text), "Unrelated baseline failure: " + forbidden
          missing_exports = re.findall(r"does not provide an export named '([^']+)'", text)
          assert missing_exports and set(missing_exports) == {"themeServerEnvironmentThemesAtom"}
          print("Verified exact missing-export baseline: one failed file, no collected tests")
          PY
          git diff --exit-code
          git diff --cached --exit-code
      - name: Run changed-file regression checks
        shell: bash
        run: |
          set -euo pipefail
          vp run check:changed "$BASE_SHA" --concurrency 2 2>&1 | tee "$RUNNER_TEMP/recovery-checks.log"
          python3 - <<'PY'
          import pathlib, re, os
          text=pathlib.Path(os.environ["RUNNER_TEMP"], "recovery-checks.log").read_text()
          text=re.sub(r"\x1b\[[0-9;]*m", "", text)
          assert "resourceTelemetryState.browser.test.tsx" in text
          assert re.search(r"Tests\s+4 passed\s+\(4\)", text), "All four existing browser cases must pass"
          PY
      - name: Verify tested source unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload exact-source check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-recovery-checks
          path: |
            ${{ runner.temp }}/recovery-checks.log
            ${{ runner.temp }}/resource-fixture-baseline.log
          if-no-files-found: warn










