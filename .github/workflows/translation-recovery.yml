name: Localization recovery exact-source checks
on:
  push:
    branches: [validation/i18n-recovery-round22]
permissions:
  contents: read
concurrency:
  group: i18n-recovery-round22
  cancel-in-progress: false
env:
  CI: "true"
  SOURCE_SHA: 6a779bcd5067c2f6594ef4ee900f65656b6c0cb5
  PARENT_SHA: bcf965df5b8bf2a7c56cb32ce8fd1258d2e90b5f
  BASE_SHA: bcf965df5b8bf2a7c56cb32ce8fd1258d2e90b5f
  VP_REMOTE_CACHE: "off"
  VP_REMOTE_CACHE_URL: ""
jobs:
  regression:
    name: Exact-source changed-file and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify public repository and check out exact source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          assert os.environ["GITHUB_REPOSITORY"] == "ZhiweiXiao98/t3code"
          assert event["repository"]["private"] is False
          assert os.environ["GITHUB_REF"] == "refs/heads/validation/i18n-recovery-round22"
          PY
          git init .
          git remote add origin "https://github.com/ZhiweiXiao98/t3code.git"
          git fetch --no-tags --depth=64 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = 188f135d685b69d73bfb8d449dd9dd526ac8ff68
          git diff --exit-code
          printf 'Source: %s\nBase: %s\n' "$SOURCE_SHA" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Install official Chromium and system dependencies
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prove cached owned errors fail on prior production
        shell: bash
        run: |
          set -euo pipefail
          saved=$(mktemp -d "$RUNNER_TEMP/cached-errors-baseline.XXXXXX")
          files=(apps/web/src/components/projectScriptEditor.tsx apps/web/src/components/ProjectScriptsControl.tsx apps/web/src/components/settings/ProjectActionsSettings.tsx)
          for file in "${files[@]}"; do mkdir -p "$saved/$(dirname "$file")"; cp "$file" "$saved/$file"; done
          restore_source() { for file in "${files[@]}"; do cp "$saved/$file" "$file"; done; }
          trap restore_source EXIT
          for file in "${files[@]}"; do git show "$BASE_SHA:$file" > "$file"; done
          set +e
          vp test run apps/web/src/components/projectScriptEditor.browser.test.tsx apps/web/src/components/projectScriptImport.browser.test.tsx -t 'keeps cached owned editor|keeps owned editor save|keeps the owned shortcut denial|keeps cached owned (settings|chat) import' 2>&1 | tee "$RUNNER_TEMP/title-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          restore_source
          trap - EXIT
          test "$baseline_status" -ne 0
          grep -E "AssertionError|Expected element to have text content:" "$RUNNER_TEMP/title-baseline.log"
          ! grep -E "Unhandled Errors|Unhandled Rejection|Test timed out|locator[.][a-z]+: Timeout|Failed to import test file|is not a function|does not provide an export" "$RUNNER_TEMP/title-baseline.log"
          git diff --exit-code
      - name: Run changed-file regression checks
        shell: bash
        run: |
          set -euo pipefail
          vp run check:changed "$BASE_SHA" --concurrency 2 2>&1 | tee "$RUNNER_TEMP/recovery-checks.log"
      - name: Verify tested source unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload exact-source check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-recovery-checks
          path: |
            ${{ runner.temp }}/recovery-checks.log
            ${{ runner.temp }}/title-baseline.log
          if-no-files-found: warn
