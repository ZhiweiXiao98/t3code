name: Localization recovery exact-source checks
on:
  push:
    branches: [validation/i18n-recovery-round22]
permissions:
  contents: read
concurrency:
  group: i18n-recovery-round22
  cancel-in-progress: false
env:
  CI: "true"
  SOURCE_SHA: 5e7fc0c8ae3607f745b7d2c86985bc1731c48fb8
  PARENT_SHA: 2a3a15308f24056c40a970a0683d5686dbfc9f1f
  BASE_SHA: 40347ee828d84841f29fd481e21c3a84e26ed473
  VP_REMOTE_CACHE: "off"
  VP_REMOTE_CACHE_URL: ""
jobs:
  regression:
    name: Exact-source changed-file and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify public repository and check out exact source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          assert os.environ["GITHUB_REPOSITORY"] == "ZhiweiXiao98/t3code"
          assert event["repository"]["private"] is False
          assert os.environ["GITHUB_REF"] == "refs/heads/validation/i18n-recovery-round22"
          PY
          git init .
          git remote add origin "https://github.com/ZhiweiXiao98/t3code.git"
          git fetch --no-tags --depth=64 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = a158b7520ce8d7137feb74913e339b30a8d22384
          git diff --exit-code
          printf 'Source: %s\nBase: %s\n' "$SOURCE_SHA" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Install official Chromium and system dependencies
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prove project file harness regression on prior test
        shell: bash
        run: |
          set -euo pipefail
          test_file=apps/web/src/components/files/projectFilesQueryState.test.tsx
          saved=$(mktemp "$RUNNER_TEMP/project-files.XXXXXX")
          cp "$test_file" "$saved"
          restore_test() { cp "$saved" "$test_file"; }
          trap restore_test EXIT
          git show "$BASE_SHA:$test_file" > "$test_file"
          set +e
          vp test run "$test_file" 2>&1 | tee "$RUNNER_TEMP/project-files-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          restore_test
          trap - EXIT
          test "$baseline_status" -ne 0
          grep -F "Cannot read properties of null" "$RUNNER_TEMP/project-files-baseline.log"
          grep -F "useContext" "$RUNNER_TEMP/project-files-baseline.log"
          git diff --exit-code
      - name: Prove consumer regressions fail on prior production
        shell: bash
        run: |
          set -euo pipefail
          saved=$(mktemp -d "$RUNNER_TEMP/consumer-baseline.XXXXXX")
          files=(packages/shared/src/usageLimits.ts apps/web/src/components/usage/UsageLimits.tsx apps/web/src/components/usage/UsageLimitsPooled.tsx apps/web/src/components/chat/ThreadDetailsUsage.tsx apps/mobile/src/features/usage/UsageLimitsSection.tsx apps/mobile/src/features/usage/UsageLimitsPooled.tsx apps/mobile/src/widgets/subscriptionUsageSnapshot.ts apps/mobile/src/widgets/SubscriptionUsage.tsx apps/mobile/src/widgets/SubscriptionUsage.android.tsx)
          for file in "${files[@]}"; do mkdir -p "$saved/$(dirname "$file")"; cp "$file" "$saved/$file"; done
          restore_source() { for file in "${files[@]}"; do cp "$saved/$file" "$file"; done; }
          trap restore_source EXIT
          for file in "${files[@]}"; do git show "$BASE_SHA:$file" > "$file"; done
          set +e
          vp test run packages/shared/src/usageLimits.test.ts apps/mobile/src/widgets/subscriptionUsageSnapshot.test.ts apps/mobile/src/widgets/SubscriptionUsage.test.tsx apps/mobile/src/widgets/SubscriptionUsage.android.test.tsx 2>&1 | tee "$RUNNER_TEMP/consumer-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          vp test run apps/web/src/components/usage/UsageLimitsPooled.browser.test.tsx -t "updates owned pooled labels" 2>&1 | tee "$RUNNER_TEMP/title-baseline.log"
          browser_status=${PIPESTATUS[0]}
          set -e
          restore_source
          trap - EXIT
          test "$baseline_status" -ne 0
          test "$browser_status" -ne 0
          grep -F "AssertionError" "$RUNNER_TEMP/consumer-baseline.log"
          grep -F "labelDescriptor" "$RUNNER_TEMP/consumer-baseline.log"
          grep -F "AssertionError" "$RUNNER_TEMP/title-baseline.log"
          grep -F "会话" "$RUNNER_TEMP/title-baseline.log"
          ! grep -F "Unhandled Errors" "$RUNNER_TEMP/consumer-baseline.log"
          ! grep -F "Unhandled Errors" "$RUNNER_TEMP/title-baseline.log"
          git diff --exit-code
      - name: Run changed-file regression checks
        shell: bash
        run: |
          set -euo pipefail
          vp run check:changed "$BASE_SHA" --concurrency 2 2>&1 | tee "$RUNNER_TEMP/recovery-checks.log"
      - name: Run complete web unit and browser suite
        shell: bash
        env:
          SUITE: web
        run: |
          set -euo pipefail
          vp run --filter @t3tools/web test 2>&1 | tee "$RUNNER_TEMP/full-web-suite.log"
      - name: Verify tested source unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload exact-source check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-recovery-checks
          path: |
            ${{ runner.temp }}/recovery-checks.log
            ${{ runner.temp }}/title-baseline.log
            ${{ runner.temp }}/consumer-baseline.log
            ${{ runner.temp }}/project-files-baseline.log
            ${{ runner.temp }}/full-web-suite.log
          if-no-files-found: warn
