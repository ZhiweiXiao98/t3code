name: Localization recovery exact-source checks
on:
  push:
    branches: [validation/i18n-recovery-round22]
permissions:
  contents: read
concurrency:
  group: i18n-recovery-round22
  cancel-in-progress: false
env:
  CI: "true"
  SOURCE_SHA: a2c9bb07c1c613496cfec4769fda55155593f971
  PARENT_SHA: 6940f0b385679b6d7fbc98dfddeb7a953b5fa4e8
  BASE_SHA: b2c5a8b9395107f82216554eb2a25510156d1f49
  VP_REMOTE_CACHE: "off"
  VP_REMOTE_CACHE_URL: ""
jobs:
  regression:
    name: Exact-source changed-file and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify public repository and check out exact source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          assert os.environ["GITHUB_REPOSITORY"] == "ZhiweiXiao98/t3code"
          assert event["repository"]["private"] is False
          assert os.environ["GITHUB_REF"] == "refs/heads/validation/i18n-recovery-round22"
          PY
          git init .
          git remote add origin "https://github.com/ZhiweiXiao98/t3code.git"
          git fetch --no-tags --depth=64 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = 67bef516f1481f520e6e95ae949b69e04f85c030
          git diff --exit-code
          printf 'Source: %s\nBase: %s\n' "$SOURCE_SHA" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Install official Chromium and system dependencies
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prove cached owned errors fail on prior production
        shell: bash
        run: |
          set -euo pipefail
          saved=$(mktemp -d "$RUNNER_TEMP/cached-errors-baseline.XXXXXX")
          files=(apps/web/src/components/settings/LinkedEnvironmentsSettings.tsx)
          for file in "${files[@]}"; do mkdir -p "$saved/$(dirname "$file")"; cp "$file" "$saved/$file"; done
          restore_source() { for file in "${files[@]}"; do cp "$saved/$file" "$file"; done; }
          trap restore_source EXIT
          for file in "${files[@]}"; do git show "$BASE_SHA:$file" > "$file"; done
          set +e
          vp test run apps/web/src/components/settings/LinkedEnvironmentsSettings.browser.test.tsx -t 'uses settlement locale for environment pairing mint failure: not_allowed' 2>&1 | tee "$RUNNER_TEMP/title-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          restore_source
          trap - EXIT
          test "$baseline_status" -ne 0
          python3 -c 'import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); p.write_text(re.sub(r"\x1b\[[0-9;]*m", "", p.read_text()))' "$RUNNER_TEMP/title-baseline.log"
          grep -E "FAIL .*LinkedEnvironmentsSettings[.]browser[.]test[.]tsx > uses settlement locale for environment pairing mint failure: not_allowed$" "$RUNNER_TEMP/title-baseline.log"
          grep -E "Tests[[:space:]]+1 failed" "$RUNNER_TEMP/title-baseline.log"
          grep -E "AssertionError:.*to be called once with arguments" "$RUNNER_TEMP/title-baseline.log"
          grep -F '无法关联环境' "$RUNNER_TEMP/title-baseline.log"
          grep -F 'Could not link the environment' "$RUNNER_TEMP/title-baseline.log"
          if grep -E "Unhandled Errors|Unhandled Rejection|Hook timed out|Test timed out|VITEST_BROWSER_CONNECTION_CLOSED|birpc|Browser connection was closed|locator[.][[:alpha:]]+: Timeout|Failed to import test file|is not a function|does not provide an export|change in the order of Hooks|Rendered (fewer|more) hooks|Should have a queue|invalid-hook-call|Cannot find element with locator" "$RUNNER_TEMP/title-baseline.log"; then
            echo "Baseline failed for a fixture or runtime reason, not verified localization behavior." >&2
            exit 1
          fi
          git diff --exit-code
      - name: Run changed-file regression checks
        shell: bash
        run: |
          set -euo pipefail
          vp run check:changed "$BASE_SHA" --concurrency 2 2>&1 | tee "$RUNNER_TEMP/recovery-checks.log"
          python3 - "$RUNNER_TEMP/recovery-checks.log" <<'PY'
          import pathlib,re,sys
          text=re.sub(r"\x1b\[[0-9;]*m","",pathlib.Path(sys.argv[1]).read_text())
          pattern=r"(?m)^\s*✓[^\n]*src/components/settings/LinkedEnvironmentsSettings\.browser\.test\.tsx\s+\(15 tests\)[^\n]*\n(?:[ \t]*\n|[ \t]+✓ uses settlement locale for (?:direct environment link|linked environment forget|environment pairing mint) failure: (?:owned|raw|empty|interrupted|cancel|denied|not_allowed|unavailable|null) \d+(?:\.\d+)?(?:ms|s)\n)*\s*Test Files\s+1 passed \(1\)\s*\n\s*Tests\s+15 passed \(15\)\s*$"
          assert len(re.findall(pattern,text))==1,"Required 15-case browser result absent or inconsistent"
          assert not re.search(r"Unhandled Errors|Unhandled Rejection|VITEST_BROWSER_CONNECTION_CLOSED|Browser connection was closed|Hook timed out|Test timed out",text),"Runtime failure in focused checks"
          PY
      - name: Verify tested source unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload exact-source check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-recovery-checks
          path: |
            ${{ runner.temp }}/recovery-checks.log
            ${{ runner.temp }}/title-baseline.log
          if-no-files-found: warn










