name: Localization recovery exact-source checks
on:
  push:
    branches: [validation/i18n-recovery-round22]
permissions:
  contents: read
concurrency:
  group: i18n-recovery-round22
  cancel-in-progress: false
env:
  CI: "true"
  SOURCE_SHA: cc9edd6d05bcca5807c3e06983c86e2236346659
  PARENT_SHA: 0f86d95085a229750d5a522589f262a2d179f704
  BASE_SHA: 0f86d95085a229750d5a522589f262a2d179f704
  VP_REMOTE_CACHE: "off"
  VP_REMOTE_CACHE_URL: ""
jobs:
  regression:
    name: Exact-source changed-file and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify public repository and check out exact source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          assert os.environ["GITHUB_REPOSITORY"] == "ZhiweiXiao98/t3code"
          assert event["repository"]["private"] is False
          assert os.environ["GITHUB_REF"] == "refs/heads/validation/i18n-recovery-round22"
          PY
          git init .
          git remote add origin "https://github.com/ZhiweiXiao98/t3code.git"
          git fetch --no-tags --depth=64 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = 2505a856d0154492fb2ec6ed5da8114018891e46
          git diff --exit-code
          printf 'Source: %s\nBase: %s\n' "$SOURCE_SHA" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Install official Chromium and system dependencies
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prove label errors fail on prior production
        shell: bash
        run: |
          set -euo pipefail
          saved=$(mktemp -d "$RUNNER_TEMP/cached-errors-baseline.XXXXXX")
          files=(apps/web/src/components/pullRequest/PullRequestLabelPicker.tsx)
          for file in "${files[@]}"; do mkdir -p "$saved/$(dirname "$file")"; cp "$file" "$saved/$file"; done
          restore_source() { for file in "${files[@]}"; do cp "$saved/$file" "$file"; done; }
          trap restore_source EXIT
          for file in "${files[@]}"; do git show "b46b4fa90b809e3a8c07637e99a7705bc29119c7:$file" > "$file"; done
          set +e
          vp test run apps/web/src/components/pullRequest/PullRequestLabelPicker.browser.test.tsx -t 'uses settlement locale for label add failure: owned' 2>&1 | tee "$RUNNER_TEMP/label-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          restore_source
          trap - EXIT
          test "$baseline_status" -ne 0
          python3 -c 'import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); p.write_text(re.sub(r"\x1b\[[0-9;]*m", "", p.read_text()))' "$RUNNER_TEMP/label-baseline.log"
          grep -E "Tests[[:space:]]+1 failed" "$RUNNER_TEMP/label-baseline.log"
          grep -E "AssertionError:.*to be called once with arguments" "$RUNNER_TEMP/label-baseline.log"
          grep -F '无法添加标签 Literal $& {label}' "$RUNNER_TEMP/label-baseline.log"
          grep -F 'Could not put Literal $& {label} on' "$RUNNER_TEMP/label-baseline.log"
          grep -F '托管服务拒绝了操作。请确认你拥有此仓库的分类权限。' "$RUNNER_TEMP/label-baseline.log"
          grep -F 'The host refused it. Check that you have triage access on this repository.' "$RUNNER_TEMP/label-baseline.log"
          if grep -E "Unhandled Errors|Unhandled Rejection|Test timed out|locator[.][[:alpha:]]+: Timeout|Failed to import test file|is not a function|does not provide an export|change in the order of Hooks|Rendered (fewer|more) hooks|Should have a queue|invalid-hook-call|Cannot find element with locator" "$RUNNER_TEMP/label-baseline.log"; then
            echo "Baseline failed for a fixture or runtime reason, not verified localization behavior." >&2
            exit 1
          fi
          git diff --exit-code
      - name: Prove cached owned errors fail on prior production
        shell: bash
        run: |
          set -euo pipefail
          saved=$(mktemp -d "$RUNNER_TEMP/cached-errors-baseline.XXXXXX")
          files=(apps/web/src/components/pullRequest/PullRequestReviewerPicker.tsx)
          for file in "${files[@]}"; do mkdir -p "$saved/$(dirname "$file")"; cp "$file" "$saved/$file"; done
          restore_source() { for file in "${files[@]}"; do cp "$saved/$file" "$file"; done; }
          trap restore_source EXIT
          for file in "${files[@]}"; do git show "$BASE_SHA:$file" > "$file"; done
          set +e
          vp test run apps/web/src/components/pullRequest/PullRequestReviewerPicker.browser.test.tsx -t 'uses settlement locale for reviewer request failure: owned' 2>&1 | tee "$RUNNER_TEMP/title-baseline.log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          restore_source
          trap - EXIT
          test "$baseline_status" -ne 0
          python3 -c 'import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); p.write_text(re.sub(r"\x1b\[[0-9;]*m", "", p.read_text()))' "$RUNNER_TEMP/title-baseline.log"
          grep -E "Tests[[:space:]]+1 failed" "$RUNNER_TEMP/title-baseline.log"
          grep -E "AssertionError:.*to be called once with arguments" "$RUNNER_TEMP/title-baseline.log"
          grep -F '无法请求 Literal $& {reviewer} 进行评审' "$RUNNER_TEMP/title-baseline.log"
          grep -F 'Could not ask Literal $& {reviewer} for a review' "$RUNNER_TEMP/title-baseline.log"
          grep -F '托管服务拒绝了操作。请确认你拥有此仓库的写入权限，并且对方仍可访问该仓库。' "$RUNNER_TEMP/title-baseline.log"
          grep -F 'The host refused it. Check that you have write access on this repository, and that they still have access to it.' "$RUNNER_TEMP/title-baseline.log"
          if grep -E "Unhandled Errors|Unhandled Rejection|Test timed out|locator[.][[:alpha:]]+: Timeout|Failed to import test file|is not a function|does not provide an export|change in the order of Hooks|Rendered (fewer|more) hooks|Should have a queue|invalid-hook-call|Cannot find element with locator" "$RUNNER_TEMP/title-baseline.log"; then
            echo "Baseline failed for a fixture or runtime reason, not verified localization behavior." >&2
            exit 1
          fi
          git diff --exit-code
      - name: Run changed-file regression checks
        shell: bash
        run: |
          set -euo pipefail
          vp run check:changed b46b4fa90b809e3a8c07637e99a7705bc29119c7 --concurrency 2 2>&1 | tee "$RUNNER_TEMP/recovery-checks.log"
      - name: Verify tested source unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload exact-source check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-recovery-checks
          path: |
            ${{ runner.temp }}/recovery-checks.log
            ${{ runner.temp }}/title-baseline.log
            ${{ runner.temp }}/label-baseline.log
          if-no-files-found: warn










