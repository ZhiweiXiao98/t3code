name: Exact final ARM64 macOS 15 supplemental validation
'on':
  push:
    branches:
    - validation/v0.1.9-arm15-74039745
permissions:
  contents: read
  actions: read
concurrency:
  group: arm15-74039745
  cancel-in-progress: false
env:
  CLIENT_VERSION: 0.1.9-zh.1
  CI: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  T3CODE_DESKTOP_SIGNED: 'false'
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.repository == 'ZhiweiXiao98/t3code' && github.event.repository.private == false
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
    - uses: actions/github-script@v8
      id: source
      with:
        script: 'const {owner,repo}=context.repo;

          if(context.payload.repository.private!==false)throw new Error(''Public standard free runners
          only'');

          const source=''74039745b1b44834c30dd9cb275f1c224072dd96'';

          const code=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:43906200557})).data;

          if(code.head_sha!==''16eac5de44135169fc0c7f973347a0678238ed5e''||code.run_attempt!==1||code.conclusion!==''success'')throw
          new Error(''Exact-source complete code gates required'');

          core.setOutput(''sha'',source);

          await core.summary.addRaw(''Supplemental ARM64 macOS 15 validation; exact original target OS, capacity recovery only if jobs actually execute.
          Exact source: ''+source).write();

          '
  bundle:
    name: Build validated desktop bundle
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout exact source without credentials
      shell: bash
      env:
        SOURCE_SHA: ${{ needs.source.outputs.sha }}
        GIT_TERMINAL_PROMPT: '0'
      run: 'set -euo pipefail

        git init .

        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

        git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

        git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

        git checkout --detach FETCH_HEAD

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        '
    - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      with:
        node-version-file: package.json
        cache: true
        run-install: false
    - name: Install locked dependencies
      id: dependencies
      run: vp install --frozen-lockfile
    - name: Install Linux native build libraries
      run: python3 .github/scripts/ci-ubuntu-packages.py packages libsecret-1-dev pkg-config build-essential
        imagemagick
    - run: node scripts/update-release-package-versions.ts "$CLIENT_VERSION"
    - run: vp run build:desktop
    - run: node apps/desktop/scripts/verify-preload-bundle.mjs
    - uses: actions/upload-artifact@v7
      with:
        name: community-js-bundle
        path: 'apps/server/dist

          apps/desktop/dist-electron

          '
        if-no-files-found: error
        retention-days: 7
  desktop:
    name: Desktop ${{ matrix.platform }} ${{ matrix.arch }} (integrity checked)
    needs:
    - source
    - bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          platform: mac
          arch: arm64
          target: dmg
          rust_target: aarch64-apple-darwin
    steps:
    - name: Checkout exact source without credentials
      shell: bash
      env:
        SOURCE_SHA: ${{ needs.source.outputs.sha }}
        GIT_TERMINAL_PROMPT: '0'
      run: 'set -euo pipefail

        git init .

        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

        git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

        git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

        git checkout --detach FETCH_HEAD

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        '
    - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      with:
        node-version-file: package.json
        cache: true
        run-install: false
    - name: Install locked dependencies
      id: dependencies
      run: vp install --frozen-lockfile
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        toolchain: stable
        targets: ${{ matrix.rust_target }}
    - name: Install Windows Spectre-mitigated runtime
      if: matrix.platform == 'win'
      shell: pwsh
      run: '$vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

        $installPath = & $vswhere -products * -latest -property installationPath

        $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

        $proc = Start-Process $setup -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add",
        "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" -Wait
        -PassThru

        if ($proc.ExitCode -notin @(0, 3010)) { throw "VS installer failed: $($proc.ExitCode)" }

        '
    - run: node scripts/update-release-package-versions.ts "$CLIENT_VERSION"
    - uses: actions/download-artifact@v8
      with:
        name: community-js-bundle
        path: apps
    - uses: actions/download-artifact@v8
      if: matrix.platform == 'win'
      with:
        name: community-wsl-runtime
        path: wsl-runtime
    - name: Package community client
      env:
        PLATFORM: ${{ matrix.platform }}
        TARGET: ${{ matrix.target }}
        ARCH: ${{ matrix.arch }}
      run: "set -euo pipefail\nargs=(--platform \"$PLATFORM\" --target \"$TARGET\" --arch \"$ARCH\" --build-version\
        \ \"$CLIENT_VERSION\" --skip-build --verbose)\nif [[ \"$PLATFORM\" == win ]]; then\n  args+=(--wsl-runtime\
        \ \"$GITHUB_WORKSPACE/wsl-runtime/t3-$CLIENT_VERSION-linux-x64.tar.gz\")\nfi\nvp run dist:desktop:artifact\
        \ \"${args[@]}\"\necho \"Community build: macOS uses ad-hoc integrity signing without Developer\
        \ ID or notarization. Strict bundle integrity is required; Gatekeeper trust is reported separately.\
        \ Windows is not Authenticode signed.\" >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Verify macOS integrity and report quarantined Gatekeeper trust
      if: matrix.platform == 'mac'
      run: 'set -euo pipefail

        mount="$RUNNER_TEMP/desktop-launch-dmg"

        hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$(ls "$GITHUB_WORKSPACE"/release/*.dmg)"

        trap ''hdiutil detach "$mount" -force >/dev/null || true'' EXIT

        app=$(ls -d "$mount"/*.app)

        mkdir -p "$RUNNER_TEMP/desktop-launch-check"

        bash .github/scripts/verify-macos-distribution.sh "$app" --signature-only 2>&1 | tee "$RUNNER_TEMP/desktop-launch-check/signature.log"

        copy_root=$(mktemp -d "$RUNNER_TEMP/desktop-gatekeeper.XXXXXX")

        copy="$copy_root/$(basename "$app")"

        ditto "$app" "$copy"

        # Simulate a browser download on a disposable CI copy; never clear quarantine or change Gatekeeper.

        quarantine=$(printf ''0081;%x;T3CodeCI;'' "$(date +%s)")

        xattr -w com.apple.quarantine "$quarantine" "$copy"

        bash .github/scripts/verify-macos-distribution.sh "$copy" 2>&1 | tee "$RUNNER_TEMP/desktop-launch-check/gatekeeper.log"

        cp "$RUNNER_TEMP/desktop-launch-check/gatekeeper.log" "release/MACOS-TRUST-${{ matrix.arch }}.txt"

        cat "$RUNNER_TEMP/desktop-launch-check/gatekeeper.log" >> "$GITHUB_STEP_SUMMARY"

        executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")

        node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" --executable
        "$app/Contents/MacOS/$executable"

        '
    - name: Launch installed Windows client
      if: matrix.platform == 'win'
      shell: pwsh
      timeout-minutes: 10
      run: "$ErrorActionPreference = 'Stop'\n$installer = Join-Path $env:GITHUB_WORKSPACE \"release/T3-Code-$env:CLIENT_VERSION-x64.exe\"\
        \n$installDir = Join-Path $env:RUNNER_TEMP (\"t3-installed-\" + [guid]::NewGuid().ToString('N'))\n\
        if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {\n  throw \"Expected installer missing:\
        \ $installer\"\n}\n# NSIS requires /D last and its value without literal quote characters.\n$process\
        \ = Start-Process -FilePath $installer -ArgumentList \"/S /D=$installDir\" -Wait -PassThru\nif\
        \ ($process.ExitCode -ne 0) {\n  throw \"Installer failed with exit code $($process.ExitCode)\"\
        \n}\n$executable = Join-Path $installDir 'T3 Code (Beta).exe'\nif (-not (Test-Path -LiteralPath\
        \ $executable -PathType Leaf)) {\n  throw \"Installed application missing: $executable\"\n}\n\
        node scripts/smoke-desktop-app.ts --artifacts-dir \"$env:RUNNER_TEMP/desktop-launch-check\" --executable\
        \ \"$executable\"\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
    - uses: actions/upload-artifact@v7
      if: failure() && (matrix.platform == 'mac' || matrix.platform == 'win')
      with:
        name: desktop-launch-check-${{ matrix.platform }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/desktop-launch-check
        if-no-files-found: ignore
        retention-days: 7
    - uses: actions/upload-artifact@v7
      with:
        name: client-${{ matrix.platform }}-${{ matrix.arch }}
        path: 'release/*.dmg

          release/*.zip

          release/*.exe

          release/MACOS-TRUST-*.txt

          '
        if-no-files-found: error
        retention-days: 14
  mac-clean-install:
    name: Clean macOS ${{ matrix.arch }} ${{ matrix.format }} first start
    needs:
    - source
    - desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          arch: arm64
          format: dmg
        - runner: macos-15
          arch: arm64
          format: zip
    steps:
    - name: Checkout exact source without credentials
      shell: bash
      env:
        SOURCE_SHA: ${{ needs.source.outputs.sha }}
        GIT_TERMINAL_PROMPT: '0'
      run: 'set -euo pipefail

        git init .

        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

        git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

        git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

        git checkout --detach FETCH_HEAD

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        '
    - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      with:
        node-version-file: package.json
        run-install: false
    - uses: actions/download-artifact@v8
      with:
        name: client-mac-${{ matrix.arch }}
        path: candidate
    - name: Install pinned acceptance driver
      run: npm install --prefix "$RUNNER_TEMP/acceptance-tools" --no-save --ignore-scripts playwright-core@1.60.0
    - name: Copy candidate and verify complete bundle
      shell: bash
      env:
        ARCH: ${{ matrix.arch }}
        FORMAT: ${{ matrix.format }}
      run: "set -euo pipefail\ninstall_root=$(mktemp -d \"$RUNNER_TEMP/t3-clean-install.XXXXXX\")\nasset=\"\
        $GITHUB_WORKSPACE/candidate/T3-Code-$CLIENT_VERSION-$ARCH.$FORMAT\"\nmkdir -p \"$RUNNER_TEMP/acceptance-artifacts\"\
        \nshasum -a 256 \"$asset\" | tee \"$RUNNER_TEMP/acceptance-artifacts/asset-sha256.txt\"\nif [[\
        \ \"$FORMAT\" == dmg ]]; then\n  mount=\"$RUNNER_TEMP/t3-candidate-mount\"\n  hdiutil attach -nobrowse\
        \ -readonly -mountpoint \"$mount\" \"$asset\"\n  trap 'hdiutil detach \"$mount\" >/dev/null ||\
        \ true' EXIT\n  ditto \"$mount/T3 Code (Beta).app\" \"$install_root/T3 Code (Beta).app\"\nelse\n\
        \  ditto -x -k \"$asset\" \"$install_root\"\nfi\napp=\"$install_root/T3 Code (Beta).app\"\nbash\
        \ .github/scripts/verify-macos-distribution.sh \"$app\" --signature-only 2>&1 | tee \"$RUNNER_TEMP/acceptance-artifacts/signature.txt\"\
        \nexecutable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \"$app/Contents/Info.plist\"\
        )\necho \"T3_CANDIDATE_EXECUTABLE=$app/Contents/MacOS/$executable\" >> \"$GITHUB_ENV\"\n"
    - name: Add reviewed UI-language acceptance to validation driver only
      shell: bash
      run: 'node <<''NODE''

        const fs=require(''node:fs''),crypto=require(''node:crypto''),cp=require(''node:child_process'');

        const target=''.github/scripts/check-clean-desktop-first-start.mjs'';

        const original=cp.execFileSync(''git'',[''show'',''HEAD:''+target]);

        if(crypto.createHash(''sha256'').update(original).digest(''hex'')!==''6a8e96df7a6533355af7616345ba47a4ded70d9a957585bd03568395c1d61d3c'')throw
        new Error(''Original acceptance driver differs'');

        const extension=Buffer.from('''',''base64'');

        if(crypto.createHash(''sha256'').update(extension).digest(''hex'')!==''7668975d089fc334f012895a6e1836bda15de3b632ffbc45c02764e2a84f5cd4'')throw
        new Error(''Extended acceptance driver differs'');

        fs.writeFileSync(target,extension);

        console.log(''Validation harness only: actual UI locale/restart extension; original and extended
        SHA256'',''6a8e96df7a6533355af7616345ba47a4ded70d9a957585bd03568395c1d61d3c'',''7668975d089fc334f012895a6e1836bda15de3b632ffbc45c02764e2a84f5cd4'');

        NODE

        '
    - name: Launch with empty data and normal sandbox
      run: node .github/scripts/check-clean-desktop-first-start.mjs --executable "$T3_CANDIDATE_EXECUTABLE"
        --platform macOS --playwright-module "$RUNNER_TEMP/acceptance-tools/node_modules/playwright-core/index.mjs"
        --artifacts-dir "$RUNNER_TEMP/acceptance-artifacts"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: clean-install-mac-${{ matrix.arch }}-${{ matrix.format }}
        path: ${{ runner.temp }}/acceptance-artifacts
        if-no-files-found: warn
        retention-days: 14
