name: Office fetch isolation controlled diagnostic
permissions:
  contents: read
concurrency:
  group: office-fetch-ff58c179
  cancel-in-progress: false
jobs:
  shards:
    if: github.repository == 'ZhiweiXiao98/t3code' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      SOURCE_SHA: ff58c179c13482b537a6fa7bebc042aa17a26358
      GIT_TERMINAL_PROMPT: '0'
    steps:
    - name: Checkout exact diagnostic source without credentials
      shell: bash
      run: 'set -euo pipefail

        git init .

        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

        git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

        git sparse-checkout set --no-cone ''/*'' ''!/.repos/''

        git checkout --detach FETCH_HEAD

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        '
    - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      with:
        node-version-file: package.json
        cache: true
        run-install: false
    - run: vp install --frozen-lockfile
    - name: Install same browser and native prerequisites
      shell: bash
      run: 'set -euo pipefail

        python3 .github/scripts/ci-ubuntu-packages.py packages libsecret-1-dev pkg-config build-essential
        imagemagick

        python3 .github/scripts/ci-ubuntu-packages.py playwright apps/web/node_modules/playwright/cli.js

        node apps/web/node_modules/playwright/cli.js install --only-shell chromium

        '
    - name: Exercise four controls and five fixed-noise repetitions
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport os,pathlib,json,subprocess,hashlib,base64,re\n\
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'office-fetch-diagnostic';root.mkdir()\ntarget=pathlib.Path('apps/web/src/components/files/OfficeViewer.chapter.browser.test.tsx')\n\
        original=target.read_text()\nassert hashlib.sha256(target.read_bytes()).hexdigest()=='d772cbe7e35574c5805f8a0a2b47a3e13940ff3f3342e6dfc6ff16ddc54de9e3'\n\
        fixed=base64.b64decode('').decode()\n\
        assert hashlib.sha256(fixed.encode()).hexdigest()=='24c0aa8651a6c7feee5c2109014764acc50b86c3c8a785a7ee627b6a1bb8e34d'\n\
        observer=pathlib.Path('.github/scripts/observe-web-tests.py').read_text()\nanchor='COMMAND = [\"\
        vp\", \"run\", \"--filter\", \"@t3tools/web\", \"test\"]'\nassert observer.count(anchor)==1\n\
        injection='  expect(await (await fetch(\"data:text/plain,unrelated-request\")).text()).toBe(\"\
        unrelated-request\");'\nassert fixed.count(injection)==1\nsummary=[]\ncases=[('baseline-clean',original,False),('baseline-noise',original.replace('\
        \  expect(fetch).toHaveBeenCalledOnce();','  await globalThis.fetch(\"data:text/plain,unrelated-request\"\
        );\\n  console.info(\"FETCH_CALL_URLS\", fetch.mock.calls.map(call => String(call[0])));\\n  expect(fetch).toHaveBeenCalledOnce();'),True),('fixed-clean',fixed.replace(injection,''),False),('fixed-duplicate-file',fixed.replace('\
        \  expect(fileFetch).toHaveBeenCalledExactlyOnceWith(', '  await globalThis.fetch(source);\\n\
        \  expect(fileFetch).toHaveBeenCalledExactlyOnceWith('),'duplicate')]+[('fixed-noise-'+str(i),fixed,False)\
        \ for i in range(1,6)]\nfor label,content,negative in cases:\n target.write_text(content)\n d=root/label;d.mkdir();out=d/'web-browser-diagnostics';out.mkdir()\n\
        \ command=['vp','run','--filter','@t3tools/web','test','src/components/files/OfficeViewer.chapter.browser.test.tsx','--reporter=default','--reporter=json','--outputFile.json='+str(out/'results.json')]\n\
        \ monitor=d/'observer.py';monitor.write_text(observer.replace(anchor,'COMMAND = '+repr(command)))\n\
        \ status=subprocess.run(['python3',str(monitor)],env=dict(os.environ,RUNNER_TEMP=str(d))).returncode\n\
        \ result=json.loads((out/'results.json').read_text())\n tests=[a for f in result['testResults']\
        \ for a in f['assertionResults']]\n assert len(tests)==1 and len(result['testResults'])==1\n assert\
        \ result['testResults'][0]['name'].endswith('/src/components/files/OfficeViewer.chapter.browser.test.tsx')\n\
        \ assert tests[0]['fullName']=='relocalizes generated chapter navigation without reopening the\
        \ file or translating authored titles'\n assert result['numPendingTests']==0 and result.get('numTodoTests',0)==0\
        \ and result.get('numRuntimeErrorTestSuites',0)==0\n assert result.get('unhandledErrors',[])==[]\n\
        \ failure=re.sub(r'\\x1b\\[[0-9;]*m','',' '.join(tests[0].get('failureMessages',[])))\n expectedFailure=('to\
        \ be called once, but got 2 times' in failure) if negative is True else ('to be called once with\
        \ arguments' in failure and re.search(r'Number of calls:\\s*2',failure) is not None)\n valid=(status==1\
        \ and tests[0]['status']=='failed' and result['numFailedTests']==1 and expectedFailure) if negative\
        \ else (status==0 and tests[0]['status']=='passed' and result['numFailedTests']==0 and result['numPendingTests']==0)\n\
        \ summary.append({'case':label,'exit':status,'status':tests[0]['status'],'expectedNegative':negative,'valid':valid,'failure':failure})\n\
        target.write_text(original)\n(root/'summary.json').write_text(json.dumps({'source':os.environ['SOURCE_SHA'],'purpose':'controlled\
        \ test-isolation diagnostic, not full source gate','cases':summary},indent=2))\nassert all(x['valid']\
        \ for x in summary),summary\n\nPY\n"
    - name: Preserve each real result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: office-fetch-diagnostic-${{ github.run_id }}
        path: ${{ runner.temp }}/office-fetch-diagnostic/
        if-no-files-found: error
        retention-days: 14
'on':
  push:
    branches:
    - validation/v0.1.9-office-fetch-ff58c179
