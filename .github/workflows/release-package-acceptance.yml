name: Historical v0.1.5 package clean-install acceptance

# Historical published bytes and hashes only. Not a v0.1.8 candidate gate.
# New candidates use all seven same-run clean-install lanes in client-release.yml.
on:
  push:
    branches: [maintenance/v0.1.5-zh-cloud]
    paths:
      - .github/workflows/release-package-acceptance.yml
      - .github/scripts/check-clean-desktop-first-start.mjs
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact full workflow source SHA to inspect (no release publication)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-install:
    if: github.repository == 'ZhiweiXiao98/t3code' && github.ref == 'refs/heads/maintenance/v0.1.5-zh-cloud' && github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            kind: deb
            asset: T3-Code-0.1.5-zh.1-amd64.deb
            sha256: 8ab5558874272ccf9211dd8575e673142a99990ba760ad388f263eed7b715d6c
          - runner: ubuntu-24.04
            kind: appimage
            asset: T3-Code-0.1.5-zh.1-x86_64.AppImage
            sha256: 7bb1ad1da15e8c181ff4a50395a745b84dbce89ce343d9ef61bc3f77c35c1a1d
          - runner: windows-2022
            kind: nsis
            asset: T3-Code-0.1.5-zh.1-x64.exe
            sha256: b8394d5099bc030a0974e2984800abdf2fb77a05096056b4d5e85ab145e4a1df
          - runner: macos-26
            kind: dmg
            host_arch: arm64
            asset: T3-Code-0.1.5-zh.1-arm64.dmg
            sha256: 1278e28c4a3d54b4663daded56c5782f5ad052e44505c9bc3bf9c8a9e88f91f5
          - runner: macos-26
            kind: zip
            host_arch: arm64
            asset: T3-Code-0.1.5-zh.1-arm64.zip
            sha256: 331c23fe44e98e392e67e8cc9642bee04fc4064c24ac72477d54461ae7a855ad
          - runner: macos-15-intel
            kind: dmg
            host_arch: x86_64
            asset: T3-Code-0.1.5-zh.1-x64.dmg
            sha256: 9cf244b3c6a4a7e66a2166edd387036edfec2929de7ce830e3bd212cd2ae22a1
          - runner: macos-15-intel
            kind: zip
            host_arch: x86_64
            asset: T3-Code-0.1.5-zh.1-x64.zip
            sha256: c98ad60cf71b957646f38fc8bda0e1d48cb4f11ba7b5e961fdae76c767abd771
    steps:
      - name: Require exact reviewed source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Checkout exact source without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.expected_sha || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - name: Install only pinned acceptance driver
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/acceptance-tools" --no-save --ignore-scripts playwright-core@1.60.0
      - name: Download and verify Linux release asset
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acceptance-artifacts"
          curl --fail --location --proto '=https' --output "$RUNNER_TEMP/$ASSET" "https://github.com/ZhiweiXiao98/t3code/releases/download/v0.1.5-zh.1/$ASSET"
          printf '%s  %s\n' "$SHA256" "$RUNNER_TEMP/$ASSET" | sha256sum --check
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2t64
      - name: Install DEB through apt and launch installed entry
        if: matrix.kind == 'deb'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          package=$(dpkg-deb -f "$RUNNER_TEMP/$ASSET" Package)
          sudo apt-get install -y "$RUNNER_TEMP/$ASSET"
          dpkg-query -W "$package" | tee "$RUNNER_TEMP/acceptance-artifacts/installed-package.txt"
          executable=$(command -v t3code)
          xvfb-run -a node .github/scripts/check-clean-desktop-first-start.mjs --executable "$executable" --platform Linux --playwright-module "$RUNNER_TEMP/acceptance-tools/node_modules/playwright-core/index.mjs" --artifacts-dir "$RUNNER_TEMP/acceptance-artifacts"
      - name: Launch ordinary AppImage entry with FUSE
        if: matrix.kind == 'appimage'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          chmod u+x "$RUNNER_TEMP/$ASSET"
          test -c /dev/fuse
          xvfb-run -a node .github/scripts/check-clean-desktop-first-start.mjs --executable "$RUNNER_TEMP/$ASSET" --platform Linux --playwright-module "$RUNNER_TEMP/acceptance-tools/node_modules/playwright-core/index.mjs" --artifacts-dir "$RUNNER_TEMP/acceptance-artifacts"
      - name: Install NSIS and launch clean installed entry
        if: matrix.kind == 'nsis'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $env:RUNNER_TEMP $env:ASSET
          $artifacts = Join-Path $env:RUNNER_TEMP 'acceptance-artifacts'
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          Invoke-WebRequest -Uri "https://github.com/ZhiweiXiao98/t3code/releases/download/v0.1.5-zh.1/$env:ASSET" -OutFile $asset
          if ((Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant() -ne $env:SHA256) { throw 'Release hash mismatch' }
          $installDir = Join-Path $env:RUNNER_TEMP ('t3-clean-install-' + [guid]::NewGuid().ToString('N'))
          $installer = Start-Process -FilePath $asset -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS failed: $($installer.ExitCode)" }
          $executable = Join-Path $installDir 'T3 Code (Beta).exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'Installed executable missing' }
          node .github/scripts/check-clean-desktop-first-start.mjs --executable $executable --platform Windows --playwright-module "$env:RUNNER_TEMP/acceptance-tools/node_modules/playwright-core/index.mjs" --artifacts-dir $artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install macOS package and launch clean
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          SHA256: ${{ matrix.sha256 }}
          FORMAT: ${{ matrix.kind }}
          EXPECTED_ARCH: ${{ matrix.host_arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          mkdir -p "$RUNNER_TEMP/acceptance-artifacts"
          asset="$RUNNER_TEMP/$ASSET"
          curl --fail --location --proto '=https' --output "$asset" "https://github.com/ZhiweiXiao98/t3code/releases/download/v0.1.5-zh.1/$ASSET"
          printf '%s  %s\n' "$SHA256" "$asset" | shasum -a 256 --check
          install_root=$(mktemp -d "$RUNNER_TEMP/t3-existing-install.XXXXXX")
          if [[ "$FORMAT" == dmg ]]; then
            mount="$RUNNER_TEMP/t3-existing-mount"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$asset"
            trap 'hdiutil detach "$mount" >/dev/null || true' EXIT
            ditto "$mount/T3 Code (Beta).app" "$install_root/T3 Code (Beta).app"
          else
            ditto -x -k "$asset" "$install_root"
          fi
          app="$install_root/T3 Code (Beta).app"
          if codesign --verify --deep --strict --verbose=2 "$app" > "$RUNNER_TEMP/acceptance-artifacts/signature.txt" 2>&1; then
            echo 'Original bundle signature verified.'
          else
            cat "$RUNNER_TEMP/acceptance-artifacts/signature.txt"
            test "$EXPECTED_ARCH" = x86_64
            grep -F 'code object is not signed at all' "$RUNNER_TEMP/acceptance-artifacts/signature.txt"
          fi
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          node .github/scripts/check-clean-desktop-first-start.mjs --executable "$app/Contents/MacOS/$executable" --platform macOS --playwright-module "$RUNNER_TEMP/acceptance-tools/node_modules/playwright-core/index.mjs" --artifacts-dir "$RUNNER_TEMP/acceptance-artifacts"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clean-install-${{ matrix.kind }}-${{ runner.os }}-${{ matrix.host_arch || runner.arch }}
          path: ${{ runner.temp }}/acceptance-artifacts
          if-no-files-found: warn
          retention-days: 7
