        \  C.need(entry['name'] in producer['installers'],'installer not owned by claimed producer')\n  C.need(entry['sha256']==producer['installers'][entry['name']],'installer\
        \ producer acceptance mismatch')\n else:C.need(entry['name']=={'client-mac-arm64':'MACOS-TRUST-arm64.txt','client-mac-x64':'MACOS-TRUST-x64.txt'}.get(producer['artifact']['name']),'trust\
        \ report producer mismatch')\ndef main():\n pins=json.loads(Path('roundtrip-pins.json').read_text());C.need(pins['enabled']\
        \ is True,'BLOCKED: reviewed artifact pins required')\n C.need(pins['collector_operation']==COLLECTOR_OP\
