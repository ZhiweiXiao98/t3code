        \ C.need(api.json('/git/ref/heads/maintenance/v0.1.9-zh-cloud')['object']['sha']==C.SOURCE,'source moved')\n\
        \ C.need(api.json('/git/commits/'+C.SOURCE)['tree']['sha']==C.TREE,'source tree mismatch')\n for op,path\
        \ in [(os.environ['GITHUB_SHA'],WORKFLOW),(COLLECTOR_OP,P.WORKFLOW)]:\n  commit=api.json('/git/commits/'+op);C.need([v['sha']\
        \ for v in commit['parents']]==[C.SOURCE],'not exact source child')\n  d=api.json('/compare/'+C.SOURCE+'...'+op);C.need(d['ahead_by']==1\
        \ and d['behind_by']==0 and [(f['filename'],f['status']) for f in d['files']]==[(path,'added')],'operation\
        \ changed source')\ndef check_release(api,old):\n C.need(P.release_view(api.json('/releases/442744057'),old)==old,'release\
        \ changed')\ndef check_entry_producer(entry,producer):\n C.need(entry['producer_run']==producer['run']['id']\
