        \ for role,r in records.items():\n  C.need(r['artifact']['name']==role_names[role]+'-'+str(COLLECTOR_RUN)+'-1','artifact\
        \ role mismatch')\n  C.need(r['run']['id']==pins['collector_run'] and r['run']['head_sha']==COLLECTOR_OP\
