name: Desktop same-release replacement verified bytes
'on':
  push:
    branches:
    - validation/v0.1.9-desktop-replacement-74039745
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-release-442744057
  cancel-in-progress: false
jobs:
  replace:
    if: github.repository == 'ZhiweiXiao98/t3code' && github.event.repository.private == false
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Verify exact bytes and perform fixed release replacement
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        APPROVED_DESKTOP_REPLACEMENT: '442744057'
        EXPECTED_PAYLOAD_SHA256: 327e70f0a3f5d3c0162aa4fa20ad79ad3d979d612161e8aa2e59d7ae3857dd40
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/replacement-tools\" \"$RUNNER_TEMP/replacement-journal\"\n\
        cd \"$RUNNER_TEMP/replacement-tools\"\ncat > collect_verified.py <<'REVIEWED_EOF'\n\"\"\"Read-only local\
        \ collection core. No GitHub mutation or signing capability.\nPinned specification must be independently\
        \ reviewed; passing this module alone is\nNOT source/CI/acceptance verification and never enables publication.\n\
        \"\"\"\nimport hashlib,json,pathlib,re,shutil,stat,tempfile,zipfile\nSOURCE='74039745b1b44834c30dd9cb275f1c224072dd96'\n\
        TREE='2849e01639a6ec5242b4041b65762ef78ac08a51'\nINSTALLERS={f'T3-Code-0.1.9-zh.1-{x}' for x in ('amd64.deb','x64.exe','arm64.dmg','arm64.zip','x64.dmg','x64.zip')}\n\
        ALLOWED=INSTALLERS|{'MACOS-TRUST-arm64.txt','MACOS-TRUST-x64.txt'}\nMAX=2*1024**3\nclass Invalid(ValueError):pass\n\
        def need(b,msg):\n if not b:raise Invalid(msg)\ndef digest(p):\n with pathlib.Path(p).open('rb') as f:return\
        \ hashlib.file_digest(f,'sha256').hexdigest()\ndef check_file(p,size,sha):\n p=pathlib.Path(p);need(p.is_file()\
        \ and not p.is_symlink(),'not regular file')\n need(type(size) is int and 0<size<=MAX,'invalid size')\n\
        \ need(re.fullmatch('[0-9a-f]{64}',sha) is not None,'invalid hash')\n need(p.stat().st_size==size,'size\
        \ mismatch');need(digest(p)==sha,'hash mismatch')\ndef verify_spec(spec):\n need(spec['enabled'] is False,'collector\
        \ must remain disabled for publication')\n need(spec['source_sha']==SOURCE and spec['source_tree']==TREE,'wrong\
        \ source')\n need(spec['release_id']==442744057 and spec['tag']=='v0.1.9-zh.1','wrong destination')\n need(set(spec['assets'])==ALLOWED,'incomplete/extra\
        \ desktop set')\n for n,a in spec['assets'].items():\n  need(type(a['artifact_id']) is int and a['artifact_id']>0,'invalid\
        \ artifact')\n  need(type(a['size']) is int and 0<a['size']<=MAX,'invalid size')\n  need(re.fullmatch('[0-9a-f]{64}',a['sha256'])\
        \ is not None,'invalid hash')\ndef extract_archive(archive,pin,expected,out):\n \"\"\"Exact ZIP bytes plus\
        \ exact member bytes, no untrusted extract().\"\"\"\n check_file(archive,pin['size'],pin['sha256'])\n need(set(expected)<=ALLOWED\
        \ and expected,'invalid members')\n out=pathlib.Path(out);need(not out.exists(),'output already exists')\n\
        \ out.parent.mkdir(parents=True,exist_ok=True)\n with tempfile.TemporaryDirectory(dir=out.parent,prefix='.collect-')\
        \ as td:\n  tmp=pathlib.Path(td)\n  with zipfile.ZipFile(archive) as z:\n   entries=z.infolist();names=[e.filename\
        \ for e in entries]\n   need(len(names)==len(set(names)) and set(names)==set(expected),'ZIP members differ')\n\
        \   need(sum(e.file_size for e in entries)<=MAX,'oversized expansion')\n   for e in entries:\n    need(not\
        \ e.is_dir() and stat.S_IFMT(e.external_attr>>16) in (0,stat.S_IFREG) and not e.flag_bits&1,'unsafe ZIP\
        \ entry')\n    a=expected[e.filename];need(e.file_size==a['size'],'member size mismatch')\n    with z.open(e)\
        \ as src,(tmp/e.filename).open('xb') as dst:shutil.copyfileobj(src,dst,1024*1024)\n    check_file(tmp/e.filename,a['size'],a['sha256'])\n\
        \  # Move only a completely verified directory, never a partial output.\n  tmp.rename(out)\n return {n:{'size':a['size'],'sha256':a['sha256']}\
        \ for n,a in expected.items()}\ndef backup_existing(snapshot,files,out):\n \"\"\"Create verified equivalent\
        \ copy of exact existing release assets.\n Caller must subsequently persist and roundtrip this directory\
        \ before mutation.\n \"\"\"\n need(snapshot['id']==442744057 and snapshot['tag_name']=='v0.1.9-zh.1','wrong\
        \ old release')\n need(snapshot['draft'] is False and snapshot['prerelease'] is False,'unexpected state')\n\
        \ assets=snapshot['assets'];names=[a['name'] for a in assets];ids=[a['id'] for a in assets]\n need(len(names)==len(set(names))\
        \ and len(ids)==len(set(ids)),'duplicate snapshot')\n need(set(names)==ALLOWED|{'BUILD-PROVENANCE.json','SHA256SUMS.txt'},'unexpected\
        \ old inventory')\n need(set(files)==set(names),'missing backup input')\n out=pathlib.Path(out);need(not\
        \ out.exists(),'backup already exists');out.parent.mkdir(parents=True,exist_ok=True)\n with tempfile.TemporaryDirectory(dir=out.parent,prefix='.backup-')\
        \ as td:\n  tmp=pathlib.Path(td)\n  for a in assets:\n   need(type(a['id']) is int and a['id']>0,'invalid\
        \ old id')\n   need(a['state']=='uploaded' and re.fullmatch('sha256:[0-9a-f]{64}',a['digest']) is not None,'bad\
        \ old metadata')\n   sha=a['digest'][7:];check_file(files[a['name']],a['size'],sha)\n   shutil.copyfile(files[a['name']],tmp/a['name']);check_file(tmp/a['name'],a['size'],sha)\n\
        \  (tmp/'release-snapshot.json').write_text(json.dumps(snapshot,sort_keys=True,indent=2)+'\\n')\n  tmp.rename(out)\n\
        \ return {'snapshot_sha256':digest(out/'release-snapshot.json'),'assets':len(assets),'durable_roundtrip_verified':False,'publication_enabled':False}\n\
        REVIEWED_EOF\ncat > collect_public.py <<'REVIEWED_EOF'\n\"\"\"Exact desktop byte collection only. No GitHub\
        \ write API; no source execution.\"\"\"\nimport json,os,re,urllib.request,urllib.error,urllib.parse,zipfile,hashlib\n\
        from datetime import datetime,timezone\nfrom pathlib import Path\nimport collect_verified as C\nREPO='ZhiweiXiao98/t3code';BRANCH='validation/v0.1.9-desktop-byte-collection-74039745-accept-fix';WORKFLOW='.github/workflows/desktop-byte-collection.yml'\n\
        class NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,*a,**kw):return None\n\
        class Api:\n def request(self,path,accept='application/vnd.github+json'):\n  C.need(path.startswith('/')\
        \ or path=='','bad API suffix')\n  return urllib.request.Request('https://api.github.com/repos/'+REPO+path,headers={'Authorization':'Bearer\
        \ '+os.environ['GITHUB_TOKEN'],'Accept':accept})\n def json(self,path):\n  with urllib.request.build_opener(NoRedirect()).open(self.request(path),timeout=60)\
        \ as r:return json.load(r)\n def download(self,path,dest,size):\n  C.need(type(size)is int and 0<size<=C.MAX,'download\
        \ bound invalid')\n  if re.fullmatch(r'/actions/artifacts/[1-9][0-9]*/zip',path):accept='application/vnd.github+json'\n\
        \  elif re.fullmatch(r'/releases/assets/[1-9][0-9]*',path):accept='application/octet-stream'\n  else:raise\
        \ C.Invalid('unsupported download endpoint')\n  try: urllib.request.build_opener(NoRedirect()).open(self.request(path,accept),timeout=60)\n\
        \  except urllib.error.HTTPError as e:\n   C.need(e.code==302,'download must redirect');url=e.headers.get('Location','')\n\
        \  else: raise C.Invalid('unexpected download response')\n  u=urllib.parse.urlparse(url);C.need(u.scheme=='https'\
        \ and u.hostname and not u.username and not u.password and (u.hostname.endswith('.blob.core.windows.net')\
        \ or u.hostname.endswith('.githubusercontent.com') or u.hostname.endswith('.actions.githubusercontent.com')),'unapproved\
        \ storage origin')\n  # No Authorization header reaches object storage; redirects from storage fail closed.\n\
        \  with urllib.request.build_opener(NoRedirect()).open(url,timeout=180) as src,Path(dest).open('xb') as\
        \ dst:\n   total=0\n   while True:\n    b=src.read(min(1024*1024,size-total+1))\n    if not b:break\n  \
        \  total+=len(b);C.need(total<=size,'download too large');dst.write(b)\n   C.need(total==size,'short download')\n\
        def t(s):return datetime.fromisoformat(s.replace('Z','+00:00'))\ndef release_view(r,expected):\n return\
        \ {k:([{key:a[key] for key in expected['assets'][0]} for a in r['assets']] if k=='assets' else r[k]) for\
        \ k in expected}\ndef check_record(api,p):\n r=api.json('/actions/runs/'+str(p['run']['id']));C.need({k:r[k]\
        \ for k in p['run']}==p['run'],'run changed');C.need(r['repository']['full_name']==r['head_repository']['full_name']==REPO,'wrong\
        \ repository')\n js=api.json('/actions/runs/'+str(r['id'])+'/attempts/1/jobs?per_page=100');C.need(js['total_count']==len(js['jobs'])<=100,'incomplete\
        \ jobs')\n matches=[j for j in js['jobs'] if j['id']==p['job']['id']];C.need(matches==[p['job']],'original\
        \ producer changed');j=matches[0]\n C.need(j['run_id']==r['id'] and j['run_attempt']==1 and j['head_sha']==r['head_sha']\
        \ and j['head_branch']==r['head_branch'] and j['status']=='completed' and j['conclusion']=='success','producer\
        \ invalid')\n a=api.json('/actions/artifacts/'+str(p['artifact']['id']));C.need(a==p['artifact'],'artifact\
        \ changed');C.need(not a['expired'] and t(a['expires_at'])>datetime.now(timezone.utc),'expired')\n C.need(a['workflow_run']['id']==r['id']\
        \ and a['workflow_run']['head_sha']==r['head_sha'] and a['workflow_run']['head_branch']==r['head_branch'],'artifact\
        \ source invalid')\n C.need(t(j['started_at'])<=t(a['created_at'])<=t(a['updated_at'])<=t(j['completed_at']),'outside\
        \ producer interval')\n upload=[s for s in j['steps'] if s['number']==p['upload_step'] and 'upload' in s['name'].lower()\
        \ and s['conclusion']=='success' and s['status']=='completed' and t(s['started_at'])<=t(a['created_at'])<=t(a['updated_at'])<=t(s['completed_at'])]\n\
        \ C.need(len(upload)==1,'not uniquely within upload interval')\ndef snapshot(api,pins):\n C.need(pins['enabled']\
        \ is False and pins['source']==C.SOURCE and pins['tree']==C.TREE,'publication/source guard')\n C.need(os.environ['GITHUB_REPOSITORY']==REPO\
        \ and os.environ['GITHUB_REF']=='refs/heads/'+BRANCH and os.environ['GITHUB_EVENT_NAME']=='push','wrong\
        \ operation')\n C.need(api.json('')['private'] is False,'standard public repository required')\n C.need(api.json('/git/ref/heads/maintenance/v0.1.9-zh-cloud')['object']['sha']==C.SOURCE,'source\
        \ moved')\n C.need(api.json('/git/commits/'+C.SOURCE)['tree']['sha']==C.TREE,'source tree mismatch')\n op=os.environ['GITHUB_SHA'];commit=api.json('/git/commits/'+op);C.need([v['sha']\
        \ for v in commit['parents']]==[C.SOURCE],'operation not exact source child')\n diff=api.json('/compare/'+C.SOURCE+'...'+op);C.need(diff['ahead_by']==1\
        \ and diff['behind_by']==0 and [(f['filename'],f['status']) for f in diff['files']]==[(WORKFLOW,'added')],'operation\
        \ altered source')\n arm=pins['records'][3]['run']['head_sha'];a=api.json('/git/commits/'+arm);C.need([v['sha']\
        \ for v in a['parents']]==[C.SOURCE],'ARM operation not source child')\n d=api.json('/compare/'+C.SOURCE+'...'+arm);C.need(d['ahead_by']==1\
        \ and d['behind_by']==0 and [(f['filename'],f['status']) for f in d['files']]==[(pins['arm_workflow_path'],'added')],'ARM\
        \ operation changed source')\n for record in pins['records']:check_record(api,record)\n r=api.json('/releases/442744057');C.need(release_view(r,pins['old_release'])==pins['old_release'],'release\
        \ inventory/body changed');C.need(r.get('immutable',False) is False,'release immutable')\n return pins['old_release']\n\
        def collect(api,pins,root):\n snapshot(api,pins);root=Path(root);root.mkdir(exist_ok=False);raw=root/'raw';raw.mkdir();new=root/'new';new.mkdir();records=[]\n\
        \ for p in pins['records']:\n  a=p['artifact'];zpath=raw/(str(a['id'])+'.zip');api.download('/actions/artifacts/'+str(a['id'])+'/zip',zpath,a['size_in_bytes']);C.check_file(zpath,a['size_in_bytes'],a['digest'][7:])\n\
        \  names=set(p['installers']);trust={'client-mac-arm64':'MACOS-TRUST-arm64.txt','client-mac-x64':'MACOS-TRUST-x64.txt'}.get(a['name']);names\
        \ |= {trust} if trust else set()\n  with zipfile.ZipFile(zpath) as z:\n   C.need(set(z.namelist())==names\
        \ and len(z.namelist())==len(names),'unexpected archive files')\n   expected={i.filename:{'size':i.file_size,'sha256':p['installers'].get(i.filename)}\
        \ for i in z.infolist()}\n   if trust:\n    C.need(expected[trust]['size']<=1024*1024,'trust report oversized');expected[trust]['sha256']=hashlib.sha256(z.read(trust)).hexdigest()\n\
        \  extracted=raw/(str(a['id'])+'-extracted');C.extract_archive(zpath,{'size':a['size_in_bytes'],'sha256':a['digest'][7:]},expected,extracted)\n\
        \  for n,e in expected.items():\n   C.need(not (new/n).exists(),'duplicate output');(extracted/n).rename(new/n);records.append({'name':n,**e,'artifact_id':a['id'],'producer_run':p['run']['id'],'producer_job':p['job']['id']})\n\
        \ oldraw=raw/'old';oldraw.mkdir();files={}\n for a in pins['old_release']['assets']:\n  path=oldraw/a['name'];api.download('/releases/assets/'+str(a['id']),path,a['size']);C.check_file(path,a['size'],a['digest'][7:]);files[a['name']]=str(path)\n\
        \ backup=C.backup_existing(pins['old_release'],files,root/'old-backup')\n snapshot(api,pins)\n receipt={'schema':1,'source':C.SOURCE,'tree':C.TREE,'publication_enabled':False,'publication_status':pins['publication'],'scope':'byte\
        \ collection and backup only; NOT full acceptance/publication','operation_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'new_assets':records,'backup':backup,'backup_retention_days':14,'backup_restore_status':'NOT_VERIFIED\
        \ until uploaded artifact is downloaded and rehashed; no deletion allowed','pins_sha256':C.digest(Path(__file__).with_name('collection-pins.json'))}\n\
        \ receipts=root/'receipts';receipts.mkdir();(receipts/'collection-receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\\\
        n');(receipts/'pins.json').write_text(json.dumps(pins,ensure_ascii=False,indent=2)+'\\n')\n return receipt\n\
        if __name__=='__main__':collect(Api(),json.loads(Path(__file__).with_name('collection-pins.json').read_text()),Path(os.environ['RUNNER_TEMP'])/'desktop-collection')\n\
        REVIEWED_EOF\ncat > verify_roundtrip.py <<'REVIEWED_EOF'\n\"\"\"Read-only artifact roundtrip. Blocked until\
        \ exact successful collection pins reviewed.\"\"\"\nimport hashlib,json,os,stat,zipfile\nfrom pathlib import\
        \ Path\nimport collect_verified as C\nimport collect_public as P\nCOLLECTOR_OP='75bae1f4c7ceace61211be7d9d5e203014abf474'\n\
        COLLECTOR_RUN=43995592784\nBRANCH='validation/v0.1.9-desktop-roundtrip-74039745-metadata-fix'\nWORKFLOW='.github/workflows/desktop-roundtrip.yml'\n\
        def checked_members(path,expected):\n \"\"\"Rehash every entry without extracting executable bytes.\"\"\"\
        \n with zipfile.ZipFile(path) as z:\n  entries=z.infolist();names=[e.filename for e in entries]\n  C.need(len(names)==len(set(names))\
        \ and set(names)==set(expected),'ZIP exact inventory mismatch')\n  C.need(sum(e.file_size for e in entries)<=C.MAX,'expansion\
        \ too large')\n  result={}\n  for e in entries:\n   C.need(not e.is_dir() and stat.S_IFMT(e.external_attr>>16)\
        \ in (0,stat.S_IFREG) and not e.flag_bits&1,'unsafe entry')\n   pin=expected[e.filename];C.need(e.file_size==pin['size'],'entry\
        \ size mismatch')\n   h=hashlib.sha256()\n   with z.open(e) as f:\n    for block in iter(lambda:f.read(1024*1024),b''):h.update(block)\n\
        \   C.need(h.hexdigest()==pin['sha256'],'entry digest mismatch');result[e.filename]=pin\n  return result\n\
        def read_json(path,name):\n with zipfile.ZipFile(path) as z:\n  e=z.getinfo(name);C.need(e.file_size<=2*1024*1024,'JSON\
