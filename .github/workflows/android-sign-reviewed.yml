name: Sign reviewed Android candidate only
on:
  push:
    branches: [signing/android-bootstrap]
    paths:
      - .github/workflows/android-sign-reviewed.yml
      - docs/tools/android-cloud-signing/reviewed-signing-input.json
permissions:
  contents: read
  actions: read
concurrency:
  group: fixed-android-reviewed-signing
  cancel-in-progress: false
jobs:
  sign:
    if: github.repository == 'ZhiweiXiao98/t3code' && github.ref == 'refs/heads/signing/android-bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: android-signing
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Fetch only reviewed signing tools from exact workflow commit
        env:
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          umask 077
          git init .
          git remote add origin https://github.com/ZhiweiXiao98/t3code.git
          git sparse-checkout init --cone
          git sparse-checkout set docs/tools/android-cloud-signing
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/signing/android-bootstrap | cut -f1)" = "$SOURCE_SHA"
          # No candidate repository source is checked out or executed.
          test -x "$JAVA_HOME_21_X64/bin/java"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Run reviewed non-secret signing and publisher safety tests
        run: |
          set -euo pipefail
          python -m unittest discover -s docs/tools/android-cloud-signing -p "test_*.py" -v
          git show HEAD:.github/workflows/android-sign-reviewed.yml > "$RUNNER_TEMP/sign-workflow.yml"
          python - <<'PYCODE'
          import os, textwrap
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          script = textwrap.dedent((root / 'sign-workflow.yml').read_text().split('          script: |\n', 1)[1])
          (root / 'publisher-check.js').write_text('(async()=>{\n' + script + '\n})();\n')
          PYCODE
          node --check "$RUNNER_TEMP/publisher-check.js"
          node docs/tools/android-cloud-signing/test-publisher.cjs "$RUNNER_TEMP/publisher-check.js"
      - name: Verify candidate CI, ZIP and APK without signing Secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python docs/tools/android-cloud-signing/sign_reviewed.py prepare \
            --input docs/tools/android-cloud-signing/reviewed-signing-input.json \
            --workspace "$RUNNER_TEMP/reviewed-android"
      - name: Sign only reviewed APK with fixed recovered identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python docs/tools/android-cloud-signing/sign_reviewed.py sign \
            --input docs/tools/android-cloud-signing/reviewed-signing-input.json \
            --workspace "$RUNNER_TEMP/reviewed-android" --output "$RUNNER_TEMP/signed-android"
      - name: Upload only signed APK and public provenance
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-signed-reviewed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/signed-android/T3-Code-zh-CN-Android-0.1.8-zh.1-arm64-v8a.apk
            ${{ runner.temp }}/signed-android/BUILD-PROVENANCE.json
            ${{ runner.temp }}/signed-android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish verified Android APK without changing desktop release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Fetch exact reviewed public coverage verifier
        env:
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/ZhiweiXiao98/t3code.git
          git sparse-checkout init --cone
          git sparse-checkout set docs/tools/android-cloud-signing
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Download this run's exact signed handoff
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true
      - name: Verify signed handoff and publish a new non-Latest Android release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: 3270444c64826f67c953c2816dd1fd8f10d87953
          EXPECTED_CANDIDATE_RUN: '42994944772'
          SIGNED_ARTIFACT_ID: ${{ needs.sign.outputs.artifact_id }}
          SIGNED_ARTIFACT_DIGEST: ${{ needs.sign.outputs.artifact_digest }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const assert = require('node:assert/strict');
            const repo = {owner:'ZhiweiXiao98', repo:'t3code'};
            const tag = 'android-v0.1.8-zh.1';
            const apkName = 'T3-Code-zh-CN-Android-0.1.8-zh.1-arm64-v8a.apk';
            const hash = b => crypto.createHash('sha256').update(b).digest('hex');
            const names = [apkName, 'BUILD-PROVENANCE.json', 'SHA256SUMS.txt'].sort();
            assert.deepEqual(fs.readdirSync('release-assets').sort(), names);
            const manifestBytes = fs.readFileSync('release-assets/BUILD-PROVENANCE.json');
            const m = JSON.parse(manifestBytes);
            assert.equal(m.apk_signature_verified, true);
            assert.equal(m.enabled, true);
            assert.equal(m.candidate_attempt, 1);
            assert.equal(m.candidate_source_tree_sha, '4eb59e49773d95fc7be03f51f6a3493f343864f6');
            assert(Number.isSafeInteger(m.candidate_artifact_id) && m.candidate_artifact_id > 0);
            assert.equal(m.candidate_artifact_id, 13845727133);
            assert.equal(m.candidate_artifact_zip_size, 46410853);
            assert.equal(m.candidate_artifact_sha256, "c4b31a36f758d213f22a84c43cad224eeeb18433e19ac5ee4b7ae409f79f3b2c");
            assert.equal(m.unsigned_apk_sha256, "fdfb859607493e5062d30068807c0fdc2e7fa1c3c7fafd23ebc63d4df6fa0105");
            assert.equal(m.candidate_unsigned_apk_sha256, m.unsigned_apk_sha256);
            assert.equal(m.candidate_unsigned_apk_size, 99653116);
            assert.equal(m.candidate_producer_job_id, 130437616876);
            assert.equal(m.candidate_producer_attempt, 1);
            assert.equal(m.encrypted_container_sha256, '7e4922f7de02c1c739e627eb3ef87fa1fb639329ed27613dff8b4f0fdad2d397');
            assert.equal(m.source_sha, process.env.EXPECTED_SOURCE_SHA);
            assert.equal(String(m.candidate_run_id), process.env.EXPECTED_CANDIDATE_RUN);
            assert.equal(m.certificate_sha256, '82f2437cbceb94fe6fe4a60a1c0de99f643124c64a648a27de9ce92bd39ecd88');
            assert.equal(m.package_name, 'com.zhiweixiao.t3code.zhcn');
            assert.equal(m.version_name, '0.1.8-zh.1');
            assert.equal(m.version_code, 1000415);
            assert.equal(String(m.recovery_run_id), '40649758501');
            const apk = fs.readFileSync(`release-assets/${apkName}`);
            assert.equal(hash(apk), m.signed_apk_sha256);
            const sums = fs.readFileSync('release-assets/SHA256SUMS.txt','utf8').trim().split('\n').sort();
            assert.deepEqual(sums, [`${hash(apk)}  ${apkName}`,`${hash(manifestBytes)}  BUILD-PROVENANCE.json`].sort());
            async function publicAPI(path) {
              // Keep the same anonymous public read. Never retry an ambiguous access denial.
              const url = `https://api.github.com/repos/ZhiweiXiao98/t3code${path}`;
              for (let attempt = 0; attempt < 2; attempt++) {
                const r = await fetch(url, {headers:{Accept:'application/vnd.github+json'},redirect:'error'});
                if (r.ok) return r.json();
                const header = name => r.headers.get(name) || '';
                const remaining = header('x-ratelimit-remaining');
                const reset = header('x-ratelimit-reset');
                const retryAfter = header('retry-after');
                // Only expose bounded public response metadata, never response bodies or credentials.
                const detail = JSON.stringify({path,status:r.status,remaining:remaining.slice(0,32),reset:reset.slice(0,32),retryAfter:retryAfter.slice(0,32),requestId:header('x-github-request-id').slice(0,128)});
                const quota = (r.status === 403 || r.status === 429) && (remaining === '0' || /^\d+$/.test(retryAfter));
                const delay = /^\d+$/.test(retryAfter) ? Number(retryAfter) * 1000 :
                  remaining === '0' && /^\d+$/.test(reset) ? Math.max(1000, Number(reset) * 1000 - Date.now() + 1000) : NaN;
                if (quota && attempt === 0 && Number.isFinite(delay) && delay >= 0 && delay <= 60000) {
                  await new Promise(resolve => setTimeout(resolve, delay));
                  continue;
                }
                throw new Error(`Public API check failed: ${detail}; no access-denial fallback`);
              }
            }
            async function recheck() {
              const coverage = JSON.parse(require('node:child_process').execFileSync('python', ['docs/tools/android-cloud-signing/verify_supplemental.py', '--pins', 'docs/tools/android-cloud-signing/supplemental-pin.json', '--json'], {encoding:'utf8', stdio:'pipe', timeout:240000}));
              assert.deepEqual(coverage, m.supplemental_coverage);
              assert.equal((await publicAPI('')).private, false);
              const signed = await publicAPI(`/actions/artifacts/${process.env.SIGNED_ARTIFACT_ID}`);
              assert.equal(signed.workflow_run.id, context.runId); assert.equal(signed.workflow_run.head_sha, context.sha);
              assert.equal(signed.expired,false); assert(Date.parse(signed.expires_at)>Date.now()); assert.equal(signed.digest, `sha256:${process.env.SIGNED_ARTIFACT_DIGEST}`);
              const r = await publicAPI(`/actions/runs/${m.candidate_run_id}`);
              assert.equal(r.status,'completed'); assert.equal(r.conclusion,'success'); assert.equal(r.run_attempt,m.candidate_attempt);
              assert.equal(r.head_sha,m.source_sha); assert.equal(r.head_branch,'maintenance/v0.1.8-zh-cloud');
              assert.equal(r.path,'.github/workflows/client-release.yml');
              assert(['push','workflow_dispatch'].includes(r.event));
              assert.equal(r.head_commit.tree_id,m.candidate_source_tree_sha);
              assert.equal(r.repository.full_name,'ZhiweiXiao98/t3code');
              assert.equal(r.head_repository.full_name,'ZhiweiXiao98/t3code');
              const j = await publicAPI(`/actions/runs/${m.candidate_run_id}/attempts/${m.candidate_attempt}/jobs?per_page=100`);
              const expectedJobs=["Android arm64 unsigned candidate (NOT installable)", "Build validated desktop bundle", "Clean desktop appimage Debian 13 guest (Ubuntu 24.04 host) first start", "Clean desktop deb first start", "Clean desktop nsis first start", "Clean macOS arm64 dmg first start", "Clean macOS arm64 zip first start", "Clean macOS x64 dmg first start", "Clean macOS x64 zip first start", "Desktop mac arm64 (integrity checked)", "Desktop mac x64 (integrity checked)", "Desktop win x64 (integrity checked)", "Lint and typecheck", "Linux x64 and embedded Windows WSL runtime", "Mobile native static analysis", "Rust native formatting and tests", "Tests (clients)", "Tests (server-1)", "Tests (server-2)", "Tests (server-3)", "Tests (web)", "Validate exact source"];
              assert.deepEqual(j.jobs.map(x=>x.name).sort(),expectedJobs.sort());
              assert.equal(j.total_count,22); assert(j.jobs.every(x=>x.status==='completed'&&x.conclusion==='success'&&x.run_id===m.candidate_run_id&&x.run_attempt===m.candidate_attempt&&x.head_sha===m.source_sha));
              assert.deepEqual(m.validated_release_jobs.map(x=>[x.id,x.name,x.run_attempt,x.started_at,x.completed_at]).sort(),j.jobs.map(x=>[x.id,x.name,x.run_attempt,x.started_at,x.completed_at]).sort());
              assert.equal((await publicAPI('/git/ref/heads/maintenance/v0.1.8-zh-cloud')).object.sha,m.source_sha);
              const a = await publicAPI(`/actions/artifacts/${m.candidate_artifact_id}`);
              assert.equal(a.id,m.candidate_artifact_id);
              assert.equal(a.name,'android-UNSIGNED-NOT-INSTALLABLE');
              assert.equal(a.workflow_run.head_branch,'maintenance/v0.1.8-zh-cloud');
              const latest = j.jobs.filter(x=>x.name==='Android arm64 unsigned candidate (NOT installable)');
              assert.equal(latest.length,1);
              const originalJobs=await publicAPI(`/actions/runs/${m.candidate_run_id}/attempts/${m.candidate_producer_attempt}/jobs?per_page=100`);
              assert.equal(originalJobs.total_count,originalJobs.jobs.length); assert(originalJobs.total_count<100);
              const originals=originalJobs.jobs.filter(x=>x.id===m.candidate_producer_job_id); assert.equal(originals.length,1);
              const original=originals[0];
              assert.equal(original.run_id,m.candidate_run_id); assert.equal(original.run_attempt,m.candidate_producer_attempt);
              assert.equal(original.head_sha,m.source_sha); assert.equal(original.head_branch,'maintenance/v0.1.8-zh-cloud');
              assert.equal(original.name,latest[0].name); assert.equal(original.status,'completed'); assert.equal(original.conclusion,'success');
              for(const k of ['started_at','completed_at']) { assert.equal(original[k],latest[0][k]); assert.equal(original[k],m[`candidate_producer_${k}`]); }
              assert.deepEqual(original.steps,latest[0].steps);
              const time=x=>{assert.match(x,/Z$/);const t=Date.parse(x);assert(Number.isFinite(t));return t;};
              const created=time(a.created_at),updated=time(a.updated_at);
              assert(time(original.started_at)<=created&&created<=updated&&updated<=time(original.completed_at));
              const upload=original.steps.filter(x=>x.name==='Run actions/upload-artifact@v7');assert.equal(upload.length,1);
              assert.equal(upload[0].status,'completed');assert.equal(upload[0].conclusion,'success');
              assert(time(upload[0].started_at)<=created&&updated<=time(upload[0].completed_at));
              assert.equal(a.size_in_bytes,m.candidate_artifact_zip_size); assert.equal(a.expired,false); assert(Date.parse(a.expires_at)>Date.now()); assert.equal(a.digest,`sha256:${m.candidate_artifact_sha256}`);
              assert.equal(a.workflow_run.id,Number(m.candidate_run_id)); assert.equal(a.workflow_run.head_sha,m.source_sha);
              const recovery = await publicAPI('/actions/runs/40649758501');
              assert.equal(recovery.status,'completed'); assert.equal(recovery.conclusion,'success'); assert.equal(recovery.head_sha,'8fc8b21abd2380926242fc49e7f488cb4b3aa0b8');
            }
            await recheck();
            async function absent(request) {
              try { await request(); } catch(e) { if(e.status===404)return; throw e; }
              throw new Error('Existing tag/release; refusing replacement');
            }
            await absent(()=>github.rest.git.getRef({...repo,ref:`tags/${tag}`}));
            await absent(()=>github.rest.repos.getReleaseByTag({...repo,tag}));
            const releases=await github.paginate(github.rest.repos.listReleases,{...repo,per_page:100});
            assert(!releases.some(r=>r.tag_name===tag),'Existing draft; preserve it for investigation');
            await github.rest.git.createRef({...repo,ref:`refs/tags/${tag}`,sha:m.source_sha});
            const body = `基于上游稳定版 v0.1.8 的简体中文 Android 社区版，arm64-v8a。\n\n`+
              `版本：0.1.8-zh.1；versionCode：1000415。\n精确源码：${m.source_sha}\n构建与完整验证：https://github.com/ZhiweiXiao98/t3code/actions/runs/${m.candidate_run_id}\n签名发布：https://github.com/ZhiweiXiao98/t3code/actions/runs/${context.runId}\n\n`+
              '采用固定社区签名身份，加密备份已通过全新 GitHub 托管 runner 恢复验证。沿用 android-v0.1.3-zh.1 的固定签名身份，versionCode 递增；更早使用其他签名的 APK 不能直接覆盖安装，卸载前请自行保存需要的应用配置。\n\n'+
              '本版为连接 T3 Code 服务端的移动客户端；请使用兼容的新版服务端。本次 Android 发布未替换任何桌面资产；请以各发布页的精确源码和构建记录核对来源。\n\n'+
              '已完成完整当前提交 CI、原生回归、APK 包名/版本/架构与签名证书校验；未声称完成所有实体手机上的人工安装与界面验证。SHA256SUMS.txt 与 BUILD-PROVENANCE.json 记录完整性、构建及签名来源。手动下载安装，不提供自动更新。';
            const {data:release}=await github.rest.repos.createRelease({...repo,tag_name:tag,target_commitish:m.source_sha,name:'T3 Code 中文 Android 0.1.8-zh.1 (arm64)',body,draft:true,prerelease:false,make_latest:'false'});
            const expectedAssets = [];
            for(const name of names) {
              const data=fs.readFileSync(`release-assets/${name}`);
              const {data:asset}=await github.rest.repos.uploadReleaseAsset({...repo,release_id:release.id,name,data,headers:{'content-type':'application/octet-stream','content-length':data.length}});
              assert(Number.isSafeInteger(asset.id) && asset.id > 0);
              assert.equal(asset.state,'uploaded'); assert.equal(asset.size,data.length); assert.equal(asset.digest,`sha256:${hash(data)}`);
              expectedAssets.push({id:asset.id,name,state:'uploaded',size:data.length,digest:`sha256:${hash(data)}`});
            }
            await recheck();
            assert.equal((await github.rest.git.getRef({...repo,ref:`tags/${tag}`})).data.object.sha,m.source_sha);
            const {data:uploaded}=await github.rest.repos.listReleaseAssets({...repo,release_id:release.id,per_page:100});
            assert.deepEqual(uploaded.map(({id,name,state,size,digest})=>({id,name,state,size,digest})).sort((a,b)=>a.name.localeCompare(b.name)),expectedAssets.sort((a,b)=>a.name.localeCompare(b.name)));
            const {data:currentRelease}=await github.rest.repos.getRelease({...repo,release_id:release.id});
            assert.equal(currentRelease.id,release.id); assert.equal(currentRelease.tag_name,tag);
            assert.equal(currentRelease.target_commitish,m.source_sha); assert.equal(currentRelease.draft,true); assert.equal(currentRelease.prerelease,false);
            assert.equal(currentRelease.name,'T3 Code 中文 Android 0.1.8-zh.1 (arm64)'); assert.equal(currentRelease.body,body);
            const {data:published}=await github.rest.repos.updateRelease({...repo,release_id:release.id,draft:false,prerelease:false,make_latest:'false'});
            assert.equal(published.draft,false); assert.equal(published.prerelease,false);
            core.summary.addLink('Signed Android release',published.html_url); await core.summary.write();


