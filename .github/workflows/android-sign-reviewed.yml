name: Stage exact reviewed Android candidate only
permissions:
  contents: read
  actions: read
concurrency:
  group: disabled-android-sign-only-740
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: android-signing
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
    - name: Fetch only reviewed signing tools from exact workflow commit
      env:
        SOURCE_SHA: ${{ github.sha }}
        GIT_TERMINAL_PROMPT: '0'
      run: 'set -euo pipefail

        umask 077

        git init .

        git remote add origin https://github.com/ZhiweiXiao98/t3code.git

        git sparse-checkout init --cone

        git sparse-checkout set docs/tools/android-cloud-signing

        git fetch --no-tags --depth=1 origin "$SOURCE_SHA"

        git checkout --detach FETCH_HEAD

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        test "$(git ls-remote origin refs/heads/signing/android-bootstrap | cut -f1)"
        = "$SOURCE_SHA"

        # No candidate repository source is checked out or executed.

        test -x "$JAVA_HOME_21_X64/bin/java"

        test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

        '
    - name: Fetch exact public non-secret regression fixtures
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python docs/tools/android-cloud-signing/materialize_public_test_fixtures.py
    - name: Run reviewed non-secret signing safety tests (no publisher)
      run: 'set -euo pipefail

        python -m unittest discover -s docs/tools/android-cloud-signing -p "test_*.py"
        -v

        '
    - name: Verify candidate CI, ZIP and APK without signing Secrets
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\npython docs/tools/android-cloud-signing/sign_reviewed.py\
        \ prepare \\\n  --input docs/tools/android-cloud-signing/reviewed-signing-input.json\
        \ \\\n  --workspace \"$RUNNER_TEMP/reviewed-android\"\n"
    - name: Sign only reviewed APK with fixed recovered identity
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: "set -euo pipefail\numask 077\nexport JAVA_HOME=\"$JAVA_HOME_21_X64\"\n\
        export PATH=\"$JAVA_HOME/bin:$PATH\"\npython docs/tools/android-cloud-signing/sign_reviewed.py\
        \ sign \\\n  --input docs/tools/android-cloud-signing/reviewed-signing-input.json\
        \ \\\n  --workspace \"$RUNNER_TEMP/reviewed-android\" --output \"$RUNNER_TEMP/signed-android\"\
        \n"
    - name: Upload only signed APK and public provenance
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: android-signed-reviewed-${{ github.run_id }}
        path: '${{ runner.temp }}/signed-android/T3-Code-zh-CN-Android-0.1.9-zh.2-arm64-v8a.apk

          ${{ runner.temp }}/signed-android/BUILD-PROVENANCE.json

          ${{ runner.temp }}/signed-android/SHA256SUMS.txt

          '
        if-no-files-found: error
        retention-days: 14
'on':
  push:
    branches:
    - signing/android-bootstrap
    paths:
    - .github/workflows/android-sign-reviewed.yml
    - docs/tools/android-cloud-signing/**
