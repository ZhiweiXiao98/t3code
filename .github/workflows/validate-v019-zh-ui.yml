        \ [key,value] of Object.entries({sourceSha,runId,runAttempt,subsetId,reviewedCount:reviewedFiles.length,selectedCount:selectedFiles.length,reviewedFilesSha256:hash(reviewedFiles),selectedFilesSha256:hash(selectedFiles),diagnosticOnly:true,releaseAccepted:false}))assert.deepEqual(s[key],value);\n assert.deepEqual(s.files.map(x=>x.file),reviewedFiles);\n const files=s.files.map(x=>{const row={file:x.file,selected:bool(x.selected),queued:bool(x.queued),collected:bool(x.collected),started:bool(x.started),ended:bool(x.ended),counts:x.counts===null?null:counts(x.counts),moduleState:enumeration(x.moduleState,[null,'queued','pending','passed','failed','skipped']),moduleErrorCount:number(x.moduleErrorCount),hookStarts:number(x.hookStarts),hookEnds:number(x.hookEnds),activeHooks:Object.fromEntries(['beforeAll','afterAll','beforeEach','afterEach'].map(k=>[k,number(x.activeHooks[k])])),status:enumeration(x.status,['not-selected','missing','in-flight','ended'])};assert.equal(row.selected,selectedFiles.includes(row.file));for(const\
        \ e of ['queued','collected','started','ended'])if(x[e+'At']!==undefined)row[e+'At']=timestamp(x[e+'At']);return row;});\n const expectedScope=selectedFiles.length===reviewedFiles.length?'reviewed-set':'diagnostic-subset';assert.equal(s.scope,expectedScope);\n const totals=Object.fromEntries(countNames.map(k=>[k,0]));\n for(const row of files){\n  assert.equal(row.status,!row.selected?'not-selected':row.ended?'ended':row.queued||row.collected||row.started?'in-flight':'missing');\n  assert(!row.collected||row.queued);assert(!row.started||row.queued);assert(!row.ended||row.started);\n  for(const e of ['queued','collected','started','ended'])assert.equal(row[e],row[e+'At']!==undefined);\n  assert(row.hookEnds<=row.hookStarts);assert.equal(Object.values(row.activeHooks).reduce((a,b)=>a+b,0),row.hookStarts-row.hookEnds);\n  if(!row.selected)assert(!row.queued&&!row.collected&&!row.started&&!row.ended&&row.counts===null&&row.moduleState===null&&row.moduleErrorCount===0&&row.hookStarts===0);\n\
        \  if(row.ended)assert(['passed','failed','skipped'].includes(row.moduleState));\n  if(row.counts){for(const k of countNames)totals[k]+=row.counts[k];if(row.moduleState==='passed')assert(row.counts.failed===0&&row.moduleErrorCount===0);}\n }\n assert.deepEqual(counts(s.observedCounts),totals);\n assert.deepEqual(s.missing,files.filter(f=>f.status==='missing').map(f=>f.file));\n assert.deepEqual(s.inFlight,files.filter(f=>f.status==='in-flight').map(f=>f.file));\n assert.deepEqual(s.failedModules,files.filter(f=>f.moduleState==='failed'||f.moduleErrorCount>0).map(f=>f.file));\n assert.equal(s.countsComplete,s.integrityError===null&&s.phase==='ended'&&files.filter(f=>f.selected).every(f=>f.ended&&f.counts!==null&&f.counts.pending===0));\n const list=k=>{assert(Array.isArray(s[k])&&new Set(s[k]).size===s[k].length&&s[k].every(f=>selectedFiles.includes(f)));return s[k];};\n assert([null, 'absolute-paths', 'api-or-io-failure', 'case-outside-module', 'changed-collection', 'collection-after-start',\
        \ 'contradictory-module-state', 'contradictory-run-result', 'contradictory-test-state', 'contradictory-todo', 'duplicate-case-result', 'duplicate-final-module', 'duplicate-or-late-event', 'duplicate-path', 'duplicate-run', 'duplicate-test', 'end-before-start', 'event-before-queue', 'event-outside-run', 'file-list', 'fresh-output-required', 'hook-end-before-start', 'hook-outside-module', 'invalid-hook', 'invalid-module-path', 'invalid-module-state', 'invalid-run-end', 'invalid-test-state', 'nonterminal-module-end', 'omitted-final-module', 'pending-case-result', 'previous-fault', 'run-attempt', 'run-id', 'runner-version', 'source-sha', 'specification-mismatch', 'subset-id', 'unended-final-module', 'unexpected-module', 'unreviewed-selection', 'unsafe-path', 'unsorted-paths'].includes(s.integrityError));\n return {schema:s.schema,runner:s.runner,sourceSha,runId,runAttempt,subsetId,diagnosticOnly:true,releaseAccepted:false,scope:enumeration(s.scope,['reviewed-set','diagnostic-subset']),reviewedCount:reviewedFiles.length,selectedCount:selectedFiles.length,reviewedFilesSha256:s.reviewedFilesSha256,selectedFilesSha256:s.selectedFilesSha256,sequence:number(s.sequence),updatedAt:timestamp(s.updatedAt),phase:enumeration(s.phase,['initialized','running','ended','interrupted','exited-incomplete']),signal:enumeration(s.signal,[null,'SIGTERM','SIGINT']),integrityError:s.integrityError,runEndReason:enumeration(s.runEndReason,[null,'passed','failed','interrupted']),unhandledErrorCount:nullableNumber(s.unhandledErrorCount),observedCounts:counts(s.observedCounts),countsComplete:bool(s.countsComplete),missing:list('missing'),inFlight:list('inFlight'),failedModules:list('failedModules'),files};\n\
        }\n\nV019_NODE\n"
    - name: Verify free public repo, final source and operation-only direct child
      id: provenance
      uses: actions/github-script@v8
      with:
        script: "const {operationGuard, frozen, writeJson} = await import(`file://${process.env.RUNNER_TEMP}/v019-tools/contracts.mjs`);\nconst repo = {owner: 'ZhiweiXiao98', repo: 't3code'};\nconst repository = (await github.rest.repos.get(repo)).data;\nconst sourceRef = (await github.rest.git.getRef({...repo, ref: `heads/${process.env.SOURCE_BRANCH}`})).data;\nconst sourceCommit = (await github.rest.git.getCommit({...repo, commit_sha: process.env.SOURCE_SHA})).data;\nconst operationRef = (await github.rest.git.getRef({...repo, ref: 'heads/validation/v0.1.9-zh.2-ui-74039745b1b4-canonical'})).data;\nconst operationCommit = (await github.rest.git.getCommit({...repo, commit_sha: context.sha})).data;\nconst comparison = (await github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `${process.env.SOURCE_SHA}...${context.sha}`})).data;\nconst operation = operationGuard({env: process.env, context, repository, sourceRef, sourceCommit, operationRef, operationCommit, comparison});\nconst\
          \ path = require('node:path');\nconst {files, captures} = frozen(process.env);\nwriteJson(path.join(process.env.RUNNER_TEMP, 'v019-evidence/provenance.json'), {\n  repository: 'ZhiweiXiao98/t3code', sourceBranch: process.env.SOURCE_BRANCH,\n  sourceSha: process.env.SOURCE_SHA, sourceTree: process.env.SOURCE_TREE,\n  ...operation, runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),\n  testFiles: files, testFilesSha256: process.env.TEST_FILES_SHA256,\n  scenario: 'scripts/scenarios/chinese-thread-menu.e2e.ts', scenarioSha256: process.env.SCENARIO_SHA256,\n  reviewedCaptureLabels: captures, target: 'web', runner: 'ubuntu-24.04',\n  scope: 'Supplemental localization unit/browser tests and one real web scenario. Separate 21-gate release CI remains mandatory. Not installed desktop, Android, or iOS acceptance.',\n});"
    - name: Checkout and verify immutable source without credentials
      env:
        GIT_TERMINAL_PROMPT: '0'
      shell: bash
      run: "set -euo pipefail\ngit init .\ngit remote add origin https://github.com/ZhiweiXiao98/t3code.git\ngit -c credential.helper= -c protocol.allow=never -c protocol.https.allow=always fetch --no-tags --depth=2 origin \"$GITHUB_SHA\"\ntest \"$(git rev-parse FETCH_HEAD^)\" = \"$SOURCE_SHA\"\ntest \"$(git rev-list --parents -n 1 FETCH_HEAD | wc -w)\" -eq 2\ntest \"$(git diff-tree --no-commit-id --name-status -r \"$SOURCE_SHA\" FETCH_HEAD)\" = $'A\\t.github/workflows/validate-v019-zh-ui.yml'\ngit sparse-checkout set --no-cone '/*' '!/.repos/'\ngit checkout --detach \"$SOURCE_SHA\"\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_SHA\"\ntest \"$(git rev-parse HEAD^{tree})\" = \"$SOURCE_TREE\"\ntest -z \"$(git status --porcelain --untracked-files=no)\"\nnode --input-type=module <<'NODE'\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport path from 'node:path';\nimport {execFileSync} from 'node:child_process';\nconst {frozen, checkedFile, sha256, SCENARIO} = await import(`file://${process.env.RUNNER_TEMP}/v019-tools/contracts.mjs`);\n\
        const {files} = frozen(process.env);\nconst tracked = new Set(execFileSync('git', ['ls-files', '-z'], {encoding: 'utf8', maxBuffer: 64 * 1024 * 1024}).split('\\0'));\nfor (const file of [...files, SCENARIO, 'scripts/e2e.config.ts', 'scripts/scenarios/t3.ts', 'scripts/scenarios/start-app.ts']) {\n  assert(tracked.has(file)); checkedFile(process.cwd(), file);\n}\nassert.equal(sha256(fs.readFileSync(SCENARIO)), process.env.SCENARIO_SHA256);\nconst scenario = fs.readFileSync(SCENARIO, 'utf8');\nassert(!/agent\\.(act|assert)|t3-mobile|\\bIOS\\b|test\\.skip|test\\.fail/.test(scenario));\nassert(scenario.includes('WEB') && scenario.includes('app.screenshot('));\nassert.equal(JSON.parse(fs.readFileSync('package.json')).engines.node, '26.12.1');\nNODE\n"
    - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      with:
        node-version: 26.12.1
        cache: true
        run-install: false
