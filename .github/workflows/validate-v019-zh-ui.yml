jobs:
  supplemental:
    name: Selected localization tests and real web scenario
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - name: Prepare isolated validation directories
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/v019-browsers"
        printf '%s\n' "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
        mkdir "$RUNNER_TEMP/v019-tools" "$RUNNER_TEMP/v019-private" "$RUNNER_TEMP/v019-evidence" "$PLAYWRIGHT_BROWSERS_PATH"
    - name: Prepare isolated helper contracts.mjs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        cat > "$RUNNER_TEMP/v019-tools/contracts.mjs" <<'V019_NODE'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        import path from 'node:path';
        import crypto from 'node:crypto';

        export const REPOSITORY = 'ZhiweiXiao98/t3code';
        export const SOURCE_BRANCH = 'maintenance/v0.1.9-zh-cloud';
        export const OPERATION_BRANCH = 'validation/v0.1.9-zh.1-ui-fix2';
        export const WORKFLOW_PATH = '.github/workflows/validate-v019-zh-ui.yml';
        export const SCENARIO = 'scripts/scenarios/chinese-thread-menu.e2e.ts';
        export const MAX_TEST_FILES = 256;
        export const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');
        export const json = file => JSON.parse(fs.readFileSync(file, 'utf8'));
        export const writeJson = (file, value) => fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`, {mode: 0o600});
        export function relativeFile(value) {
          assert.equal(typeof value, 'string');
          assert(value.length <= 300 && /^[A-Za-z0-9_./-]+$/.test(value));
          assert(!value.startsWith('/') && !value.split('/').some(part => ['', '.', '..'].includes(part)));
          return value;
        }
        export function testFiles(value) {
          const files = typeof value === 'string' ? JSON.parse(value) : value;
          assert(Array.isArray(files) && files.length > 0 && files.length <= MAX_TEST_FILES);
          assert.equal(new Set(files).size, files.length);
          assert.deepEqual([...files].sort(), files, 'Test list must be sorted');
          for (const file of files) {
            relativeFile(file);
            assert(file === 'apps/mobile/app.config.test.ts' || /^(apps\/(web|mobile|desktop)\/src|packages\/(shared|client-runtime)\/src)\/.+\.test\.tsx?$/.test(file), `Out-of-scope test: ${file}`);
          }
          assert(files.some(file => file.startsWith('apps/web/src/') && /\.browser\.test\.tsx?$/.test(file)), 'Actual Chromium browser tests are mandatory');
          return files;
        }
        export function frozen(env) {
          assert.equal(env.SOURCE_BRANCH, SOURCE_BRANCH);
          for (const key of ['SOURCE_SHA', 'SOURCE_TREE']) assert.match(env[key] ?? '', /^[0-9a-f]{40}$/);
          for (const key of ['TEST_FILES_SHA256', 'SCENARIO_SHA256']) assert.match(env[key] ?? '', /^[0-9a-f]{64}$/);
          const files = testFiles(env.TEST_FILES_JSON);
          assert.equal(sha256(JSON.stringify(files)), env.TEST_FILES_SHA256);
          const captures = JSON.parse(env.SCENARIO_CAPTURES_JSON);
          assert(Array.isArray(captures) && captures.length >= 3 && captures.length <= 20);
          assert.equal(new Set(captures).size, captures.length);
          for (const capture of captures) assert.match(capture, /^[a-z][a-z0-9-]{2,70}$/);
          return {files, captures};
        }
        export function operationGuard({env, context, repository, sourceRef, sourceCommit, operationRef, operationCommit, comparison}) {
          frozen(env);
          assert.equal(`${context.repo.owner}/${context.repo.repo}`, REPOSITORY);
          assert.equal(repository.full_name, REPOSITORY);
          assert.equal(repository.private, false, 'Only free public repository runners');
          assert.equal(context.eventName, 'push');
          assert.equal(context.ref, `refs/heads/${OPERATION_BRANCH}`);
          assert.match(context.sha, /^[0-9a-f]{40}$/);
          assert.equal(sourceRef.object.sha, env.SOURCE_SHA, 'Source branch moved');
          assert.equal(sourceCommit.sha, env.SOURCE_SHA);
          assert.equal(sourceCommit.tree.sha, env.SOURCE_TREE);
          assert.equal(operationRef.object.sha, context.sha, 'Operation branch moved');
          assert.equal(operationCommit.sha, context.sha);
          assert.deepEqual(operationCommit.parents.map(parent => parent.sha), [env.SOURCE_SHA], 'Operation must be one direct child of final source');
          assert.equal(comparison.status, 'ahead');
          assert.equal(comparison.ahead_by, 1);
          assert.equal(comparison.behind_by, 0);
          assert.equal(comparison.total_commits, 1);
          assert.deepEqual(comparison.commits.map(commit => commit.sha), [context.sha]);
          assert.equal(comparison.files.length, 1);
          assert.equal(comparison.files[0].filename, WORKFLOW_PATH);
          assert.equal(comparison.files[0].status, 'added');
          assert.match(comparison.files[0].sha, /^[0-9a-f]{40}$/);
          return {operationSha: context.sha, operationTree: operationCommit.tree.sha, workflowBlob: comparison.files[0].sha};
        }
        export function checkedFile(root, relative) {
          relativeFile(relative);
          const file = path.join(root, relative);
          let current = root;
          for (const segment of relative.split('/')) {
            current = path.join(current, segment);
            assert(!fs.lstatSync(current).isSymbolicLink(), 'No symlink paths in evidence or source files');
          }
          assert(fs.statSync(file).isFile());
          assert(fs.realpathSync(file).startsWith(`${fs.realpathSync(root)}${path.sep}`));
          return file;
        }
        export function safeEnv(host, {home, browserPath, temp}) {
          for (const value of [home, browserPath, temp]) assert(path.isAbsolute(value));
          // Deliberate positive allowlist. Never spread host into a child process.
          const env = {};
          for (const key of ['PATH', 'LANG', 'LC_ALL', 'LC_CTYPE', 'TZ', 'DISPLAY', 'WAYLAND_DISPLAY']) {
            if (typeof host[key] === 'string') env[key] = host[key];
          }
          assert(env.PATH && path.isAbsolute(env.PATH.split(path.delimiter)[0]));
          Object.assign(env, {
            HOME: home, XDG_CONFIG_HOME: path.join(home, '.config'), XDG_CACHE_HOME: path.join(home, '.cache'),
            XDG_DATA_HOME: path.join(home, '.local/share'), XDG_STATE_HOME: path.join(home, '.local/state'),
            TMPDIR: temp, TMP: temp, TEMP: temp, CI: '1', NO_COLOR: '1', FORCE_COLOR: '0',
            E2E_TELEMETRY_DISABLED: '1', DO_NOT_TRACK: '1', PLAYWRIGHT_BROWSERS_PATH: browserPath,
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1', PLAYWRIGHT_SKIP_BROWSER_GC: '1',
            T3CODE_AUTO_BOOTSTRAP_PROJECT_FROM_CWD: '0', T3CODE_DEV_SEED: '0',
            GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null', GIT_TERMINAL_PROMPT: '0',
          });
          return env;
        }
        export function credentialValues(repo) {
          const credentialFile = path.join(repo, '.t3/scenarios/pairing-path');
          if (!fs.existsSync(credentialFile)) return [];
          const value = fs.readFileSync(credentialFile, 'utf8').trim();
          const url = new URL(value, 'http://127.0.0.1');
          const secrets = [value, url.href];
          for (const [key, item] of url.searchParams) if (/token|code|secret|key|credential/i.test(key)) secrets.push(item);
          const hashParams = new URLSearchParams(url.hash.replace(/^#/, ''));
          for (const [key, item] of hashParams) if (/token|code|secret|key|credential/i.test(key)) secrets.push(item);
          return secrets.filter(value => value.length >= 8).sort((a, b) => b.length - a.length);
        }
        export function sanitize(value, credentials = []) {
          let clean = String(value).replace(/\u001b\[[0-9;]*m/g, '');
          for (const secret of credentials) {
            for (const version of [secret, encodeURIComponent(secret)]) clean = clean.split(version).join('[REDACTED]');
          }
          // Redact the whole pairing/navigation label, not just its query argument.
          clean = clean.replace(/[^\s"'<>]*(?:token|pairing|auth[_-]?code|credential|secret)[^\s"'<>]*[=:][^\s"'<>]+/gi, '[REDACTED-CREDENTIAL]');
          clean = clean.replace(/\b[A-Fa-f0-9]{64}\b/g, '[REDACTED-OPAQUE]');
          clean = clean.replace(/\b(?:gh[pousr]_|github_pat_|sk-)[A-Za-z0-9_-]+\b/g, '[REDACTED-SECRET]');
          for (const secret of credentials) assert(!clean.includes(secret));
          return clean;
        }
        export function scenarioArgs() {
          return ['run', SCENARIO.slice('scripts/'.length), '--target', 'web', '--workers', '1', '--retries', '0', '--repeat-each', '1', '--no-cache', '--trace', 'off', '--video', 'off', '--reporter', 'list', '--output', '.e2e'];
        }
        export function inspectReport(report, {startedAt, sourceSha, captures, credentials = []}) {
          assert.equal(report.schemaVersion, 'report-1');
          const run = report.run;
          assert.equal(run.runner.version, '0.23.0');
          assert(Date.parse(run.startedAt) >= startedAt - 1000, 'Stale scenario result');
          assert(run.finishedAt && Date.parse(run.finishedAt) >= Date.parse(run.startedAt));
          // e2e reports every declared target, including unselected iOS; only web may execute.
          assert.deepEqual(run.targets.map(t => [t.id, t.platform]), [['web', 'web'], ['ios', 'ios']]);
          assert.equal(run.targets[0].engine.name, 'web');
          assert.equal(run.targets[0].engine.version, '0.15.5');
          assert.equal(run.summary.selected, 1);
          assert(run.results.every(result => result.targetId === 'web' || (result.attempts.length === 0 && result.selected === false)), 'No selected or executed mobile target');
          if (run.vcs) {
            assert.equal(run.vcs.commit, sourceSha);
            assert.notEqual(run.vcs.dirty, true);
          }
          assert(!run.carried, 'No reused previous results');
          assert.equal(run.serialGroups.length, 0);
          assert.equal(run.usage.modelTokens, 0);
          assert.equal(run.usage.maxModelCallsInStep, 0);
          assert.equal(run.usage.estimatedCostUsd ?? 0, 0);
          const executed = run.results.filter(result => result.attempts.length > 0);
          assert.equal(executed.length, 1, 'Exactly one executed scenario required');
          const result = executed[0];
          assert.equal(result.file, SCENARIO.slice('scripts/'.length));
          assert.equal(result.kind, 'test');
          assert.equal(result.platform, 'web');
          assert.equal(result.targetId, 'web');
          assert(!result.expectedFailure);
          assert([undefined, 'default'].includes(result.agent), 'No configured model agent');
          assert.equal(result.attempts.length, 1, 'Retries are prohibited');
          assert.equal(result.repeat ?? 0, 0);
          const attempt = result.attempts[0];
          assert.equal(attempt.index, 0);
          assert(!attempt.expectedFailure);
          const captureSteps = [];
          for (const step of attempt.steps) {
            assert(step.kind !== 'agent' && !step.api.startsWith('agent.') && !step.model, 'No paid model or agent assertions');
            assert.equal(step.metrics?.modelCalls ?? 0, 0);
            if (step.api === 'app.screenshot' && captures.includes(step.label) && step.status === 'passed') captureSteps.push(step);
          }
          const screenshots = [];
          for (const step of captureSteps) {
            const artifacts = attempt.artifacts.filter(a => a.kind === 'screenshot' && a.producer?.kind === 'step' && a.producer.stepId === step.id);
            assert.equal(artifacts.length, 1);
            const artifact = artifacts[0];
            assert.equal(artifact.redaction, 'complete');
            assert.equal(artifact.mediaType, 'image/png');
            relativeFile(artifact.path);
            assert(artifact.path.endsWith('.png') && artifact.size > 0);
            assert.match(artifact.sha256, /^[a-f0-9]{64}$/);
            screenshots.push({label: step.label, artifact});
          }
          assert.equal(new Set(screenshots.map(item => item.label)).size, screenshots.length);
          const passed = run.status === 'passed' && run.exitCode === 0 && result.status === 'passed' && attempt.status === 'passed' && attempt.cleanup === 'complete' && run.errors.length === 0 && attempt.secondaryErrors.length === 0 && !attempt.error;
          if (passed) {
            assert.deepEqual(screenshots.map(s => s.label).sort(), [...captures].sort(), 'All reviewed screenshots are mandatory for success');
            assert.equal(run.summary.executed, 1);
            assert.equal(run.summary.passed, 1);
            assert.equal(run.summary.failed + run.summary.flaky + run.summary.interrupted, 0);
          }
          return {passed, screenshots, report: {
            schema: 'sanitized-v019-scenario-1', sourceSha, runId: run.id,
            startedAt: run.startedAt, finishedAt: run.finishedAt,
            target: 'web', runner: 'e2e@0.23.0', engine: '@e2e-dev/web@0.15.5',
            runStatus: run.status, exitCode: run.exitCode, resultStatus: result.status, attemptStatus: attempt.status,
            cleanup: attempt.cleanup, noModelCalls: true, noRetries: true,
            title: sanitize(result.titlePath.join(' > '), credentials),
            error: attempt.error ? sanitize(`${attempt.error.code}: ${attempt.error.message}`, credentials) : undefined,
            steps: attempt.steps.map(s => ({api: s.api, label: sanitize(s.label, credentials), status: s.status})),
            exportedCaptures: screenshots.map(s => s.label),
            excluded: 'Raw report, app log, traces, automatic failure screenshots, sessions, credentials and all .t3/HOME. Video disabled because upstream marks it unredacted.',
            scope: 'One real web scenario plus separately listed localization unit/browser tests. Not native/device UI or the mandatory separate 22 release gates.',
          }};
        }

        V019_NODE
    - name: Prepare isolated helper run-suite.mjs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        cat > "$RUNNER_TEMP/v019-tools/run-suite.mjs" <<'V019_NODE'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        import path from 'node:path';
        import {spawn} from 'node:child_process';
        import {checkedFile, credentialValues, frozen, inspectReport, json, safeEnv, sanitize, scenarioArgs, SCENARIO, sha256, writeJson} from './contracts.mjs';

        const [mode] = process.argv.slice(2);
        assert(['unit', 'scenario'].includes(mode));
        const root = process.cwd();
        const privateRoot = path.join(process.env.RUNNER_TEMP, 'v019-private');
        const publicRoot = path.join(process.env.RUNNER_TEMP, 'v019-evidence');
        const {files, captures} = frozen(process.env);
        const home = path.join(privateRoot, `${mode}-home`);
        const temp = path.join(privateRoot, `${mode}-tmp`);
        fs.mkdirSync(home, {mode: 0o700});
        fs.mkdirSync(temp, {mode: 0o700});
        const env = safeEnv(process.env, {home, temp, browserPath: process.env.PLAYWRIGHT_BROWSERS_PATH});
        writeJson(path.join(publicRoot, `${mode}-environment.json`), {inheritedKeys: Object.keys(env).sort(), isolatedHome: true, noAmbientCredentials: true});
        let command, args, cwd;
        if (mode === 'unit') {
          command = 'vp'; cwd = root;
          args = ['test', 'run', ...files, '--maxWorkers=2', '--retry=0', '--reporter=default', '--reporter=json', '--reporter=junit', `--outputFile.json=${path.join(privateRoot, 'unit.json')}`, `--outputFile.junit=${path.join(privateRoot, 'junit.xml')}`];
        } else {
          command = process.execPath; cwd = path.join(root, 'scripts');
          const cli = path.join(root, 'scripts/node_modules/e2e/dist/cli/bin.js');
          assert(fs.statSync(cli).isFile());
          assert.equal(json(path.join(root, 'scripts/node_modules/e2e/package.json')).version, '0.23.0');
          assert.equal(sha256(fs.readFileSync(checkedFile(root, SCENARIO))), process.env.SCENARIO_SHA256);
          for (const item of ['scripts/.e2e', '.t3/scenarios', '.t3/scenarios-mobile']) assert(!fs.existsSync(path.join(root, item)), 'Scenario state/output must be fresh');
          args = [cli, ...scenarioArgs()];
        }
        writeJson(path.join(publicRoot, `${mode}-command.json`), {command: mode === 'unit' ? 'vp' : 'node scripts/node_modules/e2e/dist/cli/bin.js', args: mode === 'unit' ? args.map(arg => arg.replaceAll(privateRoot, '<private-output>')) : scenarioArgs(), cwd: mode === 'unit' ? '.' : 'scripts', scope: 'Supplemental selected localization validation, not all tests or native/device UI'});
        const startedAt = Date.now();
        const rawLog = path.join(privateRoot, `${mode}.raw.log`);
        const fd = fs.openSync(rawLog, 'wx', 0o600);
        const child = spawn(command, args, {cwd, env, shell: false, detached: true, stdio: ['ignore', fd, fd]});
        let timedOut = false;
        let killTimer;
        const stop = () => {
          if (!child.pid) return;
          try {process.kill(-child.pid, 'SIGTERM');} catch {}
          killTimer = setTimeout(() => {try {process.kill(-child.pid, 'SIGKILL');} catch {}}, 15_000);
        };
        const timeout = setTimeout(() => {timedOut = true; stop();}, (mode === 'unit' ? 16 : 7) * 60_000);
        const forward = () => stop();
        process.once('SIGTERM', forward);
        process.once('SIGINT', forward);
        const result = await new Promise(resolve => {
          child.once('error', error => resolve({code: null, signal: null, spawnError: error.code ?? 'spawn-error'}));
          child.once('close', (code, signal) => resolve({code, signal}));
        });
        clearTimeout(timeout);
        if (killTimer) clearTimeout(killTimer);
        if (timedOut && child.pid) {try {process.kill(-child.pid, 'SIGKILL');} catch {}}
        process.off('SIGTERM', forward);
        process.off('SIGINT', forward);
        fs.closeSync(fd);
        const credentials = credentialValues(root);
        const logSize = fs.statSync(rawLog).size;
        assert(logSize < 64 * 1024 * 1024, 'Output exceeded private log budget');
        fs.writeFileSync(path.join(publicRoot, `${mode}.log`), sanitize(fs.readFileSync(rawLog, 'utf8'), credentials), {mode: 0o600});
        // No raw child stdout/stderr is ever streamed to the Actions console, including failures.
        const status = {...result, timedOut, startedAt: new Date(startedAt).toISOString(), finishedAt: new Date().toISOString(), sourceSha: process.env.SOURCE_SHA};
        writeJson(path.join(publicRoot, `${mode}-exit.json`), status);
        let valid = false;
        try {
          if (mode === 'unit') {
            const report = json(path.join(privateRoot, 'unit.json'));
            assert(report.testResults.length > 0 && report.numTotalTests > 0);
            const reported = report.testResults.map(item => path.relative(root, item.name)).sort();
            assert.deepEqual(reported, files, 'Every reviewed test file must actually run; no silent exclusions or extra files');
            assert(report.testResults.every(item => item.status === 'passed'));
            assert.equal(report.numFailedTests, 0);
            assert.equal(report.numFailedTestSuites, 0);
            assert.equal(report.success, true);
            const browserTests = reported.filter(file => /\.browser\.test\.tsx?$/.test(file));
            assert(browserTests.length > 0);
            for (const item of report.testResults) {
              assert(item.assertionResults.some(test => test.status === 'passed'), 'Each reviewed file must execute at least one passing assertion');
            }
            writeJson(path.join(publicRoot, 'unit-summary.json'), {sourceSha: process.env.SOURCE_SHA, files: reported, browserFiles: browserTests, totalTests: report.numTotalTests, passedTests: report.numPassedTests, pendingTests: report.numPendingTests, success: report.success, caveat: 'Browser component tests and non-native unit tests only; real web scenario is separate'});
            const junit = fs.readFileSync(path.join(privateRoot, 'junit.xml'), 'utf8');
            fs.writeFileSync(path.join(publicRoot, 'junit.xml'), sanitize(junit, credentials), {mode: 0o600});
            valid = true;
          } else {
            const report = json(checkedFile(path.join(root, 'scripts/.e2e'), 'report.json'));
            const reviewed = inspectReport(report, {startedAt, sourceSha: process.env.SOURCE_SHA, captures, credentials});
            const exports = [];
            // Only explicitly reviewed, post-authentication viewport captures. Never automatic failure images.
            for (const {label, artifact} of reviewed.screenshots) {
              const file = checkedFile(path.join(root, 'scripts/.e2e/results'), artifact.path);
              const bytes = fs.readFileSync(file);
              assert.equal(bytes.length, artifact.size);
              assert.equal(sha256(bytes), artifact.sha256);
              assert(bytes.subarray(0, 8).equals(Buffer.from([137,80,78,71,13,10,26,10])));
              assert.equal(bytes.readUInt32BE(16), 1280, 'Only the configured app viewport, not a desktop capture');
              assert.equal(bytes.readUInt32BE(20), 800);
              const name = `${label}.png`;
              fs.writeFileSync(path.join(publicRoot, name), bytes, {flag: 'wx', mode: 0o600});
              exports.push({file: name, sha256: artifact.sha256, bytes: bytes.length});
            }
            writeJson(path.join(publicRoot, 'scenario-report.json'), {...reviewed.report, artifacts: exports});
            valid = reviewed.passed;
          }
        } catch (error) {
          writeJson(path.join(publicRoot, `${mode}-verification-error.json`), {message: sanitize(error.message, credentials), sourceSha: process.env.SOURCE_SHA, resultAccepted: false});
        }
        const success = result.code === 0 && !result.signal && !result.spawnError && !timedOut && valid;
        writeJson(path.join(publicRoot, `${mode}-verdict.json`), {success, sourceSha: process.env.SOURCE_SHA, independentlyVerified: valid});
        console.log(`${mode}: ${success ? 'passed' : 'failed or could not be verified'}; sanitized evidence saved.`);
        if (!success) process.exitCode = 1;

        V019_NODE
    - name: Prepare isolated helper verify-runtime.mjs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        cat > "$RUNNER_TEMP/v019-tools/verify-runtime.mjs" <<'V019_NODE'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        import path from 'node:path';
        import {createRequire} from 'node:module';
        import {execFileSync} from 'node:child_process';
        import {json, sha256, writeJson} from './contracts.mjs';
        const root = process.cwd();
        assert.equal(process.version, 'v26.12.1');
        assert.equal(json('package.json').engines.node, '26.12.1');
        assert.equal(json('package.json').packageManager, 'pnpm@12.14.0');
        assert.equal(json('apps/desktop/package.json').dependencies.electron, '44.10.1');
        assert.equal(json('apps/desktop/node_modules/electron/package.json').version, '44.10.1');
        assert.equal(fs.readFileSync('apps/desktop/node_modules/electron/dist/version', 'utf8').trim(), '44.10.1');
        assert.equal(json('scripts/node_modules/e2e/package.json').version, '0.23.0');
        assert.equal(json('scripts/node_modules/@e2e-dev/web/package.json').version, '0.15.5');
        const browserPath = path.join(process.env.RUNNER_TEMP, 'v019-browsers');
        assert.equal(process.env.PLAYWRIGHT_BROWSERS_PATH, browserPath);
        const reports = [];
        for (const workspace of ['apps/web', 'scripts']) {
          const require = createRequire(path.join(root, workspace, 'package.json'));
          const name = workspace === 'scripts' ? 'playwright-core' : 'playwright';
          const pkg = require.resolve(`${name}/package.json`);
          assert.equal(json(pkg).version, '1.64.1');
          assert.equal(json(path.join(root, workspace, 'package.json'))[workspace === 'scripts' ? 'dependencies' : 'devDependencies'][name], '1.64.1');
          const fromPackage = createRequire(pkg);
          const core = path.dirname(fromPackage.resolve('playwright-core/package.json'));
          const browsers = json(path.join(core, 'browsers.json')).browsers;
          const pinned = browsers.find(item => item.name === 'chromium-headless-shell');
          assert.equal(pinned.revision, '1248');
          assert.equal(pinned.browserVersion, '156.0.8078.4');
          assert.equal(browsers.find(item => item.name === 'ffmpeg').revision, '1013');
          const directory = path.join(browserPath, 'chromium_headless_shell-1248');
          assert(fs.existsSync(path.join(directory, 'INSTALLATION_COMPLETE')));
          const executables = fs.readdirSync(directory, {recursive: true}).filter(file => file.endsWith('/chrome-headless-shell'));
          assert.equal(executables.length, 1);
          const executable = path.join(directory, executables[0]);
          fs.accessSync(executable, fs.constants.X_OK);
          const version = execFileSync(executable, ['--version'], {encoding: 'utf8'}).trim();
          assert(version.includes('156.0.8078.4'));
          reports.push({workspace, playwright: '1.64.1', revision: '1248', version, sha256: sha256(fs.readFileSync(executable))});
        }
        const ffmpeg = path.join(browserPath, 'ffmpeg-1013');
        assert(fs.existsSync(path.join(ffmpeg, 'INSTALLATION_COMPLETE')));
        writeJson(path.join(process.env.RUNNER_TEMP, 'v019-evidence/runtime.json'), {node: process.version, pnpm: '12.14.0', electron: '44.10.1', e2e: '0.23.0', webEngine: '0.15.5', browsers: reports, ffmpegRevision: '1013', lockfileSha256: sha256(fs.readFileSync('pnpm-lock.yaml'))});
        console.log('Pinned Node, Electron, e2e, Chromium and ffmpeg verified.');

        V019_NODE
    - name: Prepare isolated helper audit-artifacts.mjs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        cat > "$RUNNER_TEMP/v019-tools/audit-artifacts.mjs" <<'V019_NODE'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        import path from 'node:path';
        import {checkedFile, credentialValues, frozen, sha256, writeJson} from './contracts.mjs';
        const out = path.join(process.env.RUNNER_TEMP, 'v019-evidence');
        const {captures} = frozen(process.env);
        const allowed = new Set(['provenance.json', 'runtime.json', 'final-status.json', 'unit-summary.json', 'junit.xml', 'scenario-report.json', ...['unit','scenario'].flatMap(mode => [`${mode}-environment.json`, `${mode}-command.json`, `${mode}.log`, `${mode}-exit.json`, `${mode}-verification-error.json`, `${mode}-verdict.json`]), ...captures.map(label => `${label}.png`)]);
        const credentials = credentialValues(process.cwd());
        const inventory = [];
        for (const name of fs.readdirSync(out)) {
          assert(allowed.has(name), 'Unexpected artifact name; nothing will be uploaded');
          const file = checkedFile(out, name);
          const bytes = fs.readFileSync(file);
          assert(bytes.length <= 64 * 1024 * 1024);
          if (!name.endsWith('.png')) {
            const text = bytes.toString('utf8');
            for (const secret of credentials) assert(!text.includes(secret) && !text.includes(encodeURIComponent(secret)), 'Credential in public output');
            assert(!/\b(?:gh[pousr]_|github_pat_|sk-)[A-Za-z0-9_-]+\b/.test(text), 'Credential pattern in public output');
            assert(!/[?&#](?:token|access_token|auth_code|secret)=[^\s"<>]+/i.test(text), 'Pairing URL in public output');
          }
          inventory.push({file: name, bytes: bytes.length, sha256: sha256(bytes)});
        }
        assert(inventory.some(file => file.file === 'final-status.json'));
        writeJson(path.join(out, 'artifact-manifest.json'), {sourceSha: process.env.SOURCE_SHA, sourceTree: process.env.SOURCE_TREE, files: inventory, screenshots: 'Only explicit, reviewed post-authentication page.screenshot PNGs. No browser chrome, desktop capture or automatic failure capture.', excluded: 'All raw e2e reports, app logs, sessions, traces, videos, .t3 state and HOME credentials.'});
        console.log(`Artifact privacy allowlist passed (${inventory.length} files).`);

