    - name: Require positive existing browser observer coverage
      id: observer
      if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/v019-tools/qualify-observer.py"

        '
    - name: Collect only safe root observer evidence
      if: ${{ !cancelled() && steps.observer.outputs.safe_artifacts == 'true' }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'COPY_SAFE'\nfrom pathlib import Path\nimport os\nsource=Path(os.environ['RUNNER_TEMP'])/'v019-observer-evidence'\ntarget=Path(os.environ['RUNNER_TEMP'])/'v019-evidence'\nlimits={'browser-lifecycle.jsonl':2*1024*1024,'browser-server-lifecycle.jsonl':256*1024,'module-identity.json':4096,'observer-verdict.json':64*1024}\nassert set(p.name for p in source.iterdir()) <= set(limits)\nfor name,limit in limits.items():\n    p=source/name\n    if not p.exists():continue\n    assert p.is_file() and not p.is_symlink() and 0<p.stat().st_size<=limit\n    with (target/name).open('xb') as out:out.write(p.read_bytes())\nCOPY_SAFE\n"
    - name: Require both separately compiled Toast platforms
      id: toast_platforms
      if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      timeout-minutes: 5
      shell: bash
      run: 'set -euo pipefail

        node "$RUNNER_TEMP/v019-tools/run-toast.mjs"

        '
    - name: Run only reviewed real web scenario once with no model credentials
      id: scenario
      if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      timeout-minutes: 9
      shell: bash
      run: 'set -euo pipefail

        node "$RUNNER_TEMP/v019-tools/run-suite.mjs" scenario

        '
    - name: Recheck exact source, direct-child operation and mandatory outcomes
      if: ${{ always() }}
      uses: actions/github-script@v8
      env:
        PRIOR_JOB_STATUS: ${{ job.status }}
        UNIT_OUTCOME: ${{ steps.unit.outcome }}
        TOAST_OUTCOME: ${{ steps.toast_platforms.outcome }}
        OBSERVER_OUTCOME: ${{ steps.observer.outcome }}
        SCENARIO_OUTCOME: ${{ steps.scenario.outcome }}
      with:
        script: "const assert = require('node:assert/strict');\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst out = path.join(process.env.RUNNER_TEMP, 'v019-evidence');\nfs.mkdirSync(out, {recursive: true});\nconst record = {sourceSha: process.env.SOURCE_SHA, sourceTree: process.env.SOURCE_TREE,\n  operationSha: context.sha, priorJobStatus: process.env.PRIOR_JOB_STATUS,\n  unitOutcome: process.env.UNIT_OUTCOME, toastOutcome: process.env.TOAST_OUTCOME, observerOutcome: process.env.OBSERVER_OUTCOME, scenarioOutcome: process.env.SCENARIO_OUTCOME,\n  supplementalOnly: true, separate21ReleaseGatesRequired: true, installedAppAcceptance: false};\ntry {\nconst {operationGuard, frozen, writeJson} = await import(`file://${process.env.RUNNER_TEMP}/v019-tools/contracts.mjs`);\nconst repo = {owner: 'ZhiweiXiao98', repo: 't3code'};\nconst repository = (await github.rest.repos.get(repo)).data;\nconst sourceRef = (await github.rest.git.getRef({...repo, ref: `heads/${process.env.SOURCE_BRANCH}`})).data;\n\
          const sourceCommit = (await github.rest.git.getCommit({...repo, commit_sha: process.env.SOURCE_SHA})).data;\nconst operationRef = (await github.rest.git.getRef({...repo, ref: 'heads/validation/v0.1.9-zh.2-ui-74039745b1b4-canonical'})).data;\nconst operationCommit = (await github.rest.git.getCommit({...repo, commit_sha: context.sha})).data;\nconst comparison = (await github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `${process.env.SOURCE_SHA}...${context.sha}`})).data;\nconst operation = operationGuard({env: process.env, context, repository, sourceRef, sourceCommit, operationRef, operationCommit, comparison});\n  const {execFileSync} = require('node:child_process');\n  const git = (...args) => execFileSync('git', args, {encoding: 'utf8', maxBuffer: 64 * 1024 * 1024}).trim();\n  assert.equal(git('rev-parse', 'HEAD'), process.env.SOURCE_SHA);\n  assert.equal(git('rev-parse', 'HEAD^{tree}'), process.env.SOURCE_TREE);\n  assert.equal(git('status', '--porcelain', '--untracked-files=no'),\
          \ '', 'Tracked source changed');\n  record.sourceUnchanged = true;\n  const provenance = JSON.parse(fs.readFileSync(path.join(out, 'provenance.json'), 'utf8'));\n  assert.equal(provenance.operationSha, operation.operationSha);\n  assert.equal(provenance.operationTree, operation.operationTree);\n  assert.equal(provenance.workflowBlob, operation.workflowBlob);\n  for (const mode of ['unit', 'scenario']) {\n    const verdict = JSON.parse(fs.readFileSync(path.join(out, `${mode}-verdict.json`), 'utf8'));\n    assert.equal(verdict.sourceSha, process.env.SOURCE_SHA);\n    assert.equal(verdict.success, true, `${mode} did not pass`);\n  }\n  const {verifyToastReport,verifyToastUnion} = await import(`file://${process.env.RUNNER_TEMP}/v019-tools/toast-contract.mjs`);\n  const {sha256} = await import(`file://${process.env.RUNNER_TEMP}/v019-tools/contracts.mjs`);\n  const observer=JSON.parse(fs.readFileSync(path.join(out,'observer-verdict.json'),'utf8'));\n  assert.equal(observer.sourceSha,process.env.SOURCE_SHA);assert.equal(observer.sourceTree,process.env.SOURCE_TREE);assert.equal(observer.operationSha,context.sha);assert.equal(observer.runId,String(context.runId));assert.equal(observer.runAttempt,Number(process.env.GITHUB_RUN_ATTEMPT));assert.equal(observer.success,true);assert(observer.counts.qualified>0);assert.equal(process.env.OBSERVER_OUTCOME,'success');\n\
          \  const toastProofs=[];\n  for(const platform of ['ios','android']) {\n    const p=JSON.parse(fs.readFileSync(path.join(out,`toast-${platform}-provenance.json`),'utf8'));\n    assert.equal(p.platform,platform);assert.equal(p.sourceSha,process.env.SOURCE_SHA);assert.equal(p.sourceTree,process.env.SOURCE_TREE);assert.equal(p.operationSha,context.sha);\n    assert.equal(p.runId,String(context.runId));assert.equal(p.runAttempt,Number(process.env.GITHUB_RUN_ATTEMPT));assert.equal(p.code,0);assert.equal(p.signal,null);assert.equal(p.timedOut,false);\n    const raw=fs.readFileSync(path.join(out,`toast-${platform}-raw.json`));assert.equal(sha256(raw),p.rawReportSha256);assert.equal(raw.length,p.rawReportBytes);\n    for(const [file,digest] of Object.entries(p.sourceFiles))assert.equal(sha256(fs.readFileSync(file)),digest);\n    toastProofs.push(verifyToastReport(JSON.parse(raw),{platform,root:process.cwd(),startedAt:p.startedAt,finishedAt:p.finishedAt}));\n  }\n  verifyToastUnion(toastProofs);assert.equal(process.env.TOAST_OUTCOME,'success');\n\
          \  assert.equal(process.env.UNIT_OUTCOME, 'success');\n  assert.equal(process.env.SCENARIO_OUTCOME, 'success');\n  assert.equal(process.env.PRIOR_JOB_STATUS, 'success');\n  record.accepted = true;\n} catch (error) {\n  record.accepted = false;\n  record.sourceUnchanged ??= false;\n  // Do not include arbitrary raw errors or report bodies in public provenance.\n  record.error = 'Exact-source or mandatory supplemental result verification failed; see sanitized diagnostics.';\n  core.setFailed(record.error);\n} finally {\n  fs.writeFileSync(path.join(out, 'final-status.json'), JSON.stringify(record, null, 2));\n  core.summary.addRaw(`Supplemental localization: ${record.accepted ? 'passed' : 'not accepted'}\\nSource: ${record.sourceSha}\\nTree: ${record.sourceTree}\\nOne real web scenario; no native/device UI claim. Mandatory 21 release gates remain separate.\\n`);\n  await core.summary.write();\n}"
    - name: Enforce final artifact filename, path and credential allowlist
      id: artifact_safety
