    - name: Verify free public repo, final source and operation-only direct child
      id: provenance
      uses: actions/github-script@v8
      with:
        script: |-
          const {operationGuard, frozen, writeJson} = await import(`file://${process.env.RUNNER_TEMP}/v019-tools/contracts.mjs`);
          const repo = {owner: 'ZhiweiXiao98', repo: 't3code'};
          const repository = (await github.rest.repos.get(repo)).data;
          const sourceRef = (await github.rest.git.getRef({...repo, ref: `heads/${process.env.SOURCE_BRANCH}`})).data;
          const sourceCommit = (await github.rest.git.getCommit({...repo, commit_sha: process.env.SOURCE_SHA})).data;
          const operationRef = (await github.rest.git.getRef({...repo, ref: 'heads/validation/v0.1.9-zh.1-ui-042eacb54f19-lifecycle'})).data;
          const operationCommit = (await github.rest.git.getCommit({...repo, commit_sha: context.sha})).data;
          const comparison = (await github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `${process.env.SOURCE_SHA}...${context.sha}`})).data;
          const operation = operationGuard({env: process.env, context, repository, sourceRef, sourceCommit, operationRef, operationCommit, comparison});
          const path = require('node:path');
          const {files, captures} = frozen(process.env);
          writeJson(path.join(process.env.RUNNER_TEMP, 'v019-evidence/provenance.json'), {
            repository: 'ZhiweiXiao98/t3code', sourceBranch: process.env.SOURCE_BRANCH,
            sourceSha: process.env.SOURCE_SHA, sourceTree: process.env.SOURCE_TREE,
            ...operation, runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            testFiles: files, testFilesSha256: process.env.TEST_FILES_SHA256,
            scenario: 'scripts/scenarios/chinese-thread-menu.e2e.ts', scenarioSha256: process.env.SCENARIO_SHA256,
            reviewedCaptureLabels: captures, target: 'web', runner: 'ubuntu-24.04',
            scope: 'Supplemental localization unit/browser tests and one real web scenario. Separate 22-gate release CI remains mandatory. Not installed desktop, Android, or iOS acceptance.',
          });
    - name: Checkout and verify immutable source without credentials
      env:
        GIT_TERMINAL_PROMPT: '0'
      shell: bash
      run: |
        set -euo pipefail
        git init .
        git remote add origin https://github.com/ZhiweiXiao98/t3code.git
        git -c credential.helper= -c protocol.allow=never -c protocol.https.allow=always fetch --no-tags --depth=2 origin "$GITHUB_SHA"
        test "$(git rev-parse FETCH_HEAD^)" = "$SOURCE_SHA"
        test "$(git rev-list --parents -n 1 FETCH_HEAD | wc -w)" -eq 2
        test "$(git diff-tree --no-commit-id --name-status -r "$SOURCE_SHA" FETCH_HEAD)" = $'A\t.github/workflows/validate-v019-zh-ui.yml'
        git sparse-checkout set --no-cone '/*' '!/.repos/'
        git checkout --detach "$SOURCE_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
        test -z "$(git status --porcelain --untracked-files=no)"
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        import path from 'node:path';
        import {execFileSync} from 'node:child_process';
        const {frozen, checkedFile, sha256, SCENARIO} = await import(`file://${process.env.RUNNER_TEMP}/v019-tools/contracts.mjs`);
        const {files} = frozen(process.env);
        const tracked = new Set(execFileSync('git', ['ls-files', '-z'], {encoding: 'utf8', maxBuffer: 64 * 1024 * 1024}).split('\0'));
        for (const file of [...files, SCENARIO, 'scripts/e2e.config.ts', 'scripts/scenarios/t3.ts', 'scripts/scenarios/start-app.ts']) {
          assert(tracked.has(file)); checkedFile(process.cwd(), file);
        }
        assert.equal(sha256(fs.readFileSync(SCENARIO)), process.env.SCENARIO_SHA256);
        const scenario = fs.readFileSync(SCENARIO, 'utf8');
        assert(!/agent\.(act|assert)|t3-mobile|\bIOS\b|test\.skip|test\.fail/.test(scenario));
        assert(scenario.includes('WEB') && scenario.includes('app.screenshot('));
        assert.equal(JSON.parse(fs.readFileSync('package.json')).engines.node, '26.12.1');
        NODE
    - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      with:
        node-version: 26.12.1
        cache: true
        run-install: false
    - name: Install exact frozen lockfile dependencies
      timeout-minutes: 12
      shell: bash
      run: |
        set -euo pipefail
        test "$(node --version)" = v26.12.1
        vp install --frozen-lockfile
    - name: Install Linux test libraries
      timeout-minutes: 4
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/scripts/ci-ubuntu-packages.py packages libsecret-1-dev pkg-config build-essential imagemagick
    - name: Prepare locked Electron 44.10.1 for unit tests only
      timeout-minutes: 4
      shell: bash
      run: |
        set -euo pipefail
        vp run --filter @t3tools/desktop ensure:electron
    - name: Install and verify locked Chromium and runtime versions
      id: browser
      timeout-minutes: 6
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/scripts/ci-ubuntu-packages.py playwright apps/web/node_modules/playwright/cli.js
        node apps/web/node_modules/playwright/cli.js install --only-shell chromium
        node scripts/node_modules/playwright-core/cli.js install --only-shell chromium ffmpeg
        node "$RUNNER_TEMP/v019-tools/verify-runtime.mjs"
    - name: Run every explicitly reviewed localization test file once
      id: unit
      timeout-minutes: 18
      shell: bash
      run: |
        set -euo pipefail
        node "$RUNNER_TEMP/v019-tools/run-suite.mjs" unit
    - name: Run only reviewed real web scenario once with no model credentials
      id: scenario
      if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      timeout-minutes: 9
      shell: bash
      run: |
        set -euo pipefail
        node "$RUNNER_TEMP/v019-tools/run-suite.mjs" scenario
    - name: Recheck exact source, direct-child operation and mandatory outcomes
      if: ${{ always() }}
      uses: actions/github-script@v8
      env:
        PRIOR_JOB_STATUS: ${{ job.status }}
        UNIT_OUTCOME: ${{ steps.unit.outcome }}
        SCENARIO_OUTCOME: ${{ steps.scenario.outcome }}
      with:
        script: |-
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join(process.env.RUNNER_TEMP, 'v019-evidence');
          fs.mkdirSync(out, {recursive: true});
          const record = {sourceSha: process.env.SOURCE_SHA, sourceTree: process.env.SOURCE_TREE,
            operationSha: context.sha, priorJobStatus: process.env.PRIOR_JOB_STATUS,
            unitOutcome: process.env.UNIT_OUTCOME, scenarioOutcome: process.env.SCENARIO_OUTCOME,
            supplementalOnly: true, separate22ReleaseGatesRequired: true, installedAppAcceptance: false};
          try {
          const {operationGuard, frozen, writeJson} = await import(`file://${process.env.RUNNER_TEMP}/v019-tools/contracts.mjs`);
          const repo = {owner: 'ZhiweiXiao98', repo: 't3code'};
          const repository = (await github.rest.repos.get(repo)).data;
          const sourceRef = (await github.rest.git.getRef({...repo, ref: `heads/${process.env.SOURCE_BRANCH}`})).data;
          const sourceCommit = (await github.rest.git.getCommit({...repo, commit_sha: process.env.SOURCE_SHA})).data;
          const operationRef = (await github.rest.git.getRef({...repo, ref: 'heads/validation/v0.1.9-zh.1-ui-042eacb54f19-lifecycle'})).data;
          const operationCommit = (await github.rest.git.getCommit({...repo, commit_sha: context.sha})).data;
          const comparison = (await github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `${process.env.SOURCE_SHA}...${context.sha}`})).data;
          const operation = operationGuard({env: process.env, context, repository, sourceRef, sourceCommit, operationRef, operationCommit, comparison});
            const {execFileSync} = require('node:child_process');
            const git = (...args) => execFileSync('git', args, {encoding: 'utf8', maxBuffer: 64 * 1024 * 1024}).trim();
            assert.equal(git('rev-parse', 'HEAD'), process.env.SOURCE_SHA);
            assert.equal(git('rev-parse', 'HEAD^{tree}'), process.env.SOURCE_TREE);
            assert.equal(git('status', '--porcelain', '--untracked-files=no'), '', 'Tracked source changed');
            record.sourceUnchanged = true;
            const provenance = JSON.parse(fs.readFileSync(path.join(out, 'provenance.json'), 'utf8'));
            assert.equal(provenance.operationSha, operation.operationSha);
            assert.equal(provenance.operationTree, operation.operationTree);
            assert.equal(provenance.workflowBlob, operation.workflowBlob);
            for (const mode of ['unit', 'scenario']) {
              const verdict = JSON.parse(fs.readFileSync(path.join(out, `${mode}-verdict.json`), 'utf8'));
              assert.equal(verdict.sourceSha, process.env.SOURCE_SHA);
              assert.equal(verdict.success, true, `${mode} did not pass`);
            }
            assert.equal(process.env.UNIT_OUTCOME, 'success');
            assert.equal(process.env.SCENARIO_OUTCOME, 'success');
            assert.equal(process.env.PRIOR_JOB_STATUS, 'success');
            record.accepted = true;
          } catch (error) {
            record.accepted = false;
            record.sourceUnchanged ??= false;
            // Do not include arbitrary raw errors or report bodies in public provenance.
            record.error = 'Exact-source or mandatory supplemental result verification failed; see sanitized diagnostics.';
            core.setFailed(record.error);
          } finally {
            fs.writeFileSync(path.join(out, 'final-status.json'), JSON.stringify(record, null, 2));
            core.summary.addRaw(`Supplemental localization: ${record.accepted ? 'passed' : 'not accepted'}\nSource: ${record.sourceSha}\nTree: ${record.sourceTree}\nOne real web scenario; no native/device UI claim. Mandatory 22 release gates remain separate.\n`);
            await core.summary.write();
          }
    - name: Enforce final artifact filename, path and credential allowlist
