    - name: Recheck exact source, direct-child operation and mandatory outcomes
      if: ${{ always() }}
      uses: actions/github-script@v8
      env:
        PRIOR_JOB_STATUS: ${{ job.status }}
        UNIT_OUTCOME: ${{ steps.unit.outcome }}
        SCENARIO_OUTCOME: ${{ steps.scenario.outcome }}
      with:
        script: |-
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join(process.env.RUNNER_TEMP, 'v019-evidence');
          fs.mkdirSync(out, {recursive: true});
          const record = {sourceSha: process.env.SOURCE_SHA, sourceTree: process.env.SOURCE_TREE,
            operationSha: context.sha, priorJobStatus: process.env.PRIOR_JOB_STATUS,
            unitOutcome: process.env.UNIT_OUTCOME, scenarioOutcome: process.env.SCENARIO_OUTCOME,
            supplementalOnly: true, separate22ReleaseGatesRequired: true, installedAppAcceptance: false};
          try {
          const {operationGuard, frozen, writeJson} = await import(`file://${process.env.RUNNER_TEMP}/v019-tools/contracts.mjs`);
          const repo = {owner: 'ZhiweiXiao98', repo: 't3code'};
          const repository = (await github.rest.repos.get(repo)).data;
          const sourceRef = (await github.rest.git.getRef({...repo, ref: `heads/${process.env.SOURCE_BRANCH}`})).data;
          const sourceCommit = (await github.rest.git.getCommit({...repo, commit_sha: process.env.SOURCE_SHA})).data;
          const operationRef = (await github.rest.git.getRef({...repo, ref: 'heads/validation/v0.1.9-zh.1-ui-fix2'})).data;
          const operationCommit = (await github.rest.git.getCommit({...repo, commit_sha: context.sha})).data;
          const comparison = (await github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `${process.env.SOURCE_SHA}...${context.sha}`})).data;
          const operation = operationGuard({env: process.env, context, repository, sourceRef, sourceCommit, operationRef, operationCommit, comparison});
            const {execFileSync} = require('node:child_process');
            const git = (...args) => execFileSync('git', args, {encoding: 'utf8', maxBuffer: 64 * 1024 * 1024}).trim();
            assert.equal(git('rev-parse', 'HEAD'), process.env.SOURCE_SHA);
            assert.equal(git('rev-parse', 'HEAD^{tree}'), process.env.SOURCE_TREE);
            assert.equal(git('status', '--porcelain', '--untracked-files=no'), '', 'Tracked source changed');
            record.sourceUnchanged = true;
            const provenance = JSON.parse(fs.readFileSync(path.join(out, 'provenance.json'), 'utf8'));
            assert.equal(provenance.operationSha, operation.operationSha);
            assert.equal(provenance.operationTree, operation.operationTree);
            assert.equal(provenance.workflowBlob, operation.workflowBlob);
            for (const mode of ['unit', 'scenario']) {
              const verdict = JSON.parse(fs.readFileSync(path.join(out, `${mode}-verdict.json`), 'utf8'));
              assert.equal(verdict.sourceSha, process.env.SOURCE_SHA);
              assert.equal(verdict.success, true, `${mode} did not pass`);
            }
            assert.equal(process.env.UNIT_OUTCOME, 'success');
            assert.equal(process.env.SCENARIO_OUTCOME, 'success');
            assert.equal(process.env.PRIOR_JOB_STATUS, 'success');
            record.accepted = true;
          } catch (error) {
            record.accepted = false;
            record.sourceUnchanged ??= false;
            // Do not include arbitrary raw errors or report bodies in public provenance.
            record.error = 'Exact-source or mandatory supplemental result verification failed; see sanitized diagnostics.';
            core.setFailed(record.error);
          } finally {
            fs.writeFileSync(path.join(out, 'final-status.json'), JSON.stringify(record, null, 2));
            core.summary.addRaw(`Supplemental localization: ${record.accepted ? 'passed' : 'not accepted'}\nSource: ${record.sourceSha}\nTree: ${record.sourceTree}\nOne real web scenario; no native/device UI claim. Mandatory 22 release gates remain separate.\n`);
            await core.summary.write();
          }
    - name: Enforce final artifact filename, path and credential allowlist
