jobs:
  supplemental:
    name: Selected localization tests and real web scenario
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - name: Prepare isolated validation directories
      shell: bash
      run: 'set -euo pipefail

        umask 077

        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/v019-browsers"

        printf ''%s\n'' "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

        mkdir "$RUNNER_TEMP/v019-tools" "$RUNNER_TEMP/v019-private" "$RUNNER_TEMP/v019-evidence" "$PLAYWRIGHT_BROWSERS_PATH"

        '
    - name: Prepare source-reviewed root identity reporter
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/v019-tools/root-module-identity.mjs\" <<'ROOT_REPORTER'\nimport { createRequire } from 'node:module';\nimport { readFileSync, readdirSync, realpathSync, writeFileSync } from 'node:fs';\nimport { dirname, join } from 'node:path';\nimport { createHash } from 'node:crypto';\n\nexport function inspectGraphs(projects, paths) {\n  const result = {\n    schema: 1, host_pid: process.pid, observed: false, qualified: false,\n    stock_observed: false, observer_observed: false, client_observed: false,\n    stock_candidates: 0, observer_candidates: 0, client_candidates: 0,\n    stock_imports_client: false, observer_imports_client: false, same_client: false,\n    client_source_sha256: paths.clientHash, observer_source_sha256: paths.observerHash,\n  };\n  try {\n    if (!Array.isArray(projects) || projects.length === 0 || projects.length > 9) return result;\n    // Only identity lookup is scoped. No test/project execution is changed.\n    const matches\
        \ = projects.filter(p => p?.config?.name === '@t3tools/web (browser) (chromium)');\n    if (matches.length !== 1) return result;\n    const selected = matches[0];\n    if (realpathSync(selected.config.root) !== paths.webRoot ||\n        selected.config.browser?.enabled !== true ||\n        selected.config.browser?.name !== 'chromium') return result;\n    const graph = selected.browser?.vite?.moduleGraph;\n    if (!graph || typeof graph.getModulesByFile !== 'function') return result;\n    // getModuleById requires the exact dependency ?v= query. Public file lookup\n    // finds the actual graph nodes without resolving or transforming anything.\n    const candidate = (file) => {\n      const nodes = graph.getModulesByFile(file);\n      if (nodes === undefined) return { count: 0, node: undefined };\n      if (!(nodes instanceof Set)) throw Error('unavailable module set');\n      return { count: Math.min(nodes.size, 9), node: nodes.size === 1 ? nodes.values().next().value : undefined\
        \ };\n    };\n    const stockResult = candidate(paths.stock), observerResult = candidate(paths.observer), clientResult = candidate(paths.client);\n    const stock = stockResult.node, observer = observerResult.node, client = clientResult.node;\n    result.stock_candidates = stockResult.count;\n    result.observer_candidates = observerResult.count;\n    result.client_candidates = clientResult.count;\n    result.observed = true;\n    result.stock_observed = Boolean(stock);\n    result.observer_observed = Boolean(observer);\n    result.client_observed = Boolean(client);\n    result.stock_imports_client = Boolean(client && stock?.clientImportedModules?.has(client));\n    result.observer_imports_client = Boolean(client && observer?.clientImportedModules?.has(client));\n    result.same_client = result.stock_imports_client && result.observer_imports_client;\n    result.qualified = result.stock_observed && result.observer_observed && result.client_observed && result.same_client;\n  } catch\
        \ {\n    // No internal module IDs, URLs or exception text enter the output.\n  }\n  return result;\n}\n\nexport function resolveWebRoot(workspace = process.cwd()) {\n  const root = realpathSync(workspace);\n  const expected = join(root, 'apps', 'web');\n  const webRoot = realpathSync(expected);\n  if (webRoot !== expected || realpathSync(join(webRoot, 'package.json')) !== join(webRoot, 'package.json')) {\n    throw Error('unexpected web package root');\n  }\n  return webRoot;\n}\n\nexport function pathsFromWorkspace(workspace = process.cwd()) {\n  const webRoot = resolveWebRoot(workspace);\n  const require = createRequire(join(webRoot, 'package.json'));\n  const wrapper = realpathSync(require.resolve('vite-plus/test/client'));\n  const client = realpathSync(createRequire(wrapper).resolve('@vitest/browser/client'));\n  const entries = readdirSync(join(dirname(client), 'client', '__vitest_browser__'))\n    .filter(name => /^orchestrator-[A-Za-z0-9_-]+\\.js$/.test(name));\n  if (entries.length\
        \ !== 1) throw Error('ambiguous installed orchestrator');\n  const stock = realpathSync(join(dirname(client), 'client', '__vitest_browser__', entries[0]));\n  if (realpathSync(createRequire(stock).resolve('@vitest/browser/client')) !== client) throw Error('different installed client');\n  const observer = join(webRoot, 'virtual__t3code-orchestrator-observation.js');\n  const observerSource = join(webRoot, 'vite', 'orchestratorSocket.ts');\n  const clientBytes = readFileSync(client), observerBytes = readFileSync(observerSource), wrapperBytes = readFileSync(wrapper);\n  if (clientBytes.length > 256 * 1024 || wrapperBytes.length > 4096 || observerBytes.length > 16 * 1024) throw Error('module bounds');\n  if (wrapperBytes.toString('utf8').trim() !== \"export * from '@vitest/browser/client';\") throw Error('unexpected wrapper');\n  return { webRoot, observer, client, stock,\n    clientHash: createHash('sha256').update(clientBytes).digest('hex'),\n    observerHash: createHash('sha256').update(observerBytes).digest('hex')\
        \ };\n}\n\nexport default class ModuleIdentityReporter {\n  onInit(context) { this.context = context; }\n  onTestRunEnd() {\n    try {\n      const result = inspectGraphs(this.context?.projects, pathsFromWorkspace());\n      const output = join(process.env.RUNNER_TEMP, 'v019-private', 'module-identity.json');\n      const bytes = JSON.stringify(result) + '\\n';\n      if (Buffer.byteLength(bytes) > 4096) return;\n      writeFileSync(output, bytes, { flag: 'wx', mode: 0o600 });\n    } catch {\n      // Missing proof fails the separate qualification, never the test reporter path.\n    }\n  }\n}\nROOT_REPORTER\nprintf '%s  %s\n' \"$ROOT_REPORTER_SHA256\" \"$RUNNER_TEMP/v019-tools/root-module-identity.mjs\" | sha256sum --check --strict\n"
    - name: Prepare isolated helper contracts.mjs
      shell: bash
      run: "set -euo pipefail\numask 077\ncat > \"$RUNNER_TEMP/v019-tools/contracts.mjs\" <<'V019_NODE'\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport path from 'node:path';\nimport crypto from 'node:crypto';\n\nexport const REPOSITORY = 'ZhiweiXiao98/t3code';\nexport const SOURCE_BRANCH = 'maintenance/v0.1.9-zh-cloud';\nexport const OPERATION_BRANCH = 'validation/v0.1.9-zh.2-ui-74039745b1b4-canonical';\nexport const WORKFLOW_PATH = '.github/workflows/validate-v019-zh-ui.yml';\nexport const SCENARIO = 'scripts/scenarios/chinese-thread-menu.e2e.ts';\nexport const MAX_TEST_FILES = 330;\nexport const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');\nexport const json = file => JSON.parse(fs.readFileSync(file, 'utf8'));\nexport const writeJson = (file, value) => fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\\n`, {mode: 0o600});\nexport function relativeFile(value) {\n  assert.equal(typeof value, 'string');\n  assert(value.length\
        \ <= 300 && /^[A-Za-z0-9_./-]+$/.test(value));\n  assert(!value.startsWith('/') && !value.split('/').some(part => ['', '.', '..'].includes(part)));\n  return value;\n}\nexport function testFiles(value) {\n  const files = typeof value === 'string' ? JSON.parse(value) : value;\n  assert(Array.isArray(files) && files.length > 0 && files.length <= MAX_TEST_FILES);\n  assert.equal(new Set(files).size, files.length);\n  assert.deepEqual([...files].sort(), files, 'Test list must be sorted');\n  for (const file of files) {\n    relativeFile(file);\n    assert(['apps/mobile/app.config.test.ts', 'apps/mobile/plugins/withAppLocale.test.ts', 'packages/contracts/src/ipc.test.ts', 'packages/contracts/src/providerUsageLimits.test.ts', 'packages/contracts/src/updateFailureReason.test.ts'].includes(file) || /^(apps\\/(web|mobile|desktop)\\/src|packages\\/(shared|client-runtime)\\/src)\\/.+\\.test\\.tsx?$/.test(file), `Out-of-scope test: ${file}`);\n  }\n  assert(files.some(file => file.startsWith('apps/web/src/')\
        \ && /\\.browser\\.test\\.tsx?$/.test(file)), 'Actual Chromium browser tests are mandatory');\n  return files;\n}\nexport function frozen(env) {\n  assert.equal(env.SOURCE_BRANCH, SOURCE_BRANCH);\n  for (const key of ['SOURCE_SHA', 'SOURCE_TREE']) assert.match(env[key] ?? '', /^[0-9a-f]{40}$/);\n  for (const key of ['TEST_FILES_SHA256', 'SCENARIO_SHA256']) assert.match(env[key] ?? '', /^[0-9a-f]{64}$/);\n  const files = testFiles(env.TEST_FILES_JSON);\n  assert.equal(sha256(JSON.stringify(files)), env.TEST_FILES_SHA256);\n  const captures = JSON.parse(env.SCENARIO_CAPTURES_JSON);\n  assert(Array.isArray(captures) && captures.length >= 3 && captures.length <= 20);\n  assert.equal(new Set(captures).size, captures.length);\n  for (const capture of captures) assert.match(capture, /^[a-z][a-z0-9-]{2,70}$/);\n  return {files, captures};\n}\nexport function operationGuard({env, context, repository, sourceRef, sourceCommit, operationRef, operationCommit, comparison}) {\n  frozen(env);\n\
        \  assert.equal(`${context.repo.owner}/${context.repo.repo}`, REPOSITORY);\n  assert.equal(repository.full_name, REPOSITORY);\n  assert.equal(repository.private, false, 'Only free public repository runners');\n  assert.equal(context.eventName, 'push');\n  assert.equal(context.ref, `refs/heads/${OPERATION_BRANCH}`);\n  assert.match(context.sha, /^[0-9a-f]{40}$/);\n  assert.equal(sourceRef.object.sha, env.SOURCE_SHA, 'Source branch moved');\n  assert.equal(sourceCommit.sha, env.SOURCE_SHA);\n  assert.equal(sourceCommit.tree.sha, env.SOURCE_TREE);\n  assert.equal(operationRef.object.sha, context.sha, 'Operation branch moved');\n  assert.equal(operationCommit.sha, context.sha);\n  assert.deepEqual(operationCommit.parents.map(parent => parent.sha), [env.SOURCE_SHA], 'Operation must be one direct child of final source');\n  assert.equal(comparison.status, 'ahead');\n  assert.equal(comparison.ahead_by, 1);\n  assert.equal(comparison.behind_by, 0);\n  assert.equal(comparison.total_commits,\
        \ 1);\n  assert.deepEqual(comparison.commits.map(commit => commit.sha), [context.sha]);\n  assert.equal(comparison.files.length, 1);\n  assert.equal(comparison.files[0].filename, WORKFLOW_PATH);\n  assert.equal(comparison.files[0].status, 'added');\n  assert.match(comparison.files[0].sha, /^[0-9a-f]{40}$/);\n  return {operationSha: context.sha, operationTree: operationCommit.tree.sha, workflowBlob: comparison.files[0].sha};\n}\nexport function checkedFile(root, relative) {\n  relativeFile(relative);\n  const file = path.join(root, relative);\n  let current = root;\n  for (const segment of relative.split('/')) {\n    current = path.join(current, segment);\n    assert(!fs.lstatSync(current).isSymbolicLink(), 'No symlink paths in evidence or source files');\n  }\n  assert(fs.statSync(file).isFile());\n  assert(fs.realpathSync(file).startsWith(`${fs.realpathSync(root)}${path.sep}`));\n  return file;\n}\nexport function safeEnv(host, {home, browserPath, temp}) {\n  for (const value of\
        \ [home, browserPath, temp]) assert(path.isAbsolute(value));\n  // Deliberate positive allowlist. Never spread host into a child process.\n  const env = {};\n  for (const key of ['PATH', 'LANG', 'LC_ALL', 'LC_CTYPE', 'TZ', 'DISPLAY', 'WAYLAND_DISPLAY']) {\n    if (typeof host[key] === 'string') env[key] = host[key];\n  }\n  assert(env.PATH && path.isAbsolute(env.PATH.split(path.delimiter)[0]));\n  Object.assign(env, {\n    HOME: home, XDG_CONFIG_HOME: path.join(home, '.config'), XDG_CACHE_HOME: path.join(home, '.cache'),\n    XDG_DATA_HOME: path.join(home, '.local/share'), XDG_STATE_HOME: path.join(home, '.local/state'),\n    TMPDIR: temp, TMP: temp, TEMP: temp, CI: '1', NO_COLOR: '1', FORCE_COLOR: '0',\n    E2E_TELEMETRY_DISABLED: '1', DO_NOT_TRACK: '1', PLAYWRIGHT_BROWSERS_PATH: browserPath,\n    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1', PLAYWRIGHT_SKIP_BROWSER_GC: '1',\n    T3CODE_AUTO_BOOTSTRAP_PROJECT_FROM_CWD: '0', T3CODE_DEV_SEED: '0',\n    GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL:\
        \ '/dev/null', GIT_TERMINAL_PROMPT: '0',\n  });\n  return env;\n}\nexport function credentialValues(repo) {\n  const credentialFile = path.join(repo, '.t3/scenarios/pairing-path');\n  if (!fs.existsSync(credentialFile)) return [];\n  const value = fs.readFileSync(credentialFile, 'utf8').trim();\n  const url = new URL(value, 'http://127.0.0.1');\n  const secrets = [value, url.href];\n  for (const [key, item] of url.searchParams) if (/token|code|secret|key|credential/i.test(key)) secrets.push(item);\n  const hashParams = new URLSearchParams(url.hash.replace(/^#/, ''));\n  for (const [key, item] of hashParams) if (/token|code|secret|key|credential/i.test(key)) secrets.push(item);\n  return secrets.filter(value => value.length >= 8).sort((a, b) => b.length - a.length);\n}\nexport function sanitize(value, credentials = []) {\n  let clean = String(value).replace(/\\u001b\\[[0-9;]*m/g, '');\n  for (const secret of credentials) {\n    for (const version of [secret, encodeURIComponent(secret)])\
        \ clean = clean.split(version).join('[REDACTED]');\n  }\n  // Redact the whole pairing/navigation label, not just its query argument.\n  clean = clean.replace(/[^\\s\"'<>]*(?:token|pairing|auth[_-]?code|credential|secret)[^\\s\"'<>]*[=:][^\\s\"'<>]+/gi, '[REDACTED-CREDENTIAL]');\n  clean = clean.replace(/\\b[A-Fa-f0-9]{64}\\b/g, '[REDACTED-OPAQUE]');\n  clean = clean.replace(/\\b(?:gh[pousr]_|github_pat_|sk-)[A-Za-z0-9_-]+\\b/g, '[REDACTED-SECRET]');\n  for (const secret of credentials) assert(!clean.includes(secret));\n  return clean;\n}\nexport function scenarioArgs() {\n  return ['run', SCENARIO.slice('scripts/'.length), '--target', 'web', '--workers', '1', '--retries', '0', '--repeat-each', '1', '--no-cache', '--trace', 'off', '--video', 'off', '--reporter', 'list', '--output', '.e2e'];\n}\nexport function inspectReport(report, {startedAt, sourceSha, captures, credentials = []}) {\n  assert.equal(report.schemaVersion, 'report-1');\n  const run = report.run;\n  assert.equal(run.runner.version,\
        \ '0.23.0');\n  assert(Date.parse(run.startedAt) >= startedAt - 1000, 'Stale scenario result');\n  assert(run.finishedAt && Date.parse(run.finishedAt) >= Date.parse(run.startedAt));\n  // e2e reports every declared target, including unselected iOS; only web may execute.\n  assert.deepEqual(run.targets.map(t => [t.id, t.platform]), [['web', 'web'], ['ios', 'ios']]);\n  assert.equal(run.targets[0].engine.name, 'web');\n  assert.equal(run.targets[0].engine.version, '0.15.5');\n  assert.equal(run.summary.selected, 1);\n  assert(run.results.every(result => result.targetId === 'web' || (result.attempts.length === 0 && result.selected === false)), 'No selected or executed mobile target');\n  if (run.vcs) {\n    assert.equal(run.vcs.commit, sourceSha);\n    assert.notEqual(run.vcs.dirty, true);\n  }\n  assert(!run.carried, 'No reused previous results');\n  assert.equal(run.serialGroups.length, 0);\n  assert.equal(run.usage.modelTokens, 0);\n  assert.equal(run.usage.maxModelCallsInStep, 0);\n\
        \  assert.equal(run.usage.estimatedCostUsd ?? 0, 0);\n  const executed = run.results.filter(result => result.attempts.length > 0);\n  assert.equal(executed.length, 1, 'Exactly one executed scenario required');\n  const result = executed[0];\n  assert.equal(result.file, SCENARIO.slice('scripts/'.length));\n  assert.equal(result.kind, 'test');\n  assert.equal(result.platform, 'web');\n  assert.equal(result.targetId, 'web');\n  assert(!result.expectedFailure);\n  assert([undefined, 'default'].includes(result.agent), 'No configured model agent');\n  assert.equal(result.attempts.length, 1, 'Retries are prohibited');\n  assert.equal(result.repeat ?? 0, 0);\n  const attempt = result.attempts[0];\n  assert.equal(attempt.index, 0);\n  assert(!attempt.expectedFailure);\n  const captureSteps = [];\n  for (const step of attempt.steps) {\n    assert(step.kind !== 'agent' && !step.api.startsWith('agent.') && !step.model, 'No paid model or agent assertions');\n    assert.equal(step.metrics?.modelCalls\
        \ ?? 0, 0);\n    if (step.api === 'app.screenshot' && captures.includes(step.label) && step.status === 'passed') captureSteps.push(step);\n  }\n  const screenshots = [];\n  for (const step of captureSteps) {\n    const artifacts = attempt.artifacts.filter(a => a.kind === 'screenshot' && a.producer?.kind === 'step' && a.producer.stepId === step.id);\n    assert.equal(artifacts.length, 1);\n    const artifact = artifacts[0];\n    assert.equal(artifact.redaction, 'complete');\n    assert.equal(artifact.mediaType, 'image/png');\n    relativeFile(artifact.path);\n    assert(artifact.path.endsWith('.png') && artifact.size > 0);\n    assert.match(artifact.sha256, /^[a-f0-9]{64}$/);\n    screenshots.push({label: step.label, artifact});\n  }\n  assert.equal(new Set(screenshots.map(item => item.label)).size, screenshots.length);\n  const passed = run.status === 'passed' && run.exitCode === 0 && result.status === 'passed' && attempt.status === 'passed' && attempt.cleanup === 'complete' && run.errors.length\
        \ === 0 && attempt.secondaryErrors.length === 0 && !attempt.error;\n  if (passed) {\n    assert.deepEqual(screenshots.map(s => s.label).sort(), [...captures].sort(), 'All reviewed screenshots are mandatory for success');\n    assert.equal(run.summary.executed, 1);\n    assert.equal(run.summary.passed, 1);\n    assert.equal(run.summary.failed + run.summary.flaky + run.summary.interrupted, 0);\n  }\n  return {passed, screenshots, report: {\n    schema: 'sanitized-v019-scenario-1', sourceSha, runId: run.id,\n    startedAt: run.startedAt, finishedAt: run.finishedAt,\n    target: 'web', runner: 'e2e@0.23.0', engine: '@e2e-dev/web@0.15.5',\n    runStatus: run.status, exitCode: run.exitCode, resultStatus: result.status, attemptStatus: attempt.status,\n    cleanup: attempt.cleanup, noModelCalls: true, noRetries: true,\n    title: sanitize(result.titlePath.join(' > '), credentials),\n    error: attempt.error ? sanitize(`${attempt.error.code}: ${attempt.error.message}`, credentials) : undefined,\n\
        \    steps: attempt.steps.map(s => ({api: s.api, label: sanitize(s.label, credentials), status: s.status})),\n    exportedCaptures: screenshots.map(s => s.label),\n    excluded: 'Raw report, app log, traces, automatic failure screenshots, sessions, credentials and all .t3/HOME. Video disabled because upstream marks it unredacted.',\n    scope: 'One real web scenario plus separately listed localization unit/browser tests. Not native/device UI or the mandatory separate 21 release gates.',\n  }};\n}\n\nV019_NODE\n"
