        \ safeEnv(process.env, {home, temp, browserPath: process.env.PLAYWRIGHT_BROWSERS_PATH});\nlet command, args, cwd;\nif (mode === 'unit') {\n  const observerDir=path.join(privateRoot,'unit-browser-lifecycle');\n  try {fs.mkdirSync(observerDir,{mode:0o700});} catch {console.warn('Observer directory unavailable; original tests still run');}\n  env.T3CODE_BROWSER_LIFECYCLE_DIR=observerDir;\n  env.RUNNER_TEMP=process.env.RUNNER_TEMP;\n  assert.equal(process.version, 'v26.12.1');\n  const vp = fs.realpathSync(path.join(root, 'node_modules/vite-plus/package.json'));\n  assert.equal(json(vp).version, '1.4.0');\n  const pkg = createRequire(vp).resolve('vitest/package.json');\n  const meta = json(pkg); assert.equal(meta.version, '5.0.5');\n  const cli = path.resolve(path.dirname(pkg), typeof meta.bin === 'string' ? meta.bin : meta.bin.vitest);\n  assert(fs.statSync(cli).isFile());\n  const binding = {root, output: path.join(privateRoot, 'unit-progress.json'), sourceSha: process.env.SOURCE_SHA,\
        \ runId: process.env.GITHUB_RUN_ID, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), subsetId: 'full-reviewed', reviewedFiles: files, selectedFiles: files};\n  const config = path.join(privateRoot, 'unit-progress-config.json'); writeJson(config, binding);\n  Object.assign(env, {T3_MOBILE_TEST_PLATFORM: 'ios', V019_DIAGNOSTIC_CONFIG: config, JS_RUNTIME_VERSION: '26.12.1', JS_RUNTIME_NAME: 'node', NODE_PACKAGE_MANAGER: 'vite-plus'});\n  env.PATH = path.dirname(process.execPath) + path.delimiter + env.PATH;\n  command = process.execPath; cwd = root;\n  args = [cli, 'run', ...files, '--maxWorkers=2', '--retry=0', '--reporter=default', '--reporter=json', '--reporter=junit', `--reporter=${path.join(import.meta.dirname, 'root-module-identity.mjs')}`, `--reporter=${path.join(import.meta.dirname, 'incremental-reporter.mjs')}`, `--outputFile.json=${path.join(privateRoot, 'unit.json')}`, `--outputFile.junit=${path.join(privateRoot, 'junit.xml')}`];\n} else {\n  command = process.execPath;\
        \ cwd = path.join(root, 'scripts');\n  const cli = path.join(root, 'scripts/node_modules/e2e/dist/cli/bin.js');\n  assert(fs.statSync(cli).isFile());\n  assert.equal(json(path.join(root, 'scripts/node_modules/e2e/package.json')).version, '0.23.0');\n  assert.equal(sha256(fs.readFileSync(checkedFile(root, SCENARIO))), process.env.SCENARIO_SHA256);\n  for (const item of ['scripts/.e2e', '.t3/scenarios', '.t3/scenarios-mobile']) assert(!fs.existsSync(path.join(root, item)), 'Scenario state/output must be fresh');\n  args = [cli, ...scenarioArgs()];\n}\nwriteJson(path.join(publicRoot, `${mode}-environment.json`), {inheritedKeys: Object.keys(env).sort(), isolatedHome: true, noAmbientCredentials: true});\nwriteJson(path.join(publicRoot, `${mode}-command.json`), {command: mode === 'unit' ? 'verified Node26.12.1 + vite-plus dependency Vitest5.0.5' : 'node scripts/node_modules/e2e/dist/cli/bin.js', args: mode === 'unit' ? args.map(arg => arg.replaceAll(privateRoot, '<private-output>')) :\
        \ scenarioArgs(), cwd: mode === 'unit' ? '.' : 'scripts', scope: 'Supplemental selected localization validation, not all tests or native/device UI'});\nconst startedAt = Date.now();\nconst rawLog = path.join(privateRoot, `${mode}.raw.log`);\nconst fd = fs.openSync(rawLog, 'wx', 0o600);\nconst child = spawn(command, args, {cwd, env, shell: false, detached: true, stdio: ['ignore', fd, fd]});\nlet timedOut = false;\nlet killTimer;\nconst stop = () => {\n  if (!child.pid) return;\n  try {process.kill(-child.pid, 'SIGTERM');} catch {}\n  killTimer = setTimeout(() => {try {process.kill(-child.pid, 'SIGKILL');} catch {}}, 15_000);\n};\nconst timeout = setTimeout(() => {timedOut = true; stop();}, (mode === 'unit' ? 16 : 7) * 60_000);\nconst forward = () => stop();\nprocess.once('SIGTERM', forward);\nprocess.once('SIGINT', forward);\nconst result = await new Promise(resolve => {\n  child.once('error', error => resolve({code: null, signal: null, spawnError: error.code ?? 'spawn-error'}));\n\
