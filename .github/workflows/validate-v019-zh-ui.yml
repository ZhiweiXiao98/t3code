      run: "set -euo pipefail\numask 077\ncat > \"$RUNNER_TEMP/v019-tools/incremental-reporter.mjs\" <<'V019_NODE'\nimport fs from 'node:fs';\nimport path from 'node:path';\nimport crypto from 'node:crypto';\n\nconst states = ['passed', 'failed', 'skipped', 'pending', 'todo'];\nconst counts = () => Object.fromEntries(states.map(s => [s, 0]));\nfunction requireThat(condition, code) { if (!condition) throw new Error(`diagnostic:${code}`); }\nfunction fileList(value) {\n  requireThat(Array.isArray(value) && value.length > 0 && value.length <= 330, 'file-list');\n  requireThat(new Set(value).size === value.length, 'duplicate-path');\n  requireThat(value.every(s => typeof s === 'string' && s.length <= 300 && /^[A-Za-z0-9_./-]+\\.test\\.[cm]?[jt]sx?$/.test(s) && !s.startsWith('/') && !s.split('/').some(p => ['', '.', '..'].includes(p))), 'unsafe-path');\n  requireThat(JSON.stringify(value) === JSON.stringify([...value].sort()), 'unsorted-paths');\n  return value;\n}\n/** Atomic replacement on\
