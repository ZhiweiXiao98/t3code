        \ = new Map();\n    for (const [signal, code] of [['SIGTERM', 143], ['SIGINT', 130]]) {\n      const handler = () => { this.phase = 'interrupted'; this.signal = signal; this.flush(); process.exit(code); };\n      this.signals.set(signal, handler); process.on(signal, handler);\n    }\n    this.exitHandler = () => { if (!['ended', 'interrupted'].includes(this.phase)) this.phase = 'exited-incomplete'; this.flush(); };\n    process.on('exit', this.exitHandler);\n    this.flush();\n  }\n  dispose() { for (const [signal, handler] of this.signals) process.off(signal, handler); process.off('exit', this.exitHandler); }\n  guard(action) {\n    try { requireThat(!this.fault, 'previous-fault'); return action(); }\n    catch (error) { if (!this.fault) this.fault = /^diagnostic:[a-z-]+$/.test(error.message) ? error.message.slice(11) : 'api-or-io-failure'; this.flush(); throw new Error(`diagnostic:${this.fault}`); }\n  }\n  identify(entity) {\n    requireThat(typeof entity.moduleId === 'string'\
        \ && path.isAbsolute(entity.moduleId), 'invalid-module-path');\n    const file = path.relative(this.root, entity.moduleId);\n    requireThat(path.join(this.root, file) === entity.moduleId && this.selected.includes(file), 'unexpected-module');\n    return file;\n  }\n  observe(module) {\n    const file = this.identify(module); const row = this.rows.get(file);\n    const next = new Map(); const total = counts();\n    for (const test of module.children.allTests()) {\n      requireThat(typeof test.id === 'string' && !next.has(test.id), 'duplicate-test');\n      let state = test.result().state;\n      requireThat(states.includes(state) && state !== 'todo', 'invalid-test-state');\n      if (test.options.mode === 'todo') { requireThat(state === 'skipped', 'contradictory-todo'); state = 'todo'; }\n      next.set(test.id, state); total[state]++;\n    }\n    const previous = this.previousTests.get(file);\n    if (previous) {\n      requireThat(previous.size === next.size && [...previous.keys()].every(id\
        \ => next.has(id)), 'changed-collection');\n      for (const [id, state] of previous) requireThat(state === 'pending' || state === next.get(id), 'contradictory-test-state');\n    }\n    this.previousTests.set(file, next);\n    row.counts = total;\n    row.moduleErrorCount = module.errors().length;\n    row.moduleState = module.state();\n    requireThat(['queued', 'pending', 'passed', 'failed', 'skipped'].includes(row.moduleState), 'invalid-module-state');\n    requireThat(!(row.moduleState === 'passed' && (total.failed || row.moduleErrorCount)), 'contradictory-module-state');\n  }\n  flush() {\n    const files = [...this.rows.values()].map(row => ({...row, status: !row.selected ? 'not-selected' : row.ended ? 'ended' : row.queued || row.collected || row.started ? 'in-flight' : 'missing'}));\n    const totals = counts();\n    for (const row of files) if (row.counts) for (const state of states) totals[state] += row.counts[state];\n    atomicSnapshot(this.options.output, {\n      schema:\
