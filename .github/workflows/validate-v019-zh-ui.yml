    - name: Prepare isolated helper progress-public.mjs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        cat > "$RUNNER_TEMP/v019-tools/progress-public.mjs" <<'V019_NODE'
        import assert from 'node:assert/strict';
        import {createHash} from 'node:crypto';
        const hash=x=>createHash('sha256').update(JSON.stringify(x)).digest('hex');
        const number=x=>{assert(Number.isSafeInteger(x)&&x>=0&&x<=10000000);return x;};
        const nullableNumber=x=>x===null?null:number(x);
        const enumeration=(x,allowed)=>{assert(allowed.includes(x));return x;};
        const bool=x=>{assert.equal(typeof x,'boolean');return x;};
        const timestamp=x=>{assert(typeof x==='string'&&/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z$/.test(x));return x;};
        const countNames=['passed','failed','skipped','pending','todo'];
        const counts=x=>Object.fromEntries(countNames.map(k=>[k,number(x[k])]));
        export function publicProgress(s,{sourceSha,runId,runAttempt,subsetId,reviewedFiles,selectedFiles}) {
         assert.equal(s.schema,'v019-vitest-incremental-1'); assert.equal(s.runner,'vitest@5.0.5');
         for(const [key,value] of Object.entries({sourceSha,runId,runAttempt,subsetId,reviewedCount:reviewedFiles.length,selectedCount:selectedFiles.length,reviewedFilesSha256:hash(reviewedFiles),selectedFilesSha256:hash(selectedFiles),diagnosticOnly:true,releaseAccepted:false}))assert.deepEqual(s[key],value);
         assert.deepEqual(s.files.map(x=>x.file),reviewedFiles);
         const files=s.files.map(x=>{const row={file:x.file,selected:bool(x.selected),queued:bool(x.queued),collected:bool(x.collected),started:bool(x.started),ended:bool(x.ended),counts:x.counts===null?null:counts(x.counts),moduleState:enumeration(x.moduleState,[null,'queued','pending','passed','failed','skipped']),moduleErrorCount:number(x.moduleErrorCount),hookStarts:number(x.hookStarts),hookEnds:number(x.hookEnds),activeHooks:Object.fromEntries(['beforeAll','afterAll','beforeEach','afterEach'].map(k=>[k,number(x.activeHooks[k])])),status:enumeration(x.status,['not-selected','missing','in-flight','ended'])};assert.equal(row.selected,selectedFiles.includes(row.file));for(const e of ['queued','collected','started','ended'])if(x[e+'At']!==undefined)row[e+'At']=timestamp(x[e+'At']);return row;});
         const expectedScope=selectedFiles.length===reviewedFiles.length?'reviewed-set':'diagnostic-subset';assert.equal(s.scope,expectedScope);
         const totals=Object.fromEntries(countNames.map(k=>[k,0]));
         for(const row of files){
          assert.equal(row.status,!row.selected?'not-selected':row.ended?'ended':row.queued||row.collected||row.started?'in-flight':'missing');
          assert(!row.collected||row.queued);assert(!row.started||row.queued);assert(!row.ended||row.started);
          for(const e of ['queued','collected','started','ended'])assert.equal(row[e],row[e+'At']!==undefined);
          assert(row.hookEnds<=row.hookStarts);assert.equal(Object.values(row.activeHooks).reduce((a,b)=>a+b,0),row.hookStarts-row.hookEnds);
          if(!row.selected)assert(!row.queued&&!row.collected&&!row.started&&!row.ended&&row.counts===null&&row.moduleState===null&&row.moduleErrorCount===0&&row.hookStarts===0);
          if(row.ended)assert(['passed','failed','skipped'].includes(row.moduleState));
          if(row.counts){for(const k of countNames)totals[k]+=row.counts[k];if(row.moduleState==='passed')assert(row.counts.failed===0&&row.moduleErrorCount===0);}
         }
         assert.deepEqual(counts(s.observedCounts),totals);
         assert.deepEqual(s.missing,files.filter(f=>f.status==='missing').map(f=>f.file));
         assert.deepEqual(s.inFlight,files.filter(f=>f.status==='in-flight').map(f=>f.file));
         assert.deepEqual(s.failedModules,files.filter(f=>f.moduleState==='failed'||f.moduleErrorCount>0).map(f=>f.file));
         assert.equal(s.countsComplete,s.integrityError===null&&s.phase==='ended'&&files.filter(f=>f.selected).every(f=>f.ended&&f.counts!==null&&f.counts.pending===0));
         const list=k=>{assert(Array.isArray(s[k])&&new Set(s[k]).size===s[k].length&&s[k].every(f=>selectedFiles.includes(f)));return s[k];};
         assert([null, 'absolute-paths', 'api-or-io-failure', 'case-outside-module', 'changed-collection', 'collection-after-start', 'contradictory-module-state', 'contradictory-run-result', 'contradictory-test-state', 'contradictory-todo', 'duplicate-case-result', 'duplicate-final-module', 'duplicate-or-late-event', 'duplicate-path', 'duplicate-run', 'duplicate-test', 'end-before-start', 'event-before-queue', 'event-outside-run', 'file-list', 'fresh-output-required', 'hook-end-before-start', 'hook-outside-module', 'invalid-hook', 'invalid-module-path', 'invalid-module-state', 'invalid-run-end', 'invalid-test-state', 'nonterminal-module-end', 'omitted-final-module', 'pending-case-result', 'previous-fault', 'run-attempt', 'run-id', 'runner-version', 'source-sha', 'specification-mismatch', 'subset-id', 'unended-final-module', 'unexpected-module', 'unreviewed-selection', 'unsafe-path', 'unsorted-paths'].includes(s.integrityError));
         return {schema:s.schema,runner:s.runner,sourceSha,runId,runAttempt,subsetId,diagnosticOnly:true,releaseAccepted:false,scope:enumeration(s.scope,['reviewed-set','diagnostic-subset']),reviewedCount:reviewedFiles.length,selectedCount:selectedFiles.length,reviewedFilesSha256:s.reviewedFilesSha256,selectedFilesSha256:s.selectedFilesSha256,sequence:number(s.sequence),updatedAt:timestamp(s.updatedAt),phase:enumeration(s.phase,['initialized','running','ended','interrupted','exited-incomplete']),signal:enumeration(s.signal,[null,'SIGTERM','SIGINT']),integrityError:s.integrityError,runEndReason:enumeration(s.runEndReason,[null,'passed','failed','interrupted']),unhandledErrorCount:nullableNumber(s.unhandledErrorCount),observedCounts:counts(s.observedCounts),countsComplete:bool(s.countsComplete),missing:list('missing'),inFlight:list('inFlight'),failedModules:list('failedModules'),files};
        }

