/toast.browser.test.tsx\",\"apps/web/src/components/usage/UsageLimitsPooled.browser.test.tsx\",\"apps/web/src/composerDraftStore.test.ts\",\"apps/web/src/contextMenuFallback.keyboard.browser.test.ts\",\"apps/web/src/contextMenuFallback.test.ts\",\"apps/web/src/hooks/useThreadActionMenu.test.ts\",\"apps/web/src/i18n/connectAgentMessages.test.ts\",\"apps/web/src/i18n/messages.test.ts\",\"apps/web/src/i18n/voiceSettingsMessages.test.ts\",\"apps/web/src/lib/openPullRequestLink.browser.test.tsx\",\"apps/web/src/speech/browserMicrophones.test.ts\",\"apps/web/src/timestampFormat.test.ts\",\"packages/client-runtime/src/state/threadSnoozed.test.ts\"]"
