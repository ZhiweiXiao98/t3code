    - name: Prepare isolated helper audit-artifacts.mjs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        cat > "$RUNNER_TEMP/v019-tools/audit-artifacts.mjs" <<'V019_NODE'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        import path from 'node:path';
        import {checkedFile, credentialValues, frozen, sha256, writeJson} from './contracts.mjs';
        const out = path.join(process.env.RUNNER_TEMP, 'v019-evidence');
        const {captures} = frozen(process.env);
        const allowed = new Set(['provenance.json', 'runtime.json', 'final-status.json', 'unit-summary.json', 'unit-progress.json', 'junit.xml', 'scenario-report.json', ...['unit','scenario'].flatMap(mode => [`${mode}-environment.json`, `${mode}-command.json`, `${mode}.log`, `${mode}-exit.json`, `${mode}-verification-error.json`, `${mode}-verdict.json`]), ...captures.map(label => `${label}.png`)]);
        const credentials = credentialValues(process.cwd());
        const inventory = [];
        for (const name of fs.readdirSync(out)) {
          assert(allowed.has(name), 'Unexpected artifact name; nothing will be uploaded');
          const file = checkedFile(out, name);
          const bytes = fs.readFileSync(file);
          assert(bytes.length <= 64 * 1024 * 1024);
          if (!name.endsWith('.png')) {
            const text = bytes.toString('utf8');
            for (const secret of credentials) assert(!text.includes(secret) && !text.includes(encodeURIComponent(secret)), 'Credential in public output');
            assert(!/\b(?:gh[pousr]_|github_pat_|sk-)[A-Za-z0-9_-]+\b/.test(text), 'Credential pattern in public output');
            assert(!/[?&#](?:token|access_token|auth_code|secret)=[^\s"<>]+/i.test(text), 'Pairing URL in public output');
          }
          inventory.push({file: name, bytes: bytes.length, sha256: sha256(bytes)});
        }
        assert(inventory.some(file => file.file === 'final-status.json'));
        writeJson(path.join(out, 'artifact-manifest.json'), {sourceSha: process.env.SOURCE_SHA, sourceTree: process.env.SOURCE_TREE, files: inventory, screenshots: 'Only explicit, reviewed post-authentication page.screenshot PNGs. No browser chrome, desktop capture or automatic failure capture.', excluded: 'All raw e2e reports, app logs, sessions, traces, videos, .t3 state and HOME credentials.'});
        console.log(`Artifact privacy allowlist passed (${inventory.length} files).`);

        V019_NODE
    - name: Prepare isolated helper incremental-reporter.mjs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        cat > "$RUNNER_TEMP/v019-tools/incremental-reporter.mjs" <<'V019_NODE'
        import fs from 'node:fs';
        import path from 'node:path';
        import crypto from 'node:crypto';

        const states = ['passed', 'failed', 'skipped', 'pending', 'todo'];
        const counts = () => Object.fromEntries(states.map(s => [s, 0]));
        function requireThat(condition, code) { if (!condition) throw new Error(`diagnostic:${code}`); }
        function fileList(value) {
          requireThat(Array.isArray(value) && value.length > 0 && value.length <= 256, 'file-list');
          requireThat(new Set(value).size === value.length, 'duplicate-path');
          requireThat(value.every(s => typeof s === 'string' && s.length <= 300 && /^[A-Za-z0-9_./-]+\.test\.[cm]?[jt]sx?$/.test(s) && !s.startsWith('/') && !s.split('/').some(p => ['', '.', '..'].includes(p))), 'unsafe-path');
          requireThat(JSON.stringify(value) === JSON.stringify([...value].sort()), 'unsorted-paths');
          return value;
        }
        /** Atomic replacement on the same filesystem. Caller supplies a fresh private directory. */
        export function atomicSnapshot(output, data) {
          const tmp = `${output}.next`;
          const fd = fs.openSync(tmp, 'wx', 0o600);
          try { fs.writeFileSync(fd, JSON.stringify(data, null, 2) + '\n'); fs.fsyncSync(fd); }
          finally { fs.closeSync(fd); }
          fs.renameSync(tmp, output);
          const dir = fs.openSync(path.dirname(output), 'r');
          try { fs.fsyncSync(dir); } finally { fs.closeSync(dir); }
        }
        export default class IncrementalReporter {
          constructor(options) {
            this.options = options?.reviewedFiles ? options : JSON.parse(fs.readFileSync(process.env.V019_DIAGNOSTIC_CONFIG, 'utf8'));
            const o = this.options;
            this.reviewed = fileList(o.reviewedFiles);
            this.selected = fileList(o.selectedFiles);
            requireThat(this.selected.every(f => this.reviewed.includes(f)), 'unreviewed-selection');
            requireThat(/^[a-f0-9]{40}$/.test(o.sourceSha), 'source-sha');
            requireThat(path.isAbsolute(o.root) && path.isAbsolute(o.output), 'absolute-paths');
            requireThat(typeof o.runId === 'string' && /^[0-9]{1,24}$/.test(o.runId), 'run-id');
            requireThat(Number.isInteger(o.runAttempt) && o.runAttempt > 0, 'run-attempt');
            requireThat(typeof o.subsetId === 'string' && /^[a-z0-9-]{1,60}$/.test(o.subsetId), 'subset-id');
            this.root = fs.realpathSync(o.root);
            requireThat(!fs.existsSync(o.output) && !fs.existsSync(`${o.output}.next`), 'fresh-output-required');
            this.rows = new Map(this.reviewed.map(file => [file, {file, selected: this.selected.includes(file), queued: false, collected: false, started: false, ended: false, activeHooks: {beforeAll:0,afterAll:0,beforeEach:0,afterEach:0}, hookStarts:0, hookEnds:0, counts: null, moduleState: null, moduleErrorCount: 0}]));
            this.refs = new Map(); this.previousTests = new Map(); this.caseEvents = new Set();
            this.phase = 'initialized'; this.sequence = 0; this.fault = null; this.unhandledErrorCount = null;
            this.signals = new Map();
            for (const [signal, code] of [['SIGTERM', 143], ['SIGINT', 130]]) {
              const handler = () => { this.phase = 'interrupted'; this.signal = signal; this.flush(); process.exit(code); };
              this.signals.set(signal, handler); process.on(signal, handler);
            }
            this.exitHandler = () => { if (!['ended', 'interrupted'].includes(this.phase)) this.phase = 'exited-incomplete'; this.flush(); };
            process.on('exit', this.exitHandler);
            this.flush();
          }
          dispose() { for (const [signal, handler] of this.signals) process.off(signal, handler); process.off('exit', this.exitHandler); }
          guard(action) {
            try { requireThat(!this.fault, 'previous-fault'); return action(); }
            catch (error) { if (!this.fault) this.fault = /^diagnostic:[a-z-]+$/.test(error.message) ? error.message.slice(11) : 'api-or-io-failure'; this.flush(); throw new Error(`diagnostic:${this.fault}`); }
          }
          identify(entity) {
            requireThat(typeof entity.moduleId === 'string' && path.isAbsolute(entity.moduleId), 'invalid-module-path');
            const file = path.relative(this.root, entity.moduleId);
            requireThat(path.join(this.root, file) === entity.moduleId && this.selected.includes(file), 'unexpected-module');
            return file;
          }
          observe(module) {
            const file = this.identify(module); const row = this.rows.get(file);
            const next = new Map(); const total = counts();
            for (const test of module.children.allTests()) {
              requireThat(typeof test.id === 'string' && !next.has(test.id), 'duplicate-test');
              let state = test.result().state;
              requireThat(states.includes(state) && state !== 'todo', 'invalid-test-state');
              if (test.options.mode === 'todo') { requireThat(state === 'skipped', 'contradictory-todo'); state = 'todo'; }
              next.set(test.id, state); total[state]++;
            }
            const previous = this.previousTests.get(file);
            if (previous) {
              requireThat(previous.size === next.size && [...previous.keys()].every(id => next.has(id)), 'changed-collection');
              for (const [id, state] of previous) requireThat(state === 'pending' || state === next.get(id), 'contradictory-test-state');
            }
            this.previousTests.set(file, next);
            row.counts = total;
            row.moduleErrorCount = module.errors().length;
            row.moduleState = module.state();
            requireThat(['queued', 'pending', 'passed', 'failed', 'skipped'].includes(row.moduleState), 'invalid-module-state');
            requireThat(!(row.moduleState === 'passed' && (total.failed || row.moduleErrorCount)), 'contradictory-module-state');
          }
          flush() {
            const files = [...this.rows.values()].map(row => ({...row, status: !row.selected ? 'not-selected' : row.ended ? 'ended' : row.queued || row.collected || row.started ? 'in-flight' : 'missing'}));
            const totals = counts();
            for (const row of files) if (row.counts) for (const state of states) totals[state] += row.counts[state];
            atomicSnapshot(this.options.output, {
              schema: 'v019-vitest-incremental-1', runner: 'vitest@5.0.5', sourceSha: this.options.sourceSha,
              runId: this.options.runId, runAttempt: this.options.runAttempt, subsetId: this.options.subsetId,
              reviewedFilesSha256: crypto.createHash('sha256').update(JSON.stringify(this.reviewed)).digest('hex'),
              selectedFilesSha256: crypto.createHash('sha256').update(JSON.stringify(this.selected)).digest('hex'),
              diagnosticOnly: true, releaseAccepted: false, scope: this.selected.length === this.reviewed.length ? 'reviewed-set' : 'diagnostic-subset',
              sequence: ++this.sequence, updatedAt: new Date().toISOString(), phase: this.phase, signal: this.signal ?? null,
              integrityError: this.fault, runEndReason: this.reason ?? null, unhandledErrorCount: this.unhandledErrorCount,
              reviewedCount: this.reviewed.length, selectedCount: this.selected.length, observedCounts: totals,
              countsComplete: !this.fault && this.phase === 'ended' && files.filter(f => f.selected).every(f => f.ended && f.counts && f.counts.pending === 0),
              missing: files.filter(f => f.status === 'missing').map(f => f.file),
              inFlight: files.filter(f => f.status === 'in-flight').map(f => f.file),
              failedModules: files.filter(f => f.moduleState === 'failed' || f.moduleErrorCount > 0).map(f => f.file), files,
            });
          }
          onInit(vitest) { this.guard(() => { requireThat(vitest.version === '5.0.5', 'runner-version'); }); }
          onTestRunStart(specs) { this.guard(() => {
            requireThat(this.phase === 'initialized', 'duplicate-run');
            const actual = specs.map(s => this.identify(s)).sort();
            requireThat(JSON.stringify(actual) === JSON.stringify(this.selected), 'specification-mismatch');
            this.phase = 'running'; this.flush();
          }); }
          event(module, event) { this.guard(() => {
            requireThat(this.phase === 'running', 'event-outside-run');
            const file = this.identify(module), row = this.rows.get(file);
            requireThat(!row[event] && !row.ended, 'duplicate-or-late-event');
            if (event !== 'queued') requireThat(row.queued, 'event-before-queue');
            if (event === 'collected') requireThat(!row.started, 'collection-after-start');
            if (event === 'ended') requireThat(row.started, 'end-before-start');
            row[event] = true; row[`${event}At`] = new Date().toISOString();
            this.refs.set(file, module);
            if (event !== 'queued') this.observe(module);
            if (event === 'ended') requireThat(['passed', 'failed', 'skipped'].includes(row.moduleState), 'nonterminal-module-end');
            this.flush();
          }); }
          onTestModuleQueued(m) { this.event(m, 'queued'); }
          onTestModuleCollected(m) { this.event(m, 'collected'); }
          onTestModuleStart(m) { this.event(m, 'started'); }
          onTestModuleEnd(m) { this.event(m, 'ended'); }
          onTestCaseResult(test) { this.guard(() => {
            const file = this.identify(test.module), row = this.rows.get(file);
            requireThat(this.phase === 'running' && row.started, 'case-outside-module');
            // Vitest 5 dispatches RPC update batches concurrently. A terminal module
            // callback can overtake case callbacks from an earlier batch. Only accept
            // a late callback if it exactly agrees with the already-observed terminal
            // collection; duplicate callbacks and state changes remain fatal below.
            if (row.ended) {
              const previous = this.previousTests.get(file);
              const rawState = test.result().state;
              requireThat(previous?.has(test.id) && ['passed', 'failed', 'skipped'].includes(rawState), 'contradictory-test-state');
              if (test.options.mode === 'todo') requireThat(rawState === 'skipped', 'contradictory-todo');
              const state = test.options.mode === 'todo' ? 'todo' : rawState;
              requireThat(previous.get(test.id) === state, 'contradictory-test-state');
            }
            const key = `${file}\0${test.id}`;
            requireThat(!this.caseEvents.has(key), 'duplicate-case-result');
            requireThat(test.result().state !== 'pending', 'pending-case-result');
            this.caseEvents.add(key); this.observe(test.module); this.flush();
          }); }
          hook(hook, delta) { this.guard(() => {
            requireThat(['beforeAll','afterAll','beforeEach','afterEach'].includes(hook.name), 'invalid-hook');
            const module = hook.entity.type === 'module' ? hook.entity : hook.entity.module;
            const row = this.rows.get(this.identify(module));
            requireThat(this.phase === 'running' && row.started && !row.ended, 'hook-outside-module');
            requireThat(delta === 1 || row.activeHooks[hook.name] > 0, 'hook-end-before-start');
            row.activeHooks[hook.name] += delta;
            row[delta === 1 ? 'hookStarts' : 'hookEnds']++;
            this.flush();
          }); }
          onHookStart(hook) { this.hook(hook, 1); }
          onHookEnd(hook) { this.hook(hook, -1); }
          onTestRunEnd(modules, errors, reason) { this.guard(() => {
            requireThat(this.phase === 'running' && ['passed', 'failed', 'interrupted'].includes(reason), 'invalid-run-end');
            const actual = modules.map(m => this.identify(m));
            requireThat(new Set(actual).size === actual.length, 'duplicate-final-module');
            for (const module of modules) { const row = this.rows.get(this.identify(module)); requireThat(row.ended || reason === 'interrupted', 'unended-final-module'); this.observe(module); }
            requireThat([...this.rows.values()].filter(r => r.ended).every(r => actual.includes(r.file)), 'omitted-final-module');
            this.unhandledErrorCount = errors.length; this.reason = reason;
            requireThat(reason !== 'passed' || (!errors.length && this.selected.every(f => { const r = this.rows.get(f); return r.ended && ['passed','skipped'].includes(r.moduleState) && !r.counts.failed && !r.counts.pending && !r.moduleErrorCount; })), 'contradictory-run-result');
            this.phase = 'ended'; this.flush();
          }); }
        }

