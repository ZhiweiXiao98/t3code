        \ => f.ended && f.counts && f.counts.pending === 0),\n      missing: files.filter(f => f.status === 'missing').map(f => f.file),\n      inFlight: files.filter(f => f.status === 'in-flight').map(f => f.file),\n      failedModules: files.filter(f => f.moduleState === 'failed' || f.moduleErrorCount > 0).map(f => f.file), files,\n    });\n  }\n  onInit(vitest) { this.guard(() => { requireThat(vitest.version === '5.0.5', 'runner-version'); }); }\n  onTestRunStart(specs) { this.guard(() => {\n    requireThat(this.phase === 'initialized', 'duplicate-run');\n    const actual = specs.map(s => this.identify(s)).sort();\n    requireThat(JSON.stringify(actual) === JSON.stringify(this.selected), 'specification-mismatch');\n    this.phase = 'running'; this.flush();\n  }); }\n  event(module, event) { this.guard(() => {\n    requireThat(this.phase === 'running', 'event-outside-run');\n    const file = this.identify(module), row = this.rows.get(file);\n    requireThat(!row[event] && !row.ended, 'duplicate-or-late-event');\n\
        \    if (event !== 'queued') requireThat(row.queued, 'event-before-queue');\n    if (event === 'collected') requireThat(!row.started, 'collection-after-start');\n    if (event === 'ended') requireThat(row.started, 'end-before-start');\n    row[event] = true; row[`${event}At`] = new Date().toISOString();\n    this.refs.set(file, module);\n    if (event !== 'queued') this.observe(module);\n    if (event === 'ended') requireThat(['passed', 'failed', 'skipped'].includes(row.moduleState), 'nonterminal-module-end');\n    this.flush();\n  }); }\n  onTestModuleQueued(m) { this.event(m, 'queued'); }\n  onTestModuleCollected(m) { this.event(m, 'collected'); }\n  onTestModuleStart(m) { this.event(m, 'started'); }\n  onTestModuleEnd(m) { this.event(m, 'ended'); }\n  onTestCaseResult(test) { this.guard(() => {\n    const file = this.identify(test.module), row = this.rows.get(file);\n    requireThat(this.phase === 'running' && row.started, 'case-outside-module');\n    // Vitest 5 dispatches RPC\
        \ update batches concurrently. A terminal module\n    // callback can overtake case callbacks from an earlier batch. Only accept\n    // a late callback if it exactly agrees with the already-observed terminal\n    // collection; duplicate callbacks and state changes remain fatal below.\n    if (row.ended) {\n      const previous = this.previousTests.get(file);\n      const rawState = test.result().state;\n      requireThat(previous?.has(test.id) && ['passed', 'failed', 'skipped'].includes(rawState), 'contradictory-test-state');\n      if (test.options.mode === 'todo') requireThat(rawState === 'skipped', 'contradictory-todo');\n      const state = test.options.mode === 'todo' ? 'todo' : rawState;\n      requireThat(previous.get(test.id) === state, 'contradictory-test-state');\n    }\n    const key = `${file}\\0${test.id}`;\n    requireThat(!this.caseEvents.has(key), 'duplicate-case-result');\n    requireThat(test.result().state !== 'pending', 'pending-case-result');\n    this.caseEvents.add(key);\
        \ this.observe(test.module); this.flush();\n  }); }\n  hook(hook, delta) { this.guard(() => {\n    requireThat(['beforeAll','afterAll','beforeEach','afterEach'].includes(hook.name), 'invalid-hook');\n    const module = hook.entity.type === 'module' ? hook.entity : hook.entity.module;\n    const row = this.rows.get(this.identify(module));\n    requireThat(this.phase === 'running' && row.started && !row.ended, 'hook-outside-module');\n    requireThat(delta === 1 || row.activeHooks[hook.name] > 0, 'hook-end-before-start');\n    row.activeHooks[hook.name] += delta;\n    row[delta === 1 ? 'hookStarts' : 'hookEnds']++;\n    this.flush();\n  }); }\n  onHookStart(hook) { this.hook(hook, 1); }\n  onHookEnd(hook) { this.hook(hook, -1); }\n  onTestRunEnd(modules, errors, reason) { this.guard(() => {\n    requireThat(this.phase === 'running' && ['passed', 'failed', 'interrupted'].includes(reason), 'invalid-run-end');\n    const actual = modules.map(m => this.identify(m));\n    requireThat(new\
