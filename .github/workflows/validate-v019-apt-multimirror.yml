name: Probe signed Ubuntu multi-mirror fallback
'on':
  push:
    branches:
    - validation/v0.1.9-apt-multimirror-372d279fe81e
permissions:
  contents: read
concurrency:
  group: v019-apt-kernel-probe-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 372d279fe81e7be0dccc09a13d907651d6f7aafe
  SOURCE_TREE: 6d9f9b3ef1363f998ad0299a6d30370e86637a04
  EXPECTED_BRANCH: validation/v0.1.9-apt-multimirror-372d279fe81e
jobs:
  probe:
    name: Ubuntu APT probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-22.04
        - ubuntu-24.04
    steps:
    - name: Verify exact operation source
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import json,os
        x=json.load(open(os.environ['GITHUB_EVENT_PATH']))
        assert os.environ['GITHUB_REPOSITORY']=='ZhiweiXiao98/t3code'
        assert x['repository']['private'] is False
        assert os.environ['GITHUB_EVENT_NAME']=='push'
        assert os.environ['GITHUB_REF']=='refs/heads/'+os.environ['EXPECTED_BRANCH']
        assert x['after']==os.environ['GITHUB_SHA']
        PYTHON
        git init .
        git remote add origin https://github.com/ZhiweiXiao98/t3code.git
        git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
        test "$(git rev-parse FETCH_HEAD^)" = "$SOURCE_SHA"
        test "$(git rev-list --parents -n 1 FETCH_HEAD | wc -w)" -eq 2
        test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
        test "$(git diff --name-only "$SOURCE_SHA" FETCH_HEAD)" = .github/workflows/validate-v019-apt-multimirror.yml
        git sparse-checkout set --no-cone '/*' '!/.repos/'
        git checkout --detach "$SOURCE_SHA"
    - name: Prepare command-scoped official Ubuntu source copies
      shell: bash
      run: |
        set -euo pipefail
        umask 022
        probe="$(mktemp -d /tmp/t3-apt-probe.XXXXXX)"
        chmod 755 "$probe"
        echo "APT_PROBE=$probe" >> "$GITHUB_ENV"
        cat > "$probe/prepare_sources.py" <<'PYTHON'
        import hashlib
        import json
        import pathlib
        import re
        import sys

        MIRRORS = ['https://archive.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu', 'https://ftp.osuosl.org/pub/ubuntu']
        MIRROR = 'mirror+file:/etc/apt/apt-mirrors.txt'
        OFFICIAL = {'https://archive.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu'}
        DIRECT = {'http://azure.archive.ubuntu.com/ubuntu', 'http://archive.ubuntu.com/ubuntu', 'http://security.ubuntu.com/ubuntu', *OFFICIAL}

        def rewrite(text, suffix, mirror_uri):
            def uri(value):
                value = value.rstrip('/')
                if value == MIRROR:
                    return mirror_uri
                if value in DIRECT:
                    return mirror_uri
                raise ValueError('Unrecognized Ubuntu source URI')
            if suffix == '.list':
                output = []
                for line in text.splitlines():
                    match = re.match(r'^(\s*deb(?:-src)?\s+(?:\[[^\]]*\]\s+)?)(\S+)(\s+.*)$', line)
                    if not match or match[2].rstrip('/') not in DIRECT | {MIRROR}:
                        continue
                    assert not re.search(r'(?:trusted|allow-insecure|allow-weak|allow-downgrade-to-insecure)\s*=\s*yes', line, re.I)
                    output.append(match[1] + uri(match[2]) + match[3])
                return '\n'.join(output) + '\n' if output else ''
            output = []
            for block in re.split(r'\n\s*\n', text.strip()):
                match = re.search(r'^URIs:\s*(.+)$', block, re.M | re.I)
                if not match:
                    continue
                values = match[1].split()
                if not any(x.rstrip('/') in DIRECT | {MIRROR} for x in values):
                    continue
                assert all(x.rstrip('/') in DIRECT | {MIRROR} for x in values), 'Mixed Ubuntu and unknown URI stanza'
                assert not re.search(r'^(?:Trusted|Allow-Insecure|Allow-Weak|Allow-Downgrade-To-Insecure):\s*yes\s*$', block, re.M | re.I)
                assert not re.match(r'\n[ \t]+\S', block[match.end():]), 'Multiline URIs unsupported'
                output.append(block[:match.start()] + 'URIs: ' + ' '.join(uri(x) for x in values) + block[match.end():])
            return '\n\n'.join(output) + '\n' if output else ''

        def prepare(root, output):
            root, output = pathlib.Path(root), pathlib.Path(output)
            output.mkdir(exist_ok=True)
            parts = output / 'sources.list.d'
            parts.mkdir()
            paths = [root / 'sources.list'] + sorted((root / 'sources.list.d').glob('*.list')) + sorted((root / 'sources.list.d').glob('*.sources'))
            mirror = root / 'apt-mirrors.txt'
            urls = []
            if mirror.exists():
                urls = [line.split()[0].rstrip('/') for line in mirror.read_text().splitlines() if line.strip() and not line.lstrip().startswith('#')]
                urls = list(dict.fromkeys(x for x in urls if x in OFFICIAL))
            urls = MIRRORS
            copied = output / 'official-mirrors.txt'
            copied.write_text('\n'.join(urls) + '\n')
            sources = []
            before = {str(mirror): hashlib.sha256(mirror.read_bytes()).hexdigest()} if mirror.exists() else {}
            for path in paths:
                if not path.exists():
                    continue
                raw = path.read_bytes()
                before[str(path)] = hashlib.sha256(raw).hexdigest()
                converted = rewrite(raw.decode(), path.suffix, 'mirror+file:' + str(copied))
                if converted.strip():
                    if MIRROR in raw.decode():
                        assert urls, 'No existing official HTTPS fallback mirror'
                    target = output / 'sources.list' if path.name == 'sources.list' else parts / path.name
                    target.write_text(converted)
                    sources.append(str(target))
            assert sources, 'No recognized Ubuntu sources'
            (output / 'sources.list').touch(exist_ok=True)
            assert before == {path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in before}
            (output / 'source-inventory.json').write_text(json.dumps({'original_sha256': before, 'copied_sources': sources, 'official_mirrors': urls, 'mirror_evidence': ['https://packages.ubuntu.com/jammy/amd64/global/download', 'https://ftp.osuosl.org/pub/ubuntu/']}, indent=2))
            return before

        if __name__ == '__main__':
            prepare(sys.argv[1], sys.argv[2])
        PYTHON
        python3 "$probe/prepare_sources.py" /etc/apt "$probe/sources"
        mkdir -p "$probe/lists/partial" "$probe/cache/archives/partial" "$RUNNER_TEMP/apt-evidence"
        sudo chown _apt:root "$probe/lists/partial" "$probe/cache/archives/partial"
        cp "$probe/sources/source-inventory.json" "$RUNNER_TEMP/apt-evidence/"
        cat /etc/os-release

        . /etc/os-release
        echo "UBUNTU_CODENAME=$VERSION_CODENAME" >> "$GITHUB_ENV"
        cat > "$probe/verify_evidence.py" <<'PYTHON'
        import datetime
        import email.utils
        import hashlib
        import json
        import os
        import pathlib
        import re
        import subprocess
        import sys

        KEYRING = '/usr/share/keyrings/ubuntu-archive-keyring.gpg'

        def fields(text):
            result = {}
            for line in text.splitlines():
                if line and not line[0].isspace() and ':' in line:
                    key, value = line.split(':', 1)
                    result[key] = value.strip()
            return result

        def release_fields(text, codename, now):
            assert text.startswith('-----BEGIN PGP SIGNED MESSAGE-----'), 'Unsigned Release'
            data = fields(text)
            assert data.get('Origin') == 'Ubuntu' and data.get('Label') == 'Ubuntu'
            assert data.get('Codename') == codename
            assert data.get('Suite') in {codename, codename + '-updates', codename + '-backports', codename + '-security'}
            date = email.utils.parsedate_to_datetime(data['Date'])
            assert date.tzinfo and date <= now + datetime.timedelta(minutes=10), 'Future Release date'
            valid = data.get('Valid-Until')
            if valid:
                expiry = email.utils.parsedate_to_datetime(valid)
                assert expiry.tzinfo and expiry > now, 'Expired Release'
            assert 'SHA256' in data, 'Missing signed index hashes'
            return {key: data.get(key) for key in ['Origin', 'Label', 'Suite', 'Codename', 'Date', 'Valid-Until', 'Architectures', 'Components']}

        def options(probe):
            return ['-o', f'Dir::Etc::sourcelist={probe}/sources/sources.list', '-o', f'Dir::Etc::sourceparts={probe}/sources/sources.list.d', '-o', f'Dir::State::lists={probe}/lists', '-o', f'Dir::Cache={probe}/cache']

        def verify_releases(probe, codename):
            now = datetime.datetime.now(datetime.timezone.utc)
            result = []
            key = pathlib.Path(KEYRING)
            assert key.is_file()
            inventory = json.loads((probe / 'sources/source-inventory.json').read_text())
            assert inventory['official_mirrors'] == ['https://archive.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu', 'https://ftp.osuosl.org/pub/ubuntu']
            for path in sorted((probe / 'lists').glob('*_InRelease')):
                signed = subprocess.run(['gpgv', '--status-fd=1', '--keyring', KEYRING, str(path)], capture_output=True, text=True, check=True)
                fingerprints = re.findall(r'^\[GNUPG:\] VALIDSIG ([A-F0-9]+) ', signed.stdout, re.M)
                assert fingerprints, 'No verified Ubuntu archive signature'
                record = release_fields(path.read_text(), codename, now)
                record.update(sha256=hashlib.sha256(path.read_bytes()).hexdigest(), signers=fingerprints)
                result.append(record)
            assert {x['Suite'] for x in result} == {codename, codename + '-updates', codename + '-backports', codename + '-security'}, 'Missing signed suite'
            return {'verified_at': now.isoformat(), 'keyring_sha256': hashlib.sha256(key.read_bytes()).hexdigest(), 'releases': result, 'validity_note': 'Default APT validity checks unchanged. Ubuntu base suites may omit Valid-Until; absence is recorded, not synthesized. Any present expired date is rejected.'}

        def verify_packages(probe):
            result = []
            for path in sorted((probe / 'cache/archives').glob('*.deb')):
                name, version, arch = subprocess.check_output(['dpkg-deb', '--show', '--showformat=${Package}\t${Version}\t${Architecture}', str(path)], text=True).split('\t')
                metadata = subprocess.check_output(['apt-cache', *options(probe), 'show', f'{name}={version}'], text=True)
                records = [fields(x) for x in metadata.split('\n\n')]
                matches = [x for x in records if x.get('Package') == name and x.get('Version') == version and x.get('Architecture') == arch and 'SHA256' in x]
                digest = hashlib.sha256(path.read_bytes()).hexdigest()
                assert matches and all(x['SHA256'] == digest for x in matches), 'Package digest mismatch'
                result.append({'package': name, 'version': version, 'architecture': arch, 'sha256': digest, 'bytes': path.stat().st_size})
            assert result, 'No downloaded package hash evidence'
            return result

        if __name__ == '__main__':
            mode = sys.argv[1]
            probe = pathlib.Path(os.environ['APT_PROBE'])
            result = verify_releases(probe, os.environ['UBUNTU_CODENAME']) if mode == 'releases' else verify_packages(probe)
            output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apt-evidence' / (mode + '-verified.json')
            output.write_text(json.dumps(result, indent=2))
            print(json.dumps(result, indent=2))
        PYTHON

        cat > "$probe/apt.conf" <<EOF
        Dir::Etc::sourcelist "$probe/sources/sources.list";
        Dir::Etc::sourceparts "$probe/sources/sources.list.d";
        Dir::State::lists "$probe/lists";
        Dir::Cache "$probe/cache";
        Acquire::Retries "1";
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        APT::Update::Error-Mode "any";
        APT::Keep-Downloaded-Packages "true";
        Binary::apt-get::APT::Keep-Downloaded-Packages "true";
        EOF
    - name: Inventory preinstalled and cached public packages
      shell: bash
      run: |
        set -euo pipefail
        dpkg-query -W -f='${Package}\t${Version}\t${Status}\n' libsecret-1-dev pkg-config build-essential imagemagick fonts-noto-color-emoji fonts-ipafont-gothic fonts-freefont-ttf fonts-tlwg-loma-otf fonts-unifont fonts-wqy-zenhei xfonts-encodings xfonts-utils xfonts-cyrillic xfonts-scalable > "$RUNNER_TEMP/apt-evidence/preinstalled.txt" 2>&1 || true
        python3 - <<'PYTHON'
        import hashlib,json,os,pathlib,subprocess
        records=[]
        for p in pathlib.Path('/var/cache/apt/archives').glob('*.deb'):
         info=subprocess.check_output(['dpkg-deb','--show','--showformat=${Package} ${Version} ${Architecture}',str(p)],text=True)
         records.append({'filename':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'package':info})
        (pathlib.Path(os.environ['RUNNER_TEMP'])/'apt-evidence/original-cache.json').write_text(json.dumps(records,indent=2))
        print('Cached archive count:',len(records))
        PYTHON
    - name: Inventory candidate mirror DNS
      shell: bash
      timeout-minutes: 2
      run: |
        set -euo pipefail
        for host in archive.ubuntu.com security.ubuntu.com ftp.osuosl.org; do timeout 15s getent ahosts "$host" || true; done
    - name: Verify OSUOSL fallback signed metadata independently
      shell: bash
      timeout-minutes: 4
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import datetime,hashlib,importlib.util,json,os,pathlib,re,subprocess
        p=pathlib.Path(os.environ['APT_PROBE']);spec=importlib.util.spec_from_file_location('verify',p/'verify_evidence.py');v=importlib.util.module_from_spec(spec);spec.loader.exec_module(v)
        code=os.environ['UBUNTU_CODENAME'];records=[]
        for suffix in ['', '-updates', '-backports', '-security']:
         url='https://ftp.osuosl.org/pub/ubuntu/dists/'+code+suffix+'/InRelease';dest=p/('osuosl-'+code+suffix+'.InRelease')
         subprocess.run(['curl','--fail','--silent','--show-error','--proto','=https','--connect-timeout','10','--max-time','30',url,'-o',str(dest)],check=True)
         signed=subprocess.run(['gpgv','--status-fd=1','--keyring',v.KEYRING,str(dest)],capture_output=True,text=True,check=True)
         signers=re.findall(r'^\[GNUPG:\] VALIDSIG ([A-F0-9]+) ',signed.stdout,re.M);assert signers
         record=v.release_fields(dest.read_text(),code,datetime.datetime.now(datetime.timezone.utc));assert record['Suite']==code+suffix
         record.update(url=url,signers=signers,sha256=hashlib.sha256(dest.read_bytes()).hexdigest());records.append(record)
        (pathlib.Path(os.environ['RUNNER_TEMP'])/'apt-evidence/osuosl-signed-metadata.json').write_text(json.dumps(records,indent=2));print(json.dumps(records,indent=2))
        PYTHON
    - name: Verify signed Ubuntu metadata with scoped sources
      timeout-minutes: 4
      shell: bash
      run: |
        set -euo pipefail
        options=(-o "Dir::Etc::sourcelist=$APT_PROBE/sources/sources.list" -o "Dir::Etc::sourceparts=$APT_PROBE/sources/sources.list.d" -o "Dir::State::lists=$APT_PROBE/lists" -o "Dir::Cache=$APT_PROBE/cache" -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any)
        timeout --kill-after=15s 180s sudo apt-get "${options[@]}" update 2>&1 | tee "$RUNNER_TEMP/apt-evidence/update.log"
        python3 "$APT_PROBE/verify_evidence.py" releases
    - name: Install and hash-verify required libraries and complete font set
      timeout-minutes: 6
      shell: bash
      run: |
        set -euo pipefail
        options=(-o "Dir::Etc::sourcelist=$APT_PROBE/sources/sources.list" -o "Dir::Etc::sourceparts=$APT_PROBE/sources/sources.list.d" -o "Dir::State::lists=$APT_PROBE/lists" -o "Dir::Cache=$APT_PROBE/cache" -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any)
        options+=(-o APT::Keep-Downloaded-Packages=true -o Binary::apt-get::APT::Keep-Downloaded-Packages=true)
        timeout --kill-after=15s 300s sudo apt-get "${options[@]}" install -y libsecret-1-dev pkg-config build-essential imagemagick fonts-noto-color-emoji fonts-ipafont-gothic fonts-freefont-ttf fonts-tlwg-loma-otf fonts-unifont fonts-wqy-zenhei xfonts-encodings xfonts-utils xfonts-cyrillic xfonts-scalable 2>&1 | tee "$RUNNER_TEMP/apt-evidence/install.log"
        dpkg-query -W libsecret-1-dev pkg-config build-essential imagemagick fonts-noto-color-emoji fonts-ipafont-gothic fonts-freefont-ttf fonts-tlwg-loma-otf fonts-unifont fonts-wqy-zenhei xfonts-encodings xfonts-utils xfonts-cyrillic xfonts-scalable > "$RUNNER_TEMP/apt-evidence/packages.txt"
        python3 "$APT_PROBE/verify_evidence.py" packages
    - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
      with:
        node-version: 26.12.1
        run-install: false
        cache: true
    - name: Install frozen repository dependencies without root
      shell: bash
      run: vp install --frozen-lockfile
    - name: Install actual pinned Playwright dependencies with scoped APT
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python3 -B - <<'PYTHON'
        import importlib.util,os,pathlib,subprocess,shlex
        spec=importlib.util.spec_from_file_location('helper','.github/scripts/ci-ubuntu-packages.py');h=importlib.util.module_from_spec(spec);spec.loader.exec_module(h)
        p=pathlib.Path(os.environ['APT_PROBE']);config=p/'apt.conf'
        actual=subprocess.check_output(['sudo','env','APT_CONFIG='+str(config),'apt-config','shell','SOURCES','Dir::Etc::sourcelist','PARTS','Dir::Etc::sourceparts','LISTS','Dir::State::lists','CACHE','Dir::Cache'],text=True)
        assert dict(item.split('=',1) for item in shlex.split(actual))=={'SOURCES':str(p/'sources/sources.list'),'PARTS':str(p/'sources/sources.list.d'),'LISTS':str(p/'lists'),'CACHE':str(p/'cache')}
        for command in h.command_plan('playwright',['apps/server/node_modules/playwright-core/cli.js'],config):
         subprocess.run(['timeout','--kill-after=15s','480s',*command],check=True)
        PYTHON
        python3 "$APT_PROBE/verify_evidence.py" releases
        python3 "$APT_PROBE/verify_evidence.py" packages
    - name: Verify original APT source files unchanged
      if: always() && env.APT_PROBE != ''
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import hashlib,json,os,pathlib
        p=pathlib.Path(os.environ['APT_PROBE'])/'sources/source-inventory.json'
        x=json.loads(p.read_text())
        assert x['original_sha256']=={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in x['original_sha256']}
        print('Original APT source bytes unchanged; no DNS, proxy, keyring, TLS or signature setting modified.')
        PYTHON
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
        git diff --exit-code
        git diff --cached --exit-code
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: apt-probe-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/apt-evidence/
        if-no-files-found: error
        retention-days: 7
