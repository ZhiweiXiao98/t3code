name: Compare repaired synthetic AVX2 gather
on:
  push:
    branches: [validation/v0.1.9-gather-fixed-20261113]
permissions:
  contents: read
concurrency:
  group: t3-synthetic-gather-fixed-20261113
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'ZhiweiXiao98/t3code' && github.run_attempt == 1 && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch only frozen synthetic helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          parents="$(timeout 15 gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '[.parents[].sha] | join(",")')"
          [[ "$parents" == '58ee32779c5dc5576ecdf5f007da1402839dfd50' ]]
          timeout --kill-after=5s 90s gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/gather-source.tar.gz"
          python3 - "$RUNNER_TEMP/gather-source.tar.gz" "$GITHUB_WORKSPACE" <<'PY'
          import pathlib, sys, tarfile
          archive=pathlib.Path(sys.argv[1]); workspace=pathlib.Path(sys.argv[2])
          if archive.stat().st_size>512*1024**2: raise ValueError('source_budget')
          expected={'probe.c','probe.S','build.sh','run_probe.py','test_probe.py','common.py','guest.py','host.py','prepare.py','test_wrapper.py','manifest.json','build_diag.py','test_diag.py'}
          selected={}
          with tarfile.open(archive,'r:gz') as source:
           for count,item in enumerate(source):
            if count>=100000: raise ValueError('source_budget')
            p=pathlib.PurePosixPath(item.name)
            if p.is_absolute() or '..' in p.parts or '\\' in item.name: raise ValueError('source_path')
            if len(p.parts)<4 or p.parts[1:3]!=('diagnostics','gather-compare-fixed') or item.isdir(): continue
            if len(p.parts)!=4 or p.name not in expected or p.name in selected or not item.isfile() or item.issym() or item.islnk() or item.sparse is not None or not 0<item.size<=65536: raise ValueError('source_member')
            data=source.extractfile(item).read(65537)
            if len(data)!=item.size: raise ValueError('source_size')
            selected[p.name]=data
          if set(selected)!=expected: raise ValueError('source_files')
          target=workspace/'diagnostics/gather-compare-fixed'; target.mkdir(parents=True,exist_ok=False)
          for name,data in selected.items(): (target/name).write_bytes(data)
          PY
      - name: Verify frozen manifest and local-only fixtures
        working-directory: diagnostics/gather-compare-fixed
        run: |
          set -euo pipefail
          echo 'd628d90c987ec6511559b6f888060a32815672e049eaddc0bfbfdf81d9cbf814  manifest.json' | sha256sum -c -
          timeout --kill-after=5s 30s python3 -m unittest test_probe test_wrapper test_diag -v
      - name: Attempt exact official package setup once
        id: prepare
        working-directory: diagnostics/gather-compare-fixed
        run: timeout --kill-after=5s 250s python3 prepare.py "$RUNNER_TEMP/gather-packages" "$RUNNER_TEMP/gather-public"
      - name: Compile the frozen static binary once
        working-directory: diagnostics/gather-compare-fixed
        run: |
          set -euo pipefail
          timeout --kill-after=5s 30s python3 build_diag.py . "$RUNNER_TEMP/gather-public/build.json" --retain-probe
      - name: Native gate then at most one TCG guest
        working-directory: diagnostics/gather-compare-fixed
        run: timeout --kill-after=5s 910s python3 host.py --execute-reviewed-operation --work "$RUNNER_TEMP/gather-vm" --public "$RUNNER_TEMP/gather-public"
      - name: Retain only small fixed JSON receipts
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-gather-fixed-20261113
          path: |
            ${{ runner.temp }}/gather-public/preparation.json
            ${{ runner.temp }}/gather-public/comparison.json
            ${{ runner.temp }}/gather-public/build.json
          if-no-files-found: error
          retention-days: 30
