          """Synthetic offline collector tests, no network or real raw-byte proof."""
          import unittest,json,tempfile,copy,hashlib
          from pathlib import Path
          from unittest.mock import patch
          import collect as C
          class Tests(unittest.TestCase):
           def fixture(self):
            p=json.loads(Path(__file__).with_name('pins.json').read_text());jobs=[];raws={};c=[]
            for x in [p['artifact'],*p['raw_reports'].values()]:
             jid=x['producer_job_id'];jobs.append({'id':jid,'steps':[{'name':x['upload_step_name'],'started_at':'2026-11-16T00:00:00Z','completed_at':'2026-11-16T23:59:59Z'}]})
             lines=['SHA256 digest of uploaded artifact is '+x['sha256'],'Artifact '+x['name']+' successfully finalized. Artifact ID '+str(x['id']),'Artifact '+x['name']+' has been successfully uploaded! Final size is '+str(x['size'])+' bytes. Artifact ID is '+str(x['id'])]
             raw=''.join('2026-11-16T12:00:00Z '+l+'\n' for l in lines).encode();raws[jid]=raw;c.append({'producer_job_id':jid,'producer_log_connector_utf8_sha256':hashlib.sha256(raw).hexdigest()})
            class API:
             def json(self,path):
              if path!='/actions/workflows/412799956':raise ValueError('Unscoped API')
              return {'id':412799956,'path':'.github/workflows/client-coverage.yml'}
             def download_log(self,jid,path):Path(path).write_bytes(raws[jid])
            return p,c,jobs,raws,API()
           def test_positive(self):
            p,c,j,r,a=self.fixture()
            with tempfile.TemporaryDirectory() as t,patch.object(C.V,'current_state',return_value={'jobs':j,'run':{'workflow_id':412799956}}):
             out=C.collect(a,p,c,t);self.assertTrue(out['all_decoded_candidates_match']);self.assertEqual(len(out['logs']),6);self.assertFalse(out['raw_logs_exported']);self.assertFalse(out['signing_authorized']);self.assertNotIn('2026-11-16T12',json.dumps(out))
           def test_mismatch_recorded_not_silently_passed(self):
            p,c,j,r,a=self.fixture();c[0]['producer_log_connector_utf8_sha256']='0'*64
            with tempfile.TemporaryDirectory() as t,patch.object(C.V,'current_state',return_value={'jobs':j,'run':{'workflow_id':412799956}}):self.assertFalse(C.collect(a,p,c,t)['all_decoded_candidates_match'])
           def test_wrong_run_jobs_upload_and_race(self):
            for mode in ['run','job','upload','race','workflow']:
             p,c,j,r,a=self.fixture()
             if mode=='run':p['workflow']['run_id']=1
             if mode=='job':p['artifact']['producer_job_id']=1
             if mode=='upload':r[p['artifact']['producer_job_id']]=b'not a verified upload'
             with tempfile.TemporaryDirectory() as t,patch.object(C.V,'current_state',side_effect=[{'jobs':j,'run':{'workflow_id':1 if mode=='workflow' else 412799956}},{'jobs':[]} if mode=='race' else {'jobs':j,'run':{'workflow_id':412799956}}]):
              with self.assertRaises(ValueError):C.collect(a,p,c,t)
          if __name__=='__main__':unittest.main()
          FIXED_FILE
      - name: Verify offline scoped collector contracts
        run: python3 "$RUNNER_TEMP/raw-collector/test_collect.py"
      - name: Read exact successful run metadata and original log bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/raw-collector/collect.py"
      - name: Preserve only bounded numeric and digest metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-raw-log-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw-log-evidence/raw-log-metadata.json
          if-no-files-found: error
          retention-days: 14
