name: Diagnose pinned AppImage renderer crash
on:
  push:
    branches: [validation/v0.1.9-appimage-indexed-diagnostic-042e]
permissions:
  contents: read
  actions: read
concurrency:
  group: t3-appimage-indexed-diagnostic-042e
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Fetch exact reviewed helpers without initializing historical gitlinks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" == "ZhiweiXiao98/t3code" ]]
          timeout 300 gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/diagnostic-source.tar.gz"
          python3 - "$RUNNER_TEMP/diagnostic-source.tar.gz" "$GITHUB_WORKSPACE" <<'PYEXTRACT'
          import pathlib,sys,tarfile
          archive=pathlib.Path(sys.argv[1]);workspace=pathlib.Path(sys.argv[2]).resolve()
          if archive.stat().st_size>512*1024**2:raise ValueError('Source archive budget exceeded')
          selected=[];seen=set();total=0
          with tarfile.open(archive,'r:gz') as source:
           for count,member in enumerate(source):
            if count>=100000:raise ValueError('Source member budget exceeded')
            path=pathlib.PurePosixPath(member.name)
            if path.is_absolute() or '..' in path.parts or '\\' in member.name:raise ValueError('Unsafe source path')
            if len(path.parts)<4 or path.parts[1:3]!=('diagnostics','appimage'):continue
            relative=pathlib.PurePosixPath(*path.parts[1:])
            if member.isdir():continue
            if not member.isfile() or member.issym() or member.islnk() or member.sparse is not None:raise ValueError('Unsafe diagnostic member')
            if str(relative) in seen or member.size<0 or member.size>2*1024**2:raise ValueError('Duplicate or oversized diagnostic member')
            seen.add(str(relative));total+=member.size
            if total>8*1024**2:raise ValueError('Diagnostic payload budget exceeded')
            data=source.extractfile(member).read(member.size+1)
            if len(data)!=member.size:raise ValueError('Truncated diagnostic member')
            selected.append((relative,data))
          if len(selected)!=41:raise ValueError('Unexpected diagnostic file count')
          if (workspace/'diagnostics').exists():raise ValueError('Workspace must have no pre-existing diagnostic files')
          for relative,data in selected:
           target=workspace/relative;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);target.chmod(0o644)
          PYEXTRACT
      - name: Verify and test reviewed diagnostic helpers
        working-directory: diagnostics/appimage
        run: |
          set -euo pipefail
          echo '3da41aef32e60988ed57dcf786adecc9b2faf082c181c6dc7b7e377d9e649433  operation.json' | sha256sum -c -
          python3 verify_payload.py
          python3 -m unittest test_operation test_privacy_transport test_cancel test_progress test_diagnostic_errors -v
          node test-hook.cjs
          node test-inspector-order.cjs
      - name: Fetch pinned existing packages without building an application
        working-directory: diagnostics/appimage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 download_inputs.py "$RUNNER_TEMP/diagnostic-inputs"
      - name: Prepare official diagnostic tools
        working-directory: diagnostics/appimage
        run: |
          set -euo pipefail
          python3 ci-ubuntu-packages.py packages --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          mkdir "$RUNNER_TEMP/diagnostic-tools"
          cd "$RUNNER_TEMP/diagnostic-tools"
          curl --proto '=https' --proto-redir '=https' --fail --location --max-time 300 https://github.com/electron/electron/releases/download/v44.10.1/electron-v44.10.1-linux-x64-symbols.zip -o symbols.zip
          echo '9c497198ec2e5b0c097a5a10434255d26d10e467c6670b3115e4c00df68e0d43  symbols.zip' | sha256sum -c -
          curl --proto '=https' --proto-redir '=https' --fail --location --max-time 120 https://static.crates.io/crates/minidump-stackwalk/minidump-stackwalk-0.27.0.crate -o stackwalk.crate
          echo 'e9527f1e47fc491d3645f7d372d10bed80307774209489fd7828291c71b0237a  stackwalk.crate' | sha256sum -c -
          tar --extract --gzip --file stackwalk.crate --no-same-owner
          timeout 900 cargo build --release --locked --manifest-path minidump-stackwalk-0.27.0/Cargo.toml
          curl --proto '=https' --proto-redir '=https' --fail --location --max-time 120 https://registry.npmjs.org/playwright-core/-/playwright-core-1.60.0.tgz -o playwright.tgz
          echo '8b1df81ba75e90a41eb5c996350ea7ecc1c915ea643ec55138f91c949c5a25bf  playwright.tgz' | sha256sum -c -
      - name: Test pinned controller transformation
        working-directory: diagnostics/appimage
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/diagnostic-tools/test-pw"
          tar -xzf "$RUNNER_TEMP/diagnostic-tools/playwright.tgz" -C "$RUNNER_TEMP/diagnostic-tools/test-pw"
          TEST_PLAYWRIGHT_BUNDLE="$RUNNER_TEMP/diagnostic-tools/test-pw/package/lib/coreBundle.js" python3 -m unittest test_helpers -v
      - name: Prove symbol supplier lookup using public fixture before any app run
        working-directory: diagnostics/appimage
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/diagnostic-tools"
          curl --proto '=https' --proto-redir '=https' --fail --location --max-time 60 https://raw.githubusercontent.com/rust-minidump/rust-minidump/4adf5555b2ab844f23c52982fc202357ff882695/testdata/test.dmp -o "$tools/public-test.dmp"
          echo '24b0ea7794b2d2523c46c9aea72c03ccbb0ab88ad76d8258d3752c7b71d233ff  '"$tools/public-test.dmp" | sha256sum -c -
          PUBLIC_FIXTURE="$tools/public-test.dmp" python3 -m unittest test_symbol_index -v
          python3 test_index_supplier.py --binary "$tools/minidump-stackwalk-0.27.0/target/release/minidump-stackwalk" --fixture "$tools/public-test.dmp"
      - name: Execute each bounded diagnostic cell once
        working-directory: diagnostics/appimage
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/diagnostic-tools"
          binary="$tools/minidump-stackwalk-0.27.0/target/release/minidump-stackwalk"
          binary_hash="$(sha256sum "$binary" | cut -d' ' -f1)"
          mkdir "$RUNNER_TEMP/diagnostic-public"
          for cell in candidate control; do
            timeout --kill-after=40s 2700 python3 diagnostic_host.py --execute-reviewed-operation --cell "$cell" \
              --work "$RUNNER_TEMP/diagnostic-$cell" \
              --installer-zip "$RUNNER_TEMP/diagnostic-inputs/$cell-installer.zip" \
              --proof-zip "$RUNNER_TEMP/diagnostic-inputs/$cell-proof.zip" \
              --playwright-tar "$tools/playwright.tgz" --symbols-zip "$tools/symbols.zip" \
              --stackwalker "$binary" --stackwalker-sha256 "$binary_hash"
            python3 retain_public.py "$RUNNER_TEMP/diagnostic-$cell" "$RUNNER_TEMP/diagnostic-public/$cell"
          done
          python3 compare_cells.py "$RUNNER_TEMP/diagnostic-public"
      - name: Upload only validated diagnostic exports
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: appimage-indexed-diagnostic-042e
          path: |
            ${{ runner.temp }}/diagnostic-public/candidate/diagnostic.json
            ${{ runner.temp }}/diagnostic-public/candidate/manifest.json
            ${{ runner.temp }}/diagnostic-public/control/diagnostic.json
            ${{ runner.temp }}/diagnostic-public/control/manifest.json
          if-no-files-found: error
          retention-days: 7
